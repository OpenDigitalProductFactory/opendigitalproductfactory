title = "DPF Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Generated dependency, build, cache, and report artifacts are not source material."
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)\.turbo/''',
  '''(^|/)coverage/''',
  '''(^|/)playwright-report/''',
  '''(^|/)test-results/''',
]

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Edge event runKey UUID examples are idempotency identifiers, not credentials."
condition = "AND"
regexTarget = "line"
regexes = [
  '''"runKey"\s*:\s*"[0-9a-fA-F-]{36}"''',
  '''runKey:\s*"[0-9a-fA-F-]{36}"''',
]
paths = [
  '''^apps/web/app/api/v1/edge/''',
  '''^docs/edge-node/event-envelope\.md$''',
]

[[allowlists]]
targetRules = ["generic-api-key"]
description = "OAuth client IDs are public identifiers; client secrets remain scanned."
condition = "AND"
regexTarget = "line"
regexes = [
  '''GITHUB_OAUTH_CLIENT_ID\s*=\s*"[^"]+"''',
  '''"oauthClientId"\s*:\s*"[^"]+"''',
]
paths = [
  '''^apps/web/lib/integrate/github-oauth\.ts$''',
  '''^packages/db/data/providers-registry\.json$''',
]

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Restore-backup epic ID mapping uses fixture CUIDs and backlog codes, not secrets."
condition = "AND"
regexTarget = "match"
regexes = [
  '''EP-[A-Z0-9-]+",\s+"[a-z0-9]{25}''',
]
paths = [
  '''^packages/db/scripts/restore-backup\.ts$''',
]

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Audit findings documents reference INQ-* inquiry IDs generated by the storefront. These are system-assigned reference numbers, not credentials."
condition = "AND"
regexTarget = "match"
regexes = [
  '''INQ-[A-Z0-9-]{5,}''',
]
paths = [
  '''^docs/testing/''',
]

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Backlog recovery bundle recoveryKey values are <itemId>-<activityId> idempotency handles, not credentials. The activity id is a database CUID and is deliberately part of the key: buildBacklogRecoveryBundle derives it from stable identifiers rather than array position so re-import does not duplicate activities. The bundle parser constrains the field to a lowercase semantic key."
condition = "AND"
regexTarget = "line"
regexes = [
  '''"recoveryKey"\s*:\s*"[a-z0-9][a-z0-9-]{2,79}"''',
]
paths = [
  '''^packages/db/recovery/backlog/''',
]

[[allowlists]]
description = "Test-only PKI fixtures for the federation membership-proof tests: a throwaway organization CA, a member leaf and a stranger leaf with their PKCS8 keys. Generated once with openssl, never used by any install (EP-ZERO-CONFIG-FEDERATION §5.6)."
paths = [
  '''(^|/)apps/web/lib/federation/membership-fixtures\.ts$''',
]
