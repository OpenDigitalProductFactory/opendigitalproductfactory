# DPF Authority Core — TLS reverse proxy overlay.
#
# Adds a Caddy sidecar that terminates HTTPS on :443 and reverse-
# proxies to the portal container on :3000. Designed to layer on top
# of the standard compose project:
#
#   export DPF_TLS_DIR=~/.dpf/tls
#   bash scripts/issue-authority-tls-cert.sh --hostname dpf-authority.lan
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Edge Nodes on the LAN can then point at https://dpf-authority.lan:443
# with NODE_EXTRA_CA_CERTS=<path to ca-bundle.crt> and get a TLS-
# protected enrollment + heartbeat + discovery-runs path.
#
# Spec:    docs/superpowers/specs/2026-05-09-dpf-edge-node-design.md
# Plan:    docs/superpowers/plans/2026-05-12-edge-node-t2-multi-host-lan.md (T2.2)
# Helper:  scripts/issue-authority-tls-cert.sh
#
# This overlay is OPTIONAL. The Phase 0 single-host demo doesn't need
# it; the T2 multi-host demo does need it (or a real CA-issued cert
# via your existing PKI). Phase 0's authentication model is bearer
# tokens; this overlay adds transport confidentiality on top of that
# but is not mTLS — that's T4.

services:
  portal-tls:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped

    # Caddy listens on :80 (for HTTP→HTTPS redirect) and :443 (TLS).
    # The portal still listens on :3000 inside the compose network;
    # Caddy proxies to it. Operators who only want HTTPS exposed
    # externally should firewall :3000 at the host level.
    ports:
      - "${DPF_TLS_HTTP_PORT:-80}:80"
      - "${DPF_TLS_HTTPS_PORT:-443}:443"
      # Dedicated mTLS-only Edge action listener. Caddy exposes no other
      # portal route on this port.
      - "${DPF_EDGE_ACTION_HTTPS_PORT:-8443}:8443"

    volumes:
      # Cert + key + Caddyfile generated by
      # scripts/issue-authority-tls-cert.sh. The default DPF_TLS_DIR
      # is ~/.dpf/tls per the helper script; override via env if you
      # generated the certs elsewhere.
      - ${DPF_TLS_DIR:-~/.dpf/tls}:/etc/caddy/tls:ro
      - ${DPF_TLS_DIR:-~/.dpf/tls}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    # Caddy needs to reach the portal by its compose network name.
    # The default compose network handles this automatically when
    # both services share the project.
    depends_on:
      portal:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - --no-check-certificate
        - https://localhost/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
