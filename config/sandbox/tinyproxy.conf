# Build Studio sandbox egress proxy (agent sandbox containment design, AC-2).
# Deny by default; allow only the hosts in egress-allowlist.txt.
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 200
LogLevel Notice
# Forward-proxy only: plain HTTP and HTTPS CONNECT, never other ports.
ConnectPort 443
ConnectPort 80
Filter "/etc/tinyproxy/egress-allowlist.txt"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
DisableViaHeader Yes
