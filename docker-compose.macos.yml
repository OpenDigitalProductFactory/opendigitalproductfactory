# macOS deployment overlay (Apple Silicon, Docker Desktop).
#
# Usage:
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.release.yml \
#                  -f docker-compose.macos.yml up -d
#
# (or use scripts/installer/lib/compose.sh which assembles the chain
#  for you per the host platform.)
#
# Per the deployment doctrine:
#   - LLM provider default on Mac + Docker Desktop is the built-in
#     Docker Model Runner (Doctrine Contract 9). The base
#     docker-compose.yml already defaults LLM_BASE_URL to
#     http://model-runner.docker.internal/v1, so no override is needed
#     here — the value is repeated below as a documentation anchor so
#     contributors and operators don't have to grep the base file.
#
#   - The linux-monitoring profile (cadvisor + node-exporter) is
#     intentionally NOT enabled on macOS. Their /proc, /sys,
#     /var/lib/docker, and rootfs bind mounts cannot work on macOS;
#     the base compose's profile gating ensures they don't even start
#     when this overlay is in effect. Host metrics on macOS rely on
#     Docker Desktop's own observability or external tooling per the
#     Deployment Support Matrix.
#
#   - host.docker.internal is provided automatically by Docker Desktop;
#     the extra_hosts entries in the base docker-compose.yml are
#     harmless but redundant on this substrate.
#
# This overlay deliberately stays thin. Its job is to be the canonical
# location for future macOS-specific deltas without forcing changes to
# the base compose; today the deltas are mostly absent because Docker
# Desktop's defaults align with the platform's needs.

services:
  portal:
    environment:
      # Re-stating the Docker Desktop default for clarity. The base
      # compose's `${LLM_BASE_URL:-http://model-runner.docker.internal/v1}`
      # already resolves to this on Docker Desktop, but operators
      # overriding LLM_BASE_URL elsewhere can rely on this overlay
      # value to scope the override to non-macOS deployments.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://model-runner.docker.internal/v1}

  browser-use:
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://model-runner.docker.internal/v1}
