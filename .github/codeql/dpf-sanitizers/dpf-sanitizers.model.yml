# DPF security-helper sanitiser declarations.
#
# SCOPE — local CodeQL CLI only. These rows take effect when you run
# `codeql database analyze --additional-packs .github/codeql/dpf-sanitizers
# --model-packs dpf/sanitizers`. They do NOT take effect in GitHub code
# scanning: a repo-local pack can't be referenced from `packs:`, and code
# scanning doesn't honour JS/TS model packs at all. JS/TS false positives in
# code scanning are dismissed-with-justification instead. Any "Closes alert
# #NNN" note below describes the local-CLI effect; the corresponding Security-
# tab alert is resolved by dismissal. See docs/security/codeql-advanced-setup.md.
#
# Each entry below tells CodeQL "this function takes a tainted value
# and returns a sanitised one." The taint flow through the function is
# broken, so callers stop seeing false-positive alerts for js/request-
# forgery, js/command-line-injection, etc.
#
# Format reference:
#   https://docs.github.com/en/code-security/codeql-cli/using-the-advanced-functionality-of-the-codeql-cli/customizing-library-models-for-javascript
#
# Each row in summaryModel:
#   [namespace, type, path, input, output, kind, provenance]
# where `kind: "taint"` means the function clears taint from input → output.

extensions:
  # ─── safe-fetch — js/request-forgery sanitiser ───────────────────────────
  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # assertSafeOutboundUrl validates scheme + private-network + host
      # allowlist; the returned URL carries no taint to its callers.
      - ["safe-fetch", "Module", "Member[assertSafeOutboundUrl]", "Argument[0]", "ReturnValue", "taint", "manual"]

  # ─── safe-spawn — js/command-line-injection sanitiser ────────────────────
  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # assertAllowedBinary looks up the input in ALLOWED_BINARIES (constant
      # Record) and returns the constant value. The returned string is
      # therefore from a constant set — equivalent to a hardcoded sink arg.
      - ["safe-spawn", "Module", "Member[assertAllowedBinary]", "Argument[0]", "ReturnValue", "taint", "manual"]

  # ─── public-web-tools — js/request-forgery sanitiser ─────────────────────
  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # assertAllowedPublicUrl is the analogue of safe-fetch's
      # assertSafeOutboundUrl for the public-web-tools surface. It throws
      # on private IPs / disallowed schemes; the returned URL is safe.
      - ["public-web-tools", "Module", "Member[assertAllowedPublicUrl]", "Argument[0]", "ReturnValue", "taint", "manual"]

  # ─── codebase-tools makeLineMatcher — js/regex-injection accepted FP ─────
  - addsTo:
      pack: codeql/javascript-all
      extensible: neutralModel
    data:
      # The project-search feature INTENTIONALLY compiles user-supplied
      # regex with bounded length (MAX_QUERY_LEN) + quantifier-count gate.
      # Declared neutral so the alert doesn't recur.
      - ["codebase-tools", "Module", "Member[makeLineMatcher]", "ReturnValue", "manual"]

  # ─── safe-log — js/log-injection sanitiser ───────────────────────────────
  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # sanitizeForLog strips C0 control characters (U+0000..U+001F) and
      # DEL (U+007F) — including CR + LF — so the returned string cannot
      # forge a log line. Breaks taint flow for js/log-injection (CWE-117).
      - ["safe-log", "Module", "Member[sanitizeForLog]", "Argument[0]", "ReturnValue", "taint", "manual"]

  # ─── media-storage — js/http-to-file-access sanitiser ───────────────────
  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # prepareMediaBlobContentForStorage validates the buffer's mime type
      # (probeImage rejects anything outside DEFAULT_MEDIA_BLOB_MIME_TYPES)
      # AND enforces DEFAULT_MEDIA_BLOB_MAX_BYTES before returning a branded
      # ValidatedMediaBlobContent. Bytes reaching writeMediaBlob/fs.writeFile
      # have cleared both gates — the network → file dataflow is no longer
      # arbitrary file upload (CWE-434/CWE-912). Closes alert #269.
      - ["media-storage", "Module", "Member[prepareMediaBlobContentForStorage]", "Argument[0]", "ReturnValue", "taint", "manual"]

  # ─── safe-property — js/remote-property-injection guard ──────────────────
  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # isSafeKey returns false for the three keys that can mutate the
      # prototype chain (__proto__, constructor, prototype). Used as
      # `if (!isSafeKey(k)) continue;` it acts as a taint-clearing barrier
      # for the computed-property write that follows.
      - ["safe-property", "Module", "Member[isSafeKey]", "Argument[0]", "ReturnValue", "taint", "manual"]
      # assertSafeKey throws on the same three keys; surviving the call
      # implies the key was safe.
      - ["safe-property", "Module", "Member[assertSafeKey]", "Argument[0]", "ReturnValue", "taint", "manual"]

  # ─── insecure-temporary-file note (no model pack entry) ──────────────────
  # CodeQL's js/insecure-temporary-file query pattern-matches on
  # `randomUUID()` (or other crypto-random sources) appearing INLINE in
  # the temp-path expression. It does not follow taint through wrapper
  # functions, so declaring a `secureTempPath()` helper as neutralModel
  # does NOT close alerts on its callers. The accepted DPF pattern is
  # therefore to inline the construction:
  #
  #   const tmp = `${tmpdir()}/prefix-${randomUUID()}.ext`;
  #
  # See callsites in git-backup.ts / git-utils.ts / audio-storage.ts.
