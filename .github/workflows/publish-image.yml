name: Publish Docker Images

# Multi-arch (linux/amd64 + linux/arm64) GHCR publish for every
# installed-runtime image referenced by the installer's default
# compose chain.
#
# Architecture: matrix of (image × platform) on native-arch runners,
# pushed by-digest, then merged into a single multi-arch manifest list.
#
# Why native-arch runners instead of QEMU cross-compile:
#   The prior single-job design built both archs on ubuntu-latest via
#   QEMU emulation. linux/arm64 of the Next.js portal under QEMU runs
#   ~10x slower than native, and v3.1.0 timed out at the GHA 6-hour
#   per-job cap mid-portal-build. Splitting onto native runners
#   (ubuntu-latest for amd64, ubuntu-24.04-arm for arm64) brings the
#   portal build back under ~15 min and lets the other four images
#   build in parallel.
#
# Why digest-then-merge instead of `--platform amd64,arm64`:
#   build-push-action only supports the dual-platform syntax via
#   buildx-with-QEMU. With native matrix jobs, each runner pushes a
#   single-arch image referenced by its content digest; the merge job
#   uses `docker buildx imagetools create` to assemble the multi-arch
#   manifest list under the immutable tag (e.g. dpf-portal:v2026.08.21).
#   `latest` is a separate, verification-gated promotion - see promote-latest.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable image tag to publish (e.g. v2026.08.21). Empty = this run's ref name."
        required: false
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Stage 0: Single-shot host gate ──────────────────────────────
  # Runs typecheck on the host once. Cheaper than re-doing it inside
  # every matrix cell, and it fails fast before the matrix burns
  # runner-minutes on a broken commit.
  gate:
    name: Typecheck gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Resolved once here so merge, verify and promote-latest cannot disagree
      # about which tag this run is publishing. Previously each job recomputed
      # it, which is how `latest` ended up meaning two different things inside
      # one run.
      tag: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve the immutable tag for this run
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"

          # `latest` is a PROMOTION result now, not something a run may publish
          # directly — promoting it is what the verify gate below guards. A run
          # that wrote it straight from the build would walk around that gate,
          # which is exactly the failure this workflow had on 2026-08-16.
          if [ "${TAG}" = "latest" ]; then
            echo "::error::Refusing to publish the mutable 'latest' tag directly. Pass an immutable tag (e.g. v2026.08.21); 'latest' is promoted automatically once E2E install verification passes."
            exit 1
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::Could not resolve a tag for this run."
            exit 1
          fi

          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing under immutable tag: ${TAG}"

      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.33.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dpf/db exec prisma generate

      - name: Typecheck (all packages)
        run: pnpm typecheck

  # ─── Stage 1: Per-arch by-digest builds ──────────────────────────
  # Each matrix cell builds ONE image for ONE architecture on a native
  # runner and pushes by digest (no human-readable tag). Outputs are
  # collected via the artifact bridge for stage 2.
  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: gate
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: dpf-portal
            context: .
            file: Dockerfile
            target: runner
          - name: dpf-sandbox
            context: .
            file: Dockerfile.sandbox
            target: ""
          - name: dpf-promoter
            context: .
            file: Dockerfile.promoter
            target: ""
          - name: dpf-browser-use
            context: ./services/browser-use
            file: ./services/browser-use/Dockerfile
            target: ""
          - name: dpf-adp
            context: .
            file: services/adp/Dockerfile
            target: ""
          - name: dpf-edge-node
            context: .
            file: services/edge-node/Dockerfile
            target: ""
          # postgres is BUILT in the base compose (baked pgvector + inngest init,
          # deliberately no host bind mount). Without publishing it, a consumer
          # install has no database image and `up` tries to build from a ./docker
          # context that a no-checkout install does not have.
          - name: dpf-postgres
            context: .
            file: docker/postgres/Dockerfile
            target: ""
        platform:
          - arch: amd64
            runner: ubuntu-latest
            tag_suffix: linux-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            tag_suffix: linux-arm64

    steps:
      # lfs: true is load-bearing, not hygiene. This job supplies the image build
      # context, and `.dockerignore` deliberately admits
      # docs/Reference/IT4IT_Functional_Criteria_Taxonomy.xlsx so Dockerfile can
      # COPY it. Without an LFS fetch, checkout leaves that path as a 130-byte
      # pointer stub, the COPY bakes the stub in, and every install's
      # eaReferenceModels seed step dies on "invalid zip data" with the IT4IT and
      # BIAN reference models never importing (BI-FEE26C36). The Dockerfile
      # asserts materialization, so removing this input fails the build rather
      # than shipping a broken release.
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Bind promoter image to its release contract
        id: promoter-contract
        run: echo "digest=$(sha256sum promoter-contract.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      # CodeQL actions/unpinned-tag #101-#103: 3rd-party actions pinned to
      # immutable commit SHAs (with version trailing comment) so a compromised
      # docker/* maintainer cannot retroactively repoint the v4/v7 tag at
      # malicious code. Renovate / Dependabot can still bump these in PRs;
      # the SHA is the cryptographically verifiable handle.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          provenance: mode=max
          sbom: true
          # Stamp the published image's source identity (/app/.dpf-image-version)
          # with the release commit SHA so /ops/self-upgrade can compare a
          # customer's deployed image to the upgrade target. Without this the
          # Dockerfile falls back to a content hash that never matches a git SHA,
          # leaving freshness checks permanently inert on customer installs.
          # Harmless for images whose Dockerfile ignores DPF_VERSION.
          build-args: |
            DPF_VERSION=${{ github.sha }}
            DPF_PLATFORM_VERSION=${{ needs.gate.outputs.tag }}
            DPF_PROMOTER_SOURCE_SHA=${{ github.sha }}
            DPF_PROMOTER_RELEASE_TAG=${{ needs.gate.outputs.tag }}
            DPF_PROMOTER_RELEASE_OWNER=${{ steps.owner.outputs.value }}
            DPF_PROMOTER_CONTRACT_DIGEST=sha256:${{ steps.promoter-contract.outputs.digest }}
          # Same identity, in the OCI-standard place. /app/.dpf-image-version is inside
          # the filesystem, so reading it costs a `docker create` + `docker cp`; a label
          # is readable straight from the manifest. `latest` sat 1851 commits behind main
          # for ~7 weeks and nothing caught it, partly because the only identity was one
          # no tool would think to look for. Keep both: the file is what the running
          # portal self-reports, the label is what tooling inspects.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.gate.outputs.tag }}
          # Push by digest only — the merge job assembles the named
          # tag manifest list. `type=image,name=...,push-by-digest=true`
          # uploads the layers under the digest with no human tag.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        # Save the per-image+arch digest to a tiny file so the merge
        # job can fetch all six via the artifact bridge.
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/${{ matrix.image.name }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.image.name }}/${digest#sha256:}.${{ matrix.platform.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/${{ matrix.image.name }}/*
          if-no-files-found: error
          retention-days: 1

  # ─── Stage 2: Assemble multi-arch manifest lists ─────────────────
  # One merge job per image. Each downloads the per-arch digests and
  # uses `docker buildx imagetools create` to point the immutable tag
  # (vX.Y.Z) at a manifest list referencing both arch digests.
  merge:
    name: Merge ${{ matrix.image }} manifest
    runs-on: ubuntu-latest
    needs: [build, gate]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - dpf-portal
          - dpf-sandbox
          - dpf-promoter
          - dpf-browser-use
          - dpf-adp
          - dpf-edge-node
          - dpf-postgres

    steps:
      - uses: actions/checkout@v7

      # CodeQL actions/unpinned-tag #104-#105: SHA-pin in the merge job too.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Download per-arch digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Create multi-arch manifest list
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}"
          TAG="${{ needs.gate.outputs.tag }}"

          # Collect every digest file produced by the build matrix for
          # this image and turn them into fully-qualified
          # "image@sha256:..." references for imagetools.
          mapfile -t REFS < <(
            for f in /tmp/digests/*; do
              # Filename pattern: <digest-no-prefix>.<arch>
              digest_only="${f##*/}"
              digest_only="${digest_only%.*}"
              echo "${IMAGE}@sha256:${digest_only}"
            done
          )

          if [[ ${#REFS[@]} -eq 0 ]]; then
            echo "::error::No per-arch digests found for ${IMAGE}"
            exit 1
          fi

          # Immutable tag ONLY. `latest` is repointed by promote-latest once
          # E2E install verification passes. Publishing it here put unverified
          # images straight in front of customers, because installs
          # self-upgrade against `latest`.
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            "${REFS[@]}"

      - name: Verify multi-arch manifest
        # Per the installer-parity roadmap Phase 1 exit gate: every
        # installed-runtime image must publish both linux/amd64 and
        # linux/arm64. Fail loudly if either is missing.
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}"
          TAG="${{ needs.gate.outputs.tag }}"

          docker buildx imagetools inspect "${IMAGE}:${TAG}"

          raw="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --raw)"
          echo "$raw" | grep -q '"architecture": "amd64"' \
            || { echo "::error::Missing linux/amd64 in ${IMAGE}:${TAG}"; exit 1; }
          echo "$raw" | grep -q '"architecture": "arm64"' \
            || { echo "::error::Missing linux/arm64 in ${IMAGE}:${TAG}"; exit 1; }

  # ─── Stage 3: End-to-end install verification ────────────────────
  # Runs install-dpf.sh in --release mode against the manifest lists
  # we just published. Lives in this workflow (rather than a separate
  # workflow_run-chained one) to avoid the cache-poisoning pattern
  # CodeQL flags on workflow_run + privileged checkout of head_sha
  # (rule actions/cache-poisoning/poisonable-step). The body is
  # identical to the manual-dispatch install-verification.yml.
  verify:
    name: E2E install verification (release mode)
    needs: [merge, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    env:
      # Pin the install to the tag this run just published. Without this,
      # docker-compose.release.yml resolves ${DPF_IMAGE_TAG:-latest} and the
      # gate would install the PREVIOUS `latest` — verifying the wrong images
      # and then promoting untested ones. The installer only ever reads
      # DPF_IMAGE_TAG out of .env, never writes it, so the shell environment
      # is what compose interpolates here.
      DPF_IMAGE_TAG: ${{ needs.gate.outputs.tag }}
      DPF_MODEL_PULL_MODE: skip
      DPF_HEALTH_TIMEOUT: 900
      DPF_HEALTH_URL: http://localhost:3000/api/health
    steps:
      - uses: actions/checkout@v7

      # The full release stack no longer fits in the ~14 GB a stock
      # ubuntu-latest runner leaves free: v6.0.0 and v6.1.0 both died
      # mid-install with the runner worker itself crashing on "No space
      # left on device" (v5.6.0 was the last release that still fit).
      # Reclaim the ~25 GB of preinstalled toolchains this job never
      # touches. Inline rm rather than a third-party action to keep the
      # supply-chain surface at zero.
      - name: Free runner disk space
        run: |
          echo "Disk before reclaim:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules
          sudo docker image prune --all --force
          echo "Disk after reclaim:"
          df -h /

      - name: Show docker context
        run: |
          docker --version
          docker compose version
          docker info | head -30

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.33.2 --activate

      - name: Verify digest-pinned release compose image manifests
        run: node scripts/release/verify-compose-image-manifests.mjs --mode release --platform linux --only digest-pinned

      - name: Run install-dpf.sh (release mode, --no-autostart for CI)
        run: bash install-dpf.sh --headless --release --no-autostart

      - name: Verify /api/health response shape
        run: |
          set -euo pipefail
          curl --silent --fail "$DPF_HEALTH_URL" > /tmp/health.json
          cat /tmp/health.json
          test -s /tmp/health.json
          if command -v jq >/dev/null 2>&1; then
            jq -e '(.ok // .status // "ok") != null' /tmp/health.json
          fi

      - name: Capture docker compose ps + portal logs
        if: always()
        run: |
          docker compose -p dpf ps || true
          echo "---"
          docker compose -p dpf logs --tail=50 portal || true

      - name: Capture doctor bundle
        if: always()
        run: bash install-dpf.sh doctor || true

      - name: Upload doctor bundle artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: doctor-bundle-release-${{ github.run_id }}
          path: /home/runner/.dpf/doctor-*.tar.gz
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Tear down (uninstall --purge)
        if: always()
        run: bash uninstall-dpf.sh --purge --headless --yes || true

  # ─── Stage 4: Promote `latest` ───────────────────────────────────
  # `latest` is what customer installs self-upgrade against, so it moves ONLY
  # after stage 3 proves the freshly published images actually install. Until
  # 2026-08-16 the merge job wrote it alongside the immutable tag, which meant
  # a run whose E2E verification failed had already shipped to every install
  # (run 31954043204: 12/12 builds green, 6/6 merges green, verify FAILED,
  # `latest` already repointed). BI-FA7ECEF0.
  #
  # Retagging from the immutable tag — rather than re-assembling from digests —
  # guarantees `latest` and the verified tag are the same bytes.
  promote-latest:
    name: Promote ${{ matrix.image }} to latest
    needs: [verify, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - dpf-portal
          - dpf-sandbox
          - dpf-promoter
          - dpf-browser-use
          - dpf-adp
          - dpf-edge-node
          - dpf-postgres

    steps:
      # CodeQL actions/unpinned-tag: SHA-pinned, matching the merge job.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Repoint latest at the verified manifest
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}"

          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${TAG}"

          # The retag must preserve both architectures; a single-arch `latest`
          # silently breaks arm64 installs.
          raw="$(docker buildx imagetools inspect "${IMAGE}:latest" --raw)"
          echo "$raw" | grep -q '"architecture": "amd64"'             || { echo "::error::Missing linux/amd64 in ${IMAGE}:latest"; exit 1; }
          echo "$raw" | grep -q '"architecture": "arm64"'             || { echo "::error::Missing linux/arm64 in ${IMAGE}:latest"; exit 1; }

          echo "Promoted ${IMAGE}:${TAG} -> :latest"
