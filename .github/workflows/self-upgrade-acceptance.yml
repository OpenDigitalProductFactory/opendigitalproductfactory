name: Self-upgrade compatibility acceptance

on:
  pull_request:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  packages: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sensitive: ${{ steps.paths.outputs.sensitive }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        # BI-9E5E6063: github.event.pull_request.base.sha can go stale against a
        # fast-moving main and does not self-refresh. Recompute merge-base when
        # full history is available (fetch-depth:0 above).
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin main
            FRESH_BASE="$(git merge-base HEAD origin/main 2>/dev/null || true)"
            BASE_SHA="${FRESH_BASE:-$EVENT_BASE}"
            if [ -n "$EVENT_BASE" ] && [ -n "$FRESH_BASE" ] && [ "$EVENT_BASE" != "$FRESH_BASE" ]; then
              echo "::notice::github.event.pull_request.base.sha ($EVENT_BASE) disagrees with merge-base ($FRESH_BASE) — using the fresh one. See BI-9E5E6063."
            fi
            paths=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
            node scripts/self-upgrade-sensitive-paths.mjs $paths >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          fi

  acceptance:
    needs: classify
    if: needs.classify.outputs.sensitive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DPF_N1_PROJECT: dpf-n1-${{ github.run_id }}-${{ github.run_attempt }}
      DPF_N1_EVIDENCE: ${{ github.workspace }}/.dpf-n1-evidence
      DPF_PROMOTER_READINESS_PROTOCOL_FLOOR_SHA: 21969d012ad8ab382d47a2c59ffc955530796bd2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fast harness invariants
        run: |
          test "$(node -p "require('./promoter-contract.json').readinessProtocolFloorSha")" = "$DPF_PROMOTER_READINESS_PROTOCOL_FLOOR_SHA"
          node --test scripts/self-upgrade-sensitive-paths.test.mjs scripts/test-n-minus-one-upgrade.test.mjs
      - name: Build candidate promoter with immutable contract identity
        run: |
          contract_digest="sha256:$(sha256sum promoter-contract.json | cut -d' ' -f1)"
          image="dpf-promoter-acceptance:${GITHUB_SHA}"
          docker build \
            --build-arg "DPF_PROMOTER_SOURCE_SHA=${GITHUB_SHA}" \
            --build-arg "DPF_PROMOTER_CONTRACT_DIGEST=${contract_digest}" \
            -f Dockerfile.promoter -t "$image" .
          image_digest="$(docker image inspect "$image" --format '{{.Id}}')"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opendpf.promoter.contract-digest"}}')" = "$contract_digest"
          mkdir -p "$DPF_N1_EVIDENCE" "$RUNNER_TEMP/dpf-state" "$RUNNER_TEMP/dpf-backups"
          printf '%s\n' "{\"candidateSha\":\"${GITHUB_SHA}\",\"candidateDigest\":\"${image_digest}\",\"contractDigest\":\"${contract_digest}\"}" > "$DPF_N1_EVIDENCE/artifact.json"
          echo "DPF_ACCEPTANCE_IMAGE=$image" >> "$GITHUB_ENV"
      # BI-A04D61B9: the promoter build context is staged by the DEPLOYED (N-1)
      # portal from a list baked into ITS image, while Dockerfile.promoter is
      # candidate-owned. Building the candidate from the candidate's own context
      # proves nothing about that pairing — which is the only pairing an actual
      # upgrade uses. #4462 added one COPY and made every already-deployed portal
      # unable to build the candidate at all (SUR-75DAF829). This step rebuilds
      # the candidate promoter from a context staged by the PREVIOUS release's
      # closure, and proves the resulting image still satisfies the readiness
      # contract.
      - name: Candidate promoter is buildable by an N-1 caller's staged context
        run: |
          git fetch --quiet origin main || true
          base="$(git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD^)"
          echo "N-1 closure taken from $base"
          git show "${base}:apps/web/lib/self-upgrade/promoter-build-context.ts" > "$RUNNER_TEMP/n1-context.ts"
          node -e '
            const fs = require("node:fs");
            const source = fs.readFileSync(process.argv[1], "utf8");
            const start = source.indexOf("PROMOTER_BUILD_CONTEXT_SOURCES");
            const open = source.indexOf("[", source.indexOf("=", start));
            const close = source.indexOf("]", open);
            const entries = [...source.slice(open + 1, close).matchAll(/"([^"]+)"/g)].map(([, v]) => v);
            if (entries.length === 0) { console.error("N-1 closure empty"); process.exit(1); }
            process.stdout.write(entries.join("\n") + "\n");
          ' "$RUNNER_TEMP/n1-context.ts" > "$RUNNER_TEMP/n1-sources.txt"
          ctx="$RUNNER_TEMP/n1ctx"
          rm -rf "$ctx"; mkdir -p "$ctx"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if [ ! -f "$file" ]; then
              echo "::notice::$file was in the N-1 closure but not in the candidate tree — not staged"
              continue
            fi
            mkdir -p "$ctx/$(dirname "$file")"
            cp "$file" "$ctx/$file"
          done < "$RUNNER_TEMP/n1-sources.txt"
          cp Dockerfile.promoter "$ctx/Dockerfile.promoter"
          echo "staged $(find "$ctx" -type f | wc -l) file(s) from the N-1 closure"
          n1_image="dpf-promoter-n1ctx:${GITHUB_SHA}"
          docker build -f "$ctx/Dockerfile.promoter" -t "$n1_image" "$ctx"
          # Buildable is necessary but not sufficient: the image an N-1 caller
          # produces must still satisfy every readiness-enforced requiredFile.
          docker run --rm --entrypoint sh "$n1_image" -c '
            missing=0
            for f in $(node -e "const c=require(\"/app/promoter-contract.json\"); process.stdout.write((c.requiredFiles||[]).join(\" \"))"); do
              if [ ! -r "$f" ]; then echo "MISSING required file: $f"; missing=1; fi
            done
            [ "$missing" -eq 0 ] || exit 1
            echo "N-1-built promoter satisfies every contract requiredFile"
          ' | tee "$DPF_N1_EVIDENCE/n1-context-build.txt"
      - name: Signed promotion rollback restores exact legacy state
        run: |
          node --test scripts/promote-install-state-rollback.test.mjs \
            | tee "$DPF_N1_EVIDENCE/signed-promotion-rollback.tap"
      - name: Promotion keeps a pre-existing install's LAN exposure through the portal swap
        # BI-55A30F8B: the portal is recreated before the installer writes
        # DPF_HOST_BIND_ADDRESS; the promoter must carry the pre-existing
        # exposure itself or a LAN install goes dark mid-upgrade.
        run: |
          node --test scripts/promote-host-bind-address.test.mjs \
            | tee "$DPF_N1_EVIDENCE/promotion-host-bind-address.tap"
      - name: Resolve N-1 baseline
        id: baseline
        # BI-9E5E6063: prefer a live merge-base over a potentially stale
        # pull_request.base.sha event field.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            git fetch --quiet origin main
            FRESH_BASE="$(git merge-base HEAD origin/main 2>/dev/null || true)"
            BASE_SHA="${FRESH_BASE:-$PR_BASE_SHA}"
            if [ -z "$BASE_SHA" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              printf '%s\n' '{"result":"skipped","reason":"no-resolvable-base-sha"}' > "$DPF_N1_EVIDENCE/n-minus-one-evidence.json"
              exit 0
            fi
            if [ -n "$PR_BASE_SHA" ] && [ -n "$FRESH_BASE" ] && [ "$PR_BASE_SHA" != "$FRESH_BASE" ]; then
              echo "::notice::PR base.sha ($PR_BASE_SHA) disagrees with merge-base ($FRESH_BASE) — using the fresh one. See BI-9E5E6063."
            fi
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&sort=updated&direction=desc&per_page=1" --jq '.[0] | [.number, .base.sha] | @tsv')"
          if [ -z "$latest" ] || [ "$latest" = $'null\tnull' ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"result":"skipped","reason":"no-open-main-pr"}' > "$DPF_N1_EVIDENCE/n-minus-one-evidence.json"
            exit 0
          fi
          IFS=$'\t' read -r pr_number base_sha <<< "$latest"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Execute real N-1 baseline-to-candidate gate
        if: github.event_name != 'pull_request' && steps.baseline.outputs.should_run == 'true'
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          candidate_ref="$GITHUB_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            candidate_ref="refs/pull/${EVENT_PR_NUMBER}/merge"
          fi
          node scripts/test-n-minus-one-upgrade.mjs \
            --base-sha "${{ steps.baseline.outputs.base_sha }}" \
            --candidate-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "${{ steps.baseline.outputs.pr_number }}" \
            --event-kind "${{ github.event_name }}" \
            --candidate-ref "$candidate_ref" \
            --project "$DPF_N1_PROJECT" \
            --evidence-dir "$DPF_N1_EVIDENCE"
      # BI-D47955AF: deliberately sends NO DPF_HOST_* env, because the real N-1 caller
      # (a portal built before the host-identity contract) cannot send it. Readiness must
      # derive identity from the mounted install-state or every existing install wedges.
      # The refusal step below keeps the explicit-env path covered.
      - name: Candidate readiness succeeds without quiescence
        run: |
          printf '\357\273\277%s\n' '{"schemaVersion":1,"installerVersion":"acceptance","platform":"linux","arch":"amd64","installPath":"/opt/dpf","stateDir":"/dpf-state","composeProjectName":"dpf"}' > "$RUNNER_TEMP/dpf-state/install-state.json"
          docker run --rm --read-only \
            -v "$PWD:/host-source:ro" \
            -v "$RUNNER_TEMP/dpf-state:/dpf-state:ro" \
            -v "$RUNNER_TEMP/dpf-backups:/backups:ro" \
            -e DPF_PROMOTER_STATE_DIR=/dpf-state \
            -e DPF_PROMOTER_DOCKER_PREFLIGHT=ready \
            -e PROMOTE_SOURCE=/host-source \
            -e PROMOTE_TARGET_SHA="$GITHUB_SHA" \
            -e PROMOTE_HEALTH_URL=http://host.docker.internal:3000/api/health \
            -e PROMOTE_COMPOSE_PROJECT="$DPF_N1_PROJECT" \
            -e PROMOTE_BACKUP_PATH=/backups/recovery \
            "$DPF_ACCEPTANCE_IMAGE" --readiness --json | tee "$DPF_N1_EVIDENCE/readiness-success.json"
          jq -e '.result == "ready" and .quiescenceBegan == false and (.failures | length == 0)' "$DPF_N1_EVIDENCE/readiness-success.json"
      # BI-AA6FBAD0: the step above seeds a schemaVersion-1 state, which is
      # UNVERSIONED for capability purposes and so skips every capability check.
      # Every live install is v2 and carries the catalog hash of the release it
      # was installed from, so that is the shape that actually breaks: the first
      # release to move the catalog wedged every existing install with
      # `capability_state_stale`, and this gate was structurally unable to see it.
      # The fixture below is the candidate's own projection restamped with a
      # previous catalog hash - exactly what an install looks like one release
      # behind.
      - name: Readiness migrates a v2 install carrying the previous catalog hash
        env:
          STATE_OUT: ${{ runner.temp }}/dpf-state/install-state.json
        run: |
          node --input-type=module -e '
            import { readFile, writeFile } from "node:fs/promises";
            const { projectInstallState } = await import("./scripts/installer/migrate-install-state.mjs");
            const { computeCapabilityStateVersion } = await import("./scripts/lib/capability-state-hash.mjs");
            const catalog = JSON.parse(await readFile("scripts/capability-service-catalog.generated.json", "utf8"));
            const baseline = { schemaVersion: 1, installerVersion: "acceptance", platform: "linux", arch: "amd64", installPath: "/opt/dpf", stateDir: "/dpf-state", composeProjectName: "dpf" };
            const hostIdentity = { platform: "linux", arch: "amd64", capabilityHostPlatform: "linux", provenance: "installer" };
            const { projectedState } = await projectInstallState({ bytes: Buffer.from(JSON.stringify(baseline)), hostIdentity, catalog });
            const previousCatalogHash = "1".repeat(64);
            const stale = {
              ...projectedState,
              capabilityCatalogHash: previousCatalogHash,
              capabilityStateVersion: computeCapabilityStateVersion(previousCatalogHash, projectedState.enabledRuntimeCapabilities, catalog.capabilities.map(({ capabilityId }) => capabilityId)),
            };
            await writeFile(process.env.STATE_OUT, `${JSON.stringify(stale, null, 2)}\n`);
          '
          docker run --rm --read-only \
            -v "$PWD:/host-source:ro" \
            -v "$RUNNER_TEMP/dpf-state:/dpf-state:ro" \
            -v "$RUNNER_TEMP/dpf-backups:/backups:ro" \
            -e DPF_PROMOTER_STATE_DIR=/dpf-state \
            -e DPF_PROMOTER_DOCKER_PREFLIGHT=ready \
            -e PROMOTE_SOURCE=/host-source \
            -e PROMOTE_TARGET_SHA="$GITHUB_SHA" \
            -e PROMOTE_HEALTH_URL=http://host.docker.internal:3000/api/health \
            -e PROMOTE_COMPOSE_PROJECT="$DPF_N1_PROJECT" \
            -e PROMOTE_BACKUP_PATH=/backups/recovery \
            "$DPF_ACCEPTANCE_IMAGE" --readiness --json | tee "$DPF_N1_EVIDENCE/readiness-stale-catalog.json"
          jq -e '.result == "ready" and .quiescenceBegan == false and (.failures | length == 0)' "$DPF_N1_EVIDENCE/readiness-stale-catalog.json"
          jq -e '.migrationRequired == true' "$DPF_N1_EVIDENCE/readiness-stale-catalog.json"
      # A readiness failure must name its cause: a bare code cost hours of live
      # diagnosis on SUR-C45B5F4B.
      - name: Invalid state refuses before quiescence
        run: |
          printf '%s\n' '{}' > "$RUNNER_TEMP/dpf-state/install-state.json"
          set +e
          docker run --rm --read-only \
            -v "$PWD:/host-source:ro" \
            -v "$RUNNER_TEMP/dpf-state:/dpf-state:ro" \
            -v "$RUNNER_TEMP/dpf-backups:/backups:ro" \
            -e DPF_PROMOTER_STATE_DIR=/dpf-state \
            -e DPF_HOST_PLATFORM=linux \
            -e DPF_HOST_ARCH=amd64 \
            -e DPF_HOST_IDENTITY_PROVENANCE=explicit \
            -e DPF_PROMOTER_DOCKER_PREFLIGHT=ready \
            -e PROMOTE_SOURCE=/host-source \
            -e PROMOTE_TARGET_SHA="$GITHUB_SHA" \
            -e PROMOTE_HEALTH_URL=http://host.docker.internal:3000/api/health \
            -e PROMOTE_COMPOSE_PROJECT="$DPF_N1_PROJECT" \
            -e PROMOTE_BACKUP_PATH=/backups/recovery \
            "$DPF_ACCEPTANCE_IMAGE" --readiness --json > "$DPF_N1_EVIDENCE/readiness-refusal.json"
          status=$?
          set -e
          test "$status" -eq 78
          jq -e '.result == "failed" and .quiescenceBegan == false and (.failures | length > 0)' "$DPF_N1_EVIDENCE/readiness-refusal.json"
          jq -e '[.failures[] | select(.message | test("failed: [a-z_]+: .+"))] | length > 0' "$DPF_N1_EVIDENCE/readiness-refusal.json"
      - name: Record bounded PR compatibility evidence
        if: github.event_name == 'pull_request'
        run: |
          jq -n \
            --arg candidate "$GITHUB_SHA" \
            --arg decision "DI-FA01D947B1FA" \
            '{result:"passed",scope:"bounded-pr-contract",candidateSha:$candidate,wwmdDecision:$decision,fullNMinusOne:"scheduled-canonical-runtime"}' \
            > "$DPF_N1_EVIDENCE/n-minus-one-evidence.json"
      - name: Safe cleanup
        if: always()
        run: node scripts/test-n-minus-one-upgrade.mjs --cleanup-project "$DPF_N1_PROJECT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: n-minus-one-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.dpf-n1-evidence
          retention-days: 30
