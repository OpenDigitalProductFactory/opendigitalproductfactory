name: Route Manifest Freshness

# CodeQL actions/missing-workflow-permissions: least-privilege default.
# Read-only freshness check; needs no write surface.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      # Route-defining files — the only changes that can make the manifest stale.
      - "apps/web/app/**/page.ts"
      - "apps/web/app/**/page.tsx"
      - "apps/web/app/**/route.ts"
      - "apps/web/app/**/route.tsx"
      # The manifest, its generator, and the row type the generator imports.
      - "apps/web/lib/ea/route-manifest.json"
      - "apps/web/scripts/build-route-manifest.ts"
      - "apps/web/lib/ea/route-extract.ts"
      # The audience registry (BI-8C0F219A) derives from the manifest above.
      - "apps/web/lib/navigation/route-audience.generated.json"
      - "apps/web/lib/navigation/route-audience.ts"
      - "apps/web/scripts/build-route-audience.ts"
      # The intended-shell registry (BI-B9BE9A29) derives from both of the above.
      - "apps/web/lib/ux-budget/route-shells.generated.json"
      - "apps/web/lib/ux-budget/route-shells.ts"
      - "apps/web/lib/ux-budget/budgets.ts"
      - "apps/web/scripts/build-route-shells.ts"
      - ".github/workflows/audit-route-manifest.yml"
  push:
    branches: [main]

concurrency:
  group: audit-route-manifest-${{ github.ref }}
  cancel-in-progress: true

# What this guard does
# --------------------
# Regenerates apps/web/lib/ea/route-manifest.json in-memory from the Next.js App
# Router tree (apps/web/app/**/{page,route}.{ts,tsx}) and fails if it differs from the
# committed file. A PR that adds, removes, or renames a route without regenerating the
# manifest is design↔implementation drift: the live SysML route projection
# (reconcile-routes.ts reads this manifest) would no longer match the actual routes.
#
# This is the enforcement leg (spec §4.3) for the Parity Engine routes domain
# (docs/superpowers/specs/2026-06-14-design-implementation-parity-engine-design.md):
# it makes the committed manifest self-policing so the navigation architecture cannot
# silently rot — automation over vigilance. Mirrors audit-architecture-parity.yml.
#
# To fix a STALE failure: pnpm --filter web build:route-manifest && commit the result.

jobs:
  freshness:
    name: Route Manifest Freshness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.33.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check route manifest is up to date
        run: pnpm --filter web check:route-manifest

      # BI-8C0F219A: the audience/destination-kind registry derives from the manifest
      # above, so it is checked right after. A new page route makes it stale (fix:
      # pnpm --filter web build:route-audience && commit); routes the heuristic can
      # only classify low-confidence are printed as a non-fatal warning to pin an
      # override in apps/web/lib/navigation/route-audience.ts.
      - name: Check route audience registry is up to date
        run: pnpm --filter web check:route-audience

      # BI-B9BE9A29 (EP-UX-SYSTEM L2): intended-shell classification is DERIVED from
      # the manifest above plus the audience registry — it is not a second hand-kept
      # list of routes. A new page route makes it stale (fix: pnpm --filter web
      # build:route-shells && commit). The registry is the classification source for
      # per-shell UX budgets, the §7.1 migration league table, and the route budget
      # sweep (BI-BD81682A).
      - name: Check route→shell registry is up to date
        run: pnpm --filter web check:route-shells
