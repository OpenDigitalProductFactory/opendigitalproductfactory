name: Schema Regression Guard

# Last-resort safety net: fail any PR that removes existing fields or model
# declarations from the Prisma schema (packages/db/prisma/schema/*.prisma).
#
# The primary defence is deploy_feature's runtime check (which blocks the
# coworker before the PR is even opened). This CI job catches edge cases:
# hand-edited branches, manual cherry-picks, or any path that bypasses
# deploy_feature.

# CodeQL actions/missing-workflow-permissions: least-privilege default.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "packages/db/prisma/schema.prisma"
      - "packages/db/prisma/schema/**"
      # Also trigger when the guard machinery itself changes so a guard
      # regression can't slip through without exercising the CI path.
      - "packages/db/scripts/schema-regression-guard.mjs"
      - ".github/workflows/schema-regression-guard.yml"

jobs:
  schema-regression-guard:
    name: Schema regression guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect removed schema fields
        # Reorder-tolerant set-based comparison per model/enum. Lives in
        # packages/db/scripts/schema-regression-guard.mjs and is reused by
        # .githooks/pre-commit (Guard 5) so contributors get the same check
        # locally as in CI. Algorithm + fixtures are covered by
        # packages/db/scripts/schema-regression-guard.test.ts.
        run: |
          git fetch origin main --depth=50
          node packages/db/scripts/schema-regression-guard.mjs origin/main
