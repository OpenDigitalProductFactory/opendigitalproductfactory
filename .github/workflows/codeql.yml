name: "CodeQL Advanced"

# Advanced-setup CodeQL workflow. Replaces the default setup so that:
#   1. The query config can be tuned per language (security-extended suite).
#   2. Per-language build modes and a weekly scheduled re-scan.
#
# NOTE: this workflow does NOT load a custom sanitiser model pack. GitHub code
# scanning cannot honour a repo-local data-extension pack, and does not support
# JS/TS model packs at all — see the long note in
# .github/codeql/codeql-config.yml. JS/TS false positives on DPF's security
# helpers are dispositioned by dismissal-with-justification in the Security tab.
#
# IMPORTANT — activation requires a one-time repo settings change:
#   Settings → Code security → "Code scanning" → CodeQL → Switch to
#   "Advanced" mode. Once switched, default setup is disabled and this
#   workflow becomes the source of truth for code scans.
#
# Until that toggle flips, this workflow is committed but inert (default
# setup keeps running). After the toggle, this file controls scans.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan to catch new CodeQL queries / model updates.
    - cron: "23 4 * * 1"

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

concurrency:
  group: codeql-advanced-${{ github.event_name }}-${{ github.ref }}
  # PR scans are superseded by newer commits. Main branch scans should finish
  # so GitHub code scanning does not surface cancelled analyses as errors.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: go
            build-mode: autobuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # continue-on-error keeps this workflow non-blocking until the one-time
      # "Settings → Code security → CodeQL → Advanced" toggle flips. While
      # default-setup is still enabled, the SARIF upload returns:
      #   "CodeQL analyses from advanced configurations cannot be processed
      #    when the default setup is enabled"
      # After the toggle, this step succeeds and the model pack takes effect.
      # The flag is harmless post-activation — the step still records green
      # on success.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/language:${{ matrix.language }}"
