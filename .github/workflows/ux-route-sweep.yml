name: UX Route Budget Sweep

# CodeQL actions/missing-workflow-permissions: least-privilege default.
permissions:
  actions: read
  contents: read

on:
  workflow_call:
    inputs:
      update_baseline:
        description: "Measure and emit a fresh route-budget baseline"
        required: false
        type: boolean
        default: false
      reuse_current_run_build:
        description: "Consume the canonical Production Build artifact from this caller run"
        required: false
        type: boolean
        default: false
      workers:
        description: "Bounded route workers"
        required: false
        type: string
        default: "2"
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Measure and emit a fresh route-budget-baseline.json artifact to arm the ratchet"
        type: boolean
        default: false
      workers:
        description: "Bounded route workers (use 1/2/4 to run the reliability experiment)"
        type: choice
        options: ["1", "2", "4"]
        default: "2"

concurrency:
  group: ux-route-sweep-${{ github.ref }}
  cancel-in-progress: true

# What this gate does
# -------------------
# EP-UX-SYSTEM spec §6 L4 / §7.1 (BI-BD81682A) — the wall-of-text gate.
#
# Boots the real portal against an ephemeral Postgres, drives every static page route
# with Playwright, measures the SERVED DOM with the L2 budget module, and applies three
# enforcement modes (apps/web/lib/ux-budget/ratchet.ts):
#
#   1. Pre-existing route -> REGRESSION RATCHET. A changed route may not exceed its own
#      frozen baseline on words, controls, fields, choices, sub-legible controls or axe
#      violations. Existing debt is reported every run but never blocks a PR that did
#      not make it worse — otherwise the gate forces a blind mass-rewrite and gets
#      disabled within a week.
#   2. Net-new route -> ABSOLUTE BUDGETS BLOCK (spec rev 2 D1). A pure ratchet freezes
#      whatever ships first, so a brand-new route would become its own baseline and
#      could be born as a wall of text. New code has no legacy excuse.
#   3. Structure -> the ARIA snapshot must not drift (rev 2 D2). Hierarchy is the
#      dominant AI failure mode and was previously unmeasured.
#
# NOT an SSR-string shortcut: a string render has neither client components nor honest
# visibility, so computed-invisible nodes are pruned in the page before measuring.
#
# BOOTSTRAP: route-budget-baseline.json ships with `bootstrapped: false`, so the sweep
# REPORTS without blocking until a reproducible measured baseline is committed. Arm it
# only after two same-SHA freezes satisfy the ratchet's mechanical reproducibility
# contract, both account for every eligible route, their conservative envelope passes an
# enforcing run, and the 1/2/4 worker experiment has selected the reliable default. See
# docs/testing/ci-evidence.md. The accepted freeze defines "pre-existing"; anything added
# later is net-new and meets the absolutes.

jobs:
  sweep:
    name: UX Route Sweep Runtime
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dpf
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: dpf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dpf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dpf:ci_test_password@localhost:5432/dpf
      ADMIN_PASSWORD: ci_admin_changeme
      NEXTAUTH_SECRET: ci_sweep_secret
      NEXTAUTH_URL: http://localhost:3000
      UX_SWEEP_BASE_URL: http://localhost:3000
      UX_SWEEP_WORKERS: ${{ inputs.workers || '2' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The seed reads the IT4IT workbook from docs/Reference, and that
          # workbook is stored in Git LFS. Without LFS, CI gets the pointer
          # file and the XLSX reader fails before eaReferenceModels can run
          # (BI-98D19DF2 — "invalid zip data" on a clean runner). Mirrors the
          # checkout in audit-routing-invariants.yml, which runs the same
          # full seed and has been green with this flag set.
          lfs: true

      - name: Setup pnpm with cache
        uses: ./.github/actions/setup-pnpm

      - name: Generate Prisma client
        run: pnpm --filter @dpf/db exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @dpf/db exec prisma migrate deploy

      # The seed exits 1 if ANY step fails, by design ("surfaced, not
      # swallowed"). BI-98D19DF2's interim eaReferenceModels tolerance
      # carve-out (PR #3445) is removed now that `lfs: true` above fixes the
      # root cause — a full, unmodified failure is a real signal again.
      - name: Seed the fixture organisation
        run: pnpm --filter @dpf/db seed

      # Complete first-run setup before the portal starts. Starting the server
      # against an incomplete install lets startup reconciliation observe and
      # reshape transient fixture state, which makes DB-backed decision routes
      # differ from the frozen authenticated baseline.
      - name: Mark platform setup complete for the fixture org
        run: pnpm --filter web ux:sweep-fixture

      # Work Control inventories the host clone's worktrees. GitHub checks out a
      # named branch for workflow_dispatch but a detached ref for pull_request,
      # so scanning the ambient checkout made /build/work change structure for
      # identical source. Give both triggers the same one-branch fixture repo.
      - name: Create deterministic Work Control repository fixture
        run: |
          fixture_root="$RUNNER_TEMP/dpf-ux-sweep-work-control"
          rm -rf "$fixture_root"
          git init --initial-branch=ux-sweep-fixture "$fixture_root"
          git -C "$fixture_root" config user.name "DPF UX Sweep"
          git -C "$fixture_root" config user.email "ux-sweep@opendigitalproductfactory.com"
          git -C "$fixture_root" commit --allow-empty -m "fixture"
          echo "DPF_WORK_CONTROL_REPO_ROOT=$fixture_root" >> "$GITHUB_ENV"

      # Browser installation is independent of the portal build. Keep it ahead
      # of the artifact rendezvous so the build, fixture, and browser paths
      # overlap instead of extending the critical path serially.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # BI-D9E8B8CB. Blocking CI and Production Build share one run identity.
      # Fixture provisioning starts concurrently with the build; after setup,
      # wait only for this run's exact named artifact. This removes workflow,
      # SHA, and source-run discovery while preserving the useful overlap.
      - name: Await current-run production build
        id: await-build
        if: inputs.reuse_current_run_build == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci-build-artifact.mjs await-current-run
          --artifact-name web-production-build-${{ github.run_id }}-${{ github.run_attempt }}
          --producer-job-name "Production Build"
          --wait-seconds 600

      - name: Start production-build transfer timer
        if: steps.await-build.outputs.found == 'true'
        run: echo "DPF_BUILD_ARTIFACT_TRANSFER_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Download exact-tree production build
        id: download-build
        if: steps.await-build.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: web-production-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-production-build

      - name: Verify and materialize exact-tree production build
        id: materialize-build
        if: steps.await-build.outputs.found == 'true' && steps.download-build.outcome == 'success'
        run: >-
          node scripts/ci-build-artifact.mjs consume
          --input-dir "$RUNNER_TEMP/web-production-build"
          --source-run-id "${{ github.run_id }}"

      - name: Build the portal
        if: steps.materialize-build.outputs.reused != 'true'
        run: pnpm --filter web build

      # Poll with curl rather than adding a wait-on dependency just for this job
      # (the New Dependency Gate exists to stop exactly that kind of drive-by).
      - name: Start the portal
        env:
          DPF_REUSED_BUILD: ${{ steps.materialize-build.outputs.reused }}
        run: |
          if [ "$DPF_REUSED_BUILD" = "true" ]; then
            (cd apps/web/.next/standalone && PORT=3000 HOSTNAME=127.0.0.1 node apps/web/server.js) &
          else
            pnpm --filter web start &
          fi
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/login > /dev/null; then
              echo "portal up after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "portal did not become ready within 120s"; exit 1

      # Refresh the runtime heartbeat after the portal is live. The earlier
      # convergence establishes setup state before startup; this idempotent
      # second pass timestamps the running root portal at actual availability,
      # after artifact discovery/build, so slower valid jobs cannot cross the
      # change-lanes route's ten-minute stale-heartbeat boundary.
      - name: Refresh the authenticated UX runtime heartbeat
        run: pnpm --filter web ux:sweep-fixture

      # Reuses the existing e2e login bootstrap verbatim so the sweep measures real
      # owner surfaces instead of freezing the login page as every route's baseline.
      # One login path, not two.
      - name: Establish an authenticated session
        run: pnpm exec tsx e2e/auth-only.ts

      - name: Run the sweep
        if: ${{ inputs.update_baseline != true }}
        run: pnpm --filter web ux:sweep -- --workers "$UX_SWEEP_WORKERS"

      # Manual arming path: measure the running portal and emit the baseline as an
      # artifact for a human to commit via PR. Deliberately NOT committed from CI —
      # the baseline is a reviewed engineering act, and this job has read-only
      # contents permission.
      - name: Measure and emit a fresh baseline
        if: ${{ inputs.update_baseline == true }}
        run: pnpm --filter web ux:sweep -- --workers "$UX_SWEEP_WORKERS" --update-baseline

      - name: Upload the fresh baseline
        if: ${{ inputs.update_baseline == true }}
        uses: actions/upload-artifact@v7
        with:
          name: ux-route-budget-baseline
          path: apps/web/lib/ux-budget/route-budget-baseline.json
          if-no-files-found: error

      - name: Upload the budget report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ux-route-budget-report
          path: |
            apps/web/lib/ux-budget/route-budget-report.json
            apps/web/test-results/ux-route-sweep/route-sweep-execution.json
          if-no-files-found: warn

      # Screenshots exist only for failed eligible routes. Keeping them out of green
      # artifacts avoids paying storage and download cost for 201 healthy surfaces.
      - name: Upload failure-only route diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ux-route-sweep-failure-diagnostics
          path: apps/web/test-results/ux-route-sweep/screenshots
          if-no-files-found: ignore
