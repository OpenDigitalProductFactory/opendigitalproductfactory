name: Secrets Scan (gitleaks)

# Pre-PR secret-detection gate using gitleaks (OSS, MIT-licensed).
#
# Why gitleaks and not the previous Semgrep workflow:
#   The Semgrep CLI is OSS but its richer rule registry sits behind the
#   semgrep.dev AppSec Platform sign-up, which is a third-party account
#   DPF should not require. Demo PR #1061 / #1066 also showed the
#   unauthenticated community ruleset misses common patterns including
#   hardcoded AWS keys. gitleaks is purpose-built for secret detection,
#   runs without any account, ships its detection rules in-binary, and
#   covers the primary class of finding the previous workflow was
#   intended to catch.
#
# What this workflow does NOT cover:
#   Logic bugs, taint flow, framework-specific anti-patterns. Those live
#   with CodeQL (.github/workflows/codeql.yml — runs on every PR), the
#   CodeQL inflow gate (security-inflow-gate.yml — diff vs baseline), and
#   the per-domain audit scripts under .github/workflows/audit-*.yml.
#
# Why we install gitleaks from the GitHub release tarball:
#   The third-party `gitleaks/gitleaks-action` wrapper has a license
#   carve-out for org repositories. Installing the CLI directly avoids
#   any licensing ambiguity and pins the exact version we run.
#
# Trigger:
#   pull_request: scans the PR's commit range only (fast, focused).
#   push:         scans the merged change after it lands on main.
#   workflow_dispatch: on-demand current-tree scan.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets Scan
    runs-on: ubuntu-latest
    # Skip on Dependabot PRs; their merge commits are scanned by the push trigger.
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history needed so the commit-range scan can resolve base/head.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="$(cat scripts/security/gitleaks-version.txt)"
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        # BI-5940955C lesson: never interpolate github.event.* into shell
        # script bodies. Pass through env vars and reference $VAR in bash.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # --redact: never print the secret value itself in logs/SARIF.
          # --report-format=sarif: feed into GitHub Code Scanning UI.
          # --exit-code=1 on findings is the default; relying on that to block.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Scanning PR commit range ${PR_BASE_SHA}..${PR_HEAD_SHA}"
            gitleaks git . \
              --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}" \
              --redact \
              --report-format=sarif \
              --report-path=gitleaks.sarif \
              --verbose
          elif [ "$EVENT_NAME" = "push" ] && [ -n "${PUSH_BEFORE_SHA:-}" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "Scanning push commit range ${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
            gitleaks git . \
              --log-opts="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}" \
              --redact \
              --report-format=sarif \
              --report-path=gitleaks.sarif \
              --verbose
          else
            echo "Scanning current working tree on $EVENT_NAME event"
            gitleaks dir . \
              --redact \
              --report-format=sarif \
              --report-path=gitleaks.sarif \
              --verbose
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        # Publishing the report must not gate the PR. This upload calls the
        # code-scanning REST API with the App *installation* token, so a busy
        # hour across the org can exhaust that quota and fail the step with
        # "API rate limit exceeded for installation" — while gitleaks itself
        # scanned clean. That happened on 2026-08-01 and blocked PRs on a
        # result of "no leaks found".
        #
        # This does NOT weaken secret detection. The gate's teeth are the
        # gitleaks step above, which runs under `set -euo pipefail` and exits 1
        # on findings (see its --exit-code note) — a real leak fails the job
        # before this step is ever reached. What a failed upload costs is the
        # Code Scanning UI integration for that run, nothing more.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
