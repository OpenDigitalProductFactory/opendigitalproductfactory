name: Install Verification (E2E)

# End-to-end runtime verification for the bash installer. Brings up
# the full compose stack on ubuntu-latest, polls /api/health, captures
# the doctor bundle, then tears down with uninstall-dpf.sh --purge.
#
# This workflow is the MANUAL / ON-DEMAND surface for installer
# verification. The same body also runs automatically as the final
# `verify` job of .github/workflows/publish-image.yml on every release-
# tag publish, so a fresh tag is always exercised end-to-end without
# the workflow_run cache-poisoning pattern (CodeQL
# actions/cache-poisoning/poisonable-step) we'd hit if we chained
# across workflows.
#
# Triggers:
#   - workflow_dispatch     Manual runs (e.g. spot-checking dev mode,
#                           re-running release verification, or
#                           validating an installer-only change without
#                           cutting a release).
#
# Intentionally NOT triggered on every PR or tag:
#   The full local image build + multi-service compose-up takes 15-25
#   minutes per run. The path-filtered release-gates workflow (dry-run +
#   shellcheck) covers per-PR validation; this gate is reserved for
#   release prep and on-demand verification.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Install mode: dev (build locally) or release (pull GHCR)"
        type: choice
        options: [dev, release]
        default: dev

permissions:
  contents: read

concurrency:
  group: install-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-e2e-install:
    name: Linux E2E Install (ubuntu-latest, ${{ github.event.inputs.mode || 'dev' }})
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      # CI-specific overrides per Doctrine Contract 9 (LLM provider):
      # skip model pull so we don't burn 4-8 GB pulling a default model
      # into a runner that's going to be torn down anyway. The portal
      # comes up with embedding setup deferred — that's the verification
      # target for "install path works"; full model lifecycle is a
      # separate gate.
      DPF_MODEL_PULL_MODE: skip
      DPF_HEALTH_TIMEOUT: 900   # 15 min ceiling for image build + boot
      DPF_HEALTH_URL: http://localhost:3000/api/health

    steps:
      - uses: actions/checkout@v7

      # The full stack no longer fits in the ~14 GB a stock
      # ubuntu-latest runner leaves free: the v6.0.0 and v6.1.0 release
      # verify jobs both died mid-install with the runner worker itself
      # crashing on "No space left on device". Reclaim the ~25 GB of
      # preinstalled toolchains this job never touches. Inline rm rather
      # than a third-party action to keep the supply-chain surface at
      # zero. Mirrors the verify job in publish-image.yml.
      - name: Free runner disk space
        run: |
          echo "Disk before reclaim:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules
          sudo docker image prune --all --force
          echo "Disk after reclaim:"
          df -h /

      - name: Show docker context (preinstalled on ubuntu-latest)
        run: |
          docker --version
          docker compose version
          docker info | head -30

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.33.2 --activate

      - name: Verify digest-pinned release compose image manifests
        if: ${{ (github.event.inputs.mode || 'dev') == 'release' }}
        run: node scripts/release/verify-compose-image-manifests.mjs --mode release --platform linux --only digest-pinned

      - name: Run install-dpf.sh (real install, --no-autostart for CI)
        # Skips the autostart unit step (no user session on a GHA runner).
        # The install path itself — preflight, state, compose chain,
        # `pnpm install`, host hardware detection, .env generation,
        # `docker compose up -d`, and the /api/health poll — is what
        # this gate validates.
        #
        # BI-D094AF1D fix: workflow_dispatch input passed via env var, not
        # interpolated inline (same pattern as BI-5940955C in
        # dco-signoff-dependabot.yml). workflow_dispatch is gated to
        # repo-write users so the practical attack surface is small, but
        # the pattern is wrong and the audit gate enforces it uniformly.
        env:
          INSTALL_MODE: ${{ github.event.inputs.mode || 'dev' }}
        run: bash install-dpf.sh --headless "--${INSTALL_MODE}" --no-autostart

      - name: Verify /api/health response shape
        run: |
          set -euo pipefail
          curl --silent --fail "$DPF_HEALTH_URL" > /tmp/health.json
          cat /tmp/health.json
          # Minimal contract: the endpoint returns valid JSON with a
          # truthy `ok` or `status` field. The installer already polled
          # until 200; this step pins the response-shape invariant.
          test -s /tmp/health.json
          if command -v jq >/dev/null 2>&1; then
            jq -e '(.ok // .status // "ok") != null' /tmp/health.json
          fi

      - name: Capture docker compose ps + service status
        if: always()
        run: |
          docker compose -p dpf ps || true
          echo "---"
          docker compose -p dpf logs --tail=50 portal || true

      - name: Capture doctor bundle
        if: always()
        run: bash install-dpf.sh doctor || true

      - name: Upload doctor bundle artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: doctor-bundle-${{ github.event.inputs.mode || 'dev' }}-${{ github.run_id }}
          path: /home/runner/.dpf/doctor-*.tar.gz
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Tear down (uninstall --purge)
        if: always()
        run: bash uninstall-dpf.sh --purge --headless --yes || true
