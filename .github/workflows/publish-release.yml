name: Publish GitHub Release

# Promotes each stable version tag (vX.Y.Z) into a published GitHub Release.
#
# The maintainer already stamps tags periodically when a build is stable
# (git describe is the canonical platform version - see version.json and
# apps/web/lib/platform/version.ts). This workflow turns those tags into
# official, dated Release entries. Every Release automatically carries the
# source archives GitHub generates (.zip / .tar.gz) - but GitHub does NOT
# expose per-download counts for those auto-generated archives. The real
# downloads-over-time series comes from the *uploaded* native Edge binaries
# this workflow attaches (below); only uploaded assets carry a download_count.
#
# Docker image publishing is handled separately by publish-image.yml. This
# workflow also attaches the integrity-bound native Edge binaries required for
# host-LAN discovery on macOS and Windows Docker Desktop installs.
#
# Triggers:
#   - push of a tag matching v*  -> release that tag automatically.
#   - workflow_dispatch          -> backfill a specific existing tag
#                                    (defaults to the most recent tag), so a
#                                    notable pre-existing tag such as v6.4.0
#                                    can be turned into a Release on demand
#                                    without re-tagging.
#
# Only GitHub built-ins are used (actions/checkout + the preinstalled gh
# CLI), so no third-party action needs the external-tool evaluation gate.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v6.4.0). Empty = most recent tag."
        required: false
        default: ""

# Least-privilege default; the publish job opts up to contents: write.
permissions:
  contents: read

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so git describe / tag verification work.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/edge-node-go/go.mod
          cache-dependency-path: services/edge-node-go/go.sum

      - name: Resolve target tag
        id: resolve
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [ -n "${DISPATCH_TAG}" ]; then
            tag="${DISPATCH_TAG}"
          else
            tag="$(git describe --tags --abbrev=0)"
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag '${tag}' does not exist in this repository."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${tag}"

      - name: Publish release if it does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          # 1. Ensure the Release exists FIRST. Creating it up front means a
          #    later binary-build failure degrades to a source-only Release
          #    rather than blocking the Release (and its notes) entirely.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists - reusing it (idempotent)."
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --generate-notes \
              --verify-tag
            echo "Created GitHub Release ${TAG}."
          fi

          # 2. Build + attach the native Edge binaries from the tag's tree.
          #
          #    The portal offers the native download ONLY for assets actually
          #    attached here (BI-BB919901), so a release missing them silently
          #    degrades every Windows and macOS operator to the Docker Desktop
          #    path, which cannot see the host's real LAN. That used to be a
          #    `::warning::` and was therefore invisible — the release looked
          #    successful. It now FAILS the job.
          #
          #    The full Makefile matrix is published, not a subset. A fleet is one
          #    node per site, so a missing linux-amd64 or Intel-Mac binary is a
          #    real gap even where a container would also work.
          git checkout --detach "refs/tags/${TAG}"
          make -C services/edge-node-go build-all VERSION="${TAG}"

          EDGE_ASSETS="dpf-edge-node-linux-amd64 dpf-edge-node-linux-arm64 dpf-edge-node-darwin-amd64 dpf-edge-node-darwin-arm64 dpf-edge-node-windows-amd64.exe dpf-edge-node-windows-arm64.exe"

          # Refuse to publish a partial matrix. An installable that is sometimes
          # absent is not an installable, and the portal cannot tell "not built"
          # apart from "not supported on this platform".
          for asset in ${EDGE_ASSETS}; do
            if [ ! -f "services/edge-node-go/bin/${asset}" ]; then
              echo "::error::Edge binary ${asset} was not produced for ${TAG}. Refusing to publish a partial release."
              exit 1
            fi
          done

          ( cd services/edge-node-go/bin && sha256sum ${EDGE_ASSETS} > dpf-edge-node-checksums.sha256 )

          UPLOAD_ARGS=""
          for asset in ${EDGE_ASSETS} dpf-edge-node-checksums.sha256; do
            UPLOAD_ARGS="${UPLOAD_ARGS} services/edge-node-go/bin/${asset}"
          done
          # shellcheck disable=SC2086
          gh release upload "${TAG}" ${UPLOAD_ARGS} --repo "${GITHUB_REPOSITORY}" --clobber
          echo "Attached the full native Edge asset matrix to Release ${TAG}."
