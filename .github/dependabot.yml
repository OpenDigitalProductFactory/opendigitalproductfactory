version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Supply-chain hardening: a release-age "cooldown" so Dependabot does not bump
    # us into a freshly-published version. Hijacked/compromised releases (the now-
    # daily npm attack) are typically caught and unpublished within hours-to-days;
    # waiting lets the ecosystem absorb that hit before we adopt. Majors wait
    # longest (also dampens churn). The OSV scan + New Dependency Gate still apply
    # on top. See docs/architecture/dependency-reduction-routine.md.
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    labels:
      - "dependencies"
      - "javascript"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Expo SDK is a lockstep upgrade: `expo` core and every `expo-*`
      # companion package must move together to the same SDK line.
      # Cross-SDK PRs break the mobile build. Expo's companion packages
      # live at 0.x where a "minor" bump (e.g. expo-notifications
      # 0.31 → 0.32) ships with a new SDK and a new RN/React baseline,
      # so block both major and minor — only patches within the
      # pinned SDK are safe.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # React Native and its ecosystem packages are version-coupled to
      # the Expo SDK line (see note above). RN itself is at 0.x where
      # every minor bump (0.79 → 0.85, etc.) is a breaking release
      # that requires a matching Expo SDK upgrade. Allow patches only.
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # React majors land across web + mobile. The mobile workspace
      # can only take a new React minor after a matching Expo SDK
      # upgrade pulls it in, so React must move alongside that plan,
      # not independently. `react-test-renderer` is pinned to the
      # exact React version and follows the same rule.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-test-renderer"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # TypeScript majors usually surface type errors across strict
      # mode code. Upgrade deliberately, not through Dependabot.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # FullCalendar packages are version-coupled. Core/react published 7.0.0
      # before daygrid/timegrid/interaction had final 7.0.0 releases (those
      # plugins still stop at 7.0.0-rc.0 / beta), so separate major PRs create
      # an impossible install: peer/type mismatches and missing runtime exports.
      # Keep 6.x flowing; move to 7.x only when the whole family has final
      # releases and can be bumped in one branch.
      - dependency-name: "@fullcalendar/*"
        update-types: ["version-update:semver-major"]
      # react-data-grid has no stable release yet; every version is a
      # 7.0.0-* prerelease. The maintainer ships the recommended build on
      # the `beta` channel, while `canary` is the nightly/dev channel and
      # `alpha` is older still. Raw semver sorts canary > beta > alpha
      # alphabetically, so Dependabot jumps us onto the nightly channel
      # (7.0.0-canary.49 broke Typecheck + Prod Build — see closed #2780).
      # Block the alpha and canary channels so bumps stay on the beta line.
      #
      # beta.60 is ALSO blocked: it ships a broken package — lib/index.js
      # has a bare `import "ecij";` but declares no `dependencies`, so `ecij`
      # never installs and every consumer's runtime + Production Build fails
      # ("Cannot find package 'ecij'"). Stay on the working beta.59 until the
      # maintainer publishes a fixed beta (beta.61+), which Dependabot will
      # then be free to propose.
      - dependency-name: "react-data-grid"
        versions: ["7.0.0-alpha.*", "7.0.0-canary.*", "7.0.0-beta.60"]
      # Mermaid is pinned to an exact line (11.15.0) and enforced by the
      # Diagram Dependency Pin Guard (scripts/check-diagram-dependency-pins.mjs):
      # package.json must retain "@mermaid-js/mermaid-cli": "11.15.0", the
      # pnpm-workspace override pins `mermaid: '11.15.0'`, and the lockfile guard
      # rejects newer @zenuml/@mermaid-zenuml transitives. Dependabot bumps here
      # (e.g. 11.15.0 → 11.16.0) always fail that gate, so block them — the pin
      # moves deliberately in lockstep with the guard, not via Dependabot.
      - dependency-name: "@mermaid-js/mermaid-cli"
      - dependency-name: "mermaid"
      # @floating-ui/* is pinned via pnpm-workspace overrides and the same
      # Diagram Dependency Pin Guard, whose rejected-lock list blocks
      # @floating-ui/react@0.27.20 and its sibling bumps. Dependabot proposals
      # (0.27.19 → 0.27.20) fail the guard, so block the family; it moves with
      # the guard's override list, not independently.
      - dependency-name: "@floating-ui/*"
      # read-excel-file is pinned to an exact 9.2.0. The 9.3.x line is a breaking
      # change — `readFiles(...)` no longer returns a thenable, so
      # excel-sheet-reader.test.ts fails with "readFiles(...).then is not a
      # function". Block until the reader is migrated to the new 9.3+ API and the
      # pin is bumped deliberately.
      - dependency-name: "read-excel-file"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Bundle ALL workflow-action bumps into one weekly PR. WWMD 2026-06-22
    # (principle_decide): group-only-manual — cut PR count, keep human review on
    # merges (Human-in-the-Loop + Build-Gate outweighed auto-merge convenience).
    # Without this, each action update is its own PR (e.g. two open majors:
    # actions/checkout + pnpm/action-setup → would collapse to one).
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Bundle all base-image bumps into one weekly PR (see github-actions note).
    groups:
      docker:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Node base image: pinned to the current LTS line (24-alpine).
      # Node odd-numbered majors are non-LTS (6-month support window)
      # and not suitable for a runtime we expect to keep production-
      # ready. Minor/patch tags within the pinned major still flow.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
