packages:
  - "apps/*"
  - "packages/*"
  - "services/adp"
  - "services/edge-node"
  - "services/integration-test-harness"
overrides:
  '@types/react': '^19'
  # react / react-dom pinned to 19.2.3 (BI-E5E72FE3 mobile-runtime repair).
  # React enforces a RUNTIME invariant that the standalone `react` package
  # version EXACTLY equals the reconciler that react-native embeds. RN 0.85.3
  # (Expo SDK 56) embeds React 19.2.3's renderer, so a hoisted react 19.2.8
  # (pulled up by apps/web / Next 16) crashes the mobile app at boot with
  # "Incompatible React versions: react 19.2.8 vs react-native-renderer 19.2.3".
  # One hoisted copy serves both apps, so both must sit on 19.2.3. This is a
  # patch-level move within 19.2.x — Next 16 (^19.2.0) is unaffected; the web
  # production build gate on this PR proves it. Re-pin in lockstep whenever
  # react-native's bundled renderer version changes on an SDK bump.
  react: 19.2.3
  react-dom: 19.2.3
  # find-my-way < 9.7.0: GHSA-c96f-x56v-gq3h / CVE-2026-47219, high severity
  # (OSV vulnerability scan on PR #3893). Transitive of the Expo SDK 56 dev
  # server toolchain. Floor to the patched 9.7.0.
  find-my-way: '^9.7.0'
  # @hono/node-server < 2.0.5: GHSA-frvp-7c67-39w9 path traversal in serve-static
  # on Windows via encoded backslash (%5C) (Dependabot #105, medium). First patched
  # release is on the 2.x line. Dev/tooling transitive of @modelcontextprotocol/sdk
  # and @prisma/dev; both consume only the stable serve() API (not serveStatic).
  # 2.0.5 needs Node >=20 + hono ^4, both already satisfied by this workspace.
  '@hono/node-server': '^2.0.5'
  '@expo/cli@0.24.24>picomatch': '3.0.2'
  # brace-expansion <= 5.0.8: GHSA-mh99-v99m-4gvg / CVE-2026-14257, then
  # GHSA-rgw5-rvv9-x895 / CVE-2026-69152 (unbounded intermediate arrays,
  # bypassing the 5.0.8 mitigation — found on PR #3893's OSV scan). Floor
  # every transitive line to the current patched release, 5.0.9.
  'brace-expansion@<=5.0.8': '5.0.9'
  # deepmerge-ts < 8.0.0: GHSA-ggr8-5vv4-36mx / CVE-2026-40345 (Dependabot #155,
  # high) — deepmerge()/deepmergeInto() recurse per property with no visited-pair
  # tracking, so two records that self-reference at the same key path recurse until
  # RangeError. Transitive of @prisma/config, which merges our own repo-committed
  # prisma config at CLI time rather than an attacker-supplied object graph — but
  # 8.0.0 is a clean upstream fix with zero runtime dependencies and the same
  # `node >=16` engine, so floor it instead of accepting the finding.
  deepmerge-ts: '^8.0.0'
  lodash: '4.18.0'
  lodash-es: '4.18.0'
  node-forge: '1.4.0'
  postcss: '^8.5.18'
  uuid: '^14.0.0'
  # nanoid GHSA-2v37-7h3g-55p8 / CVE-2026-67213 (Dependabot #152, high) —
  # originally reported as predictable output for a non-integer size and floored
  # to 3.3.17. The advisory was since revised: custom generators can loop
  # indefinitely when size is zero, and the patched releases moved to 3.3.18 /
  # 5.1.6, so the old 3.3.17 floor no longer clears it (caught by the OSV
  # dependency scan, not by a new Dependabot alert). Raise the 3.x floor to
  # 3.3.18. The 5.x line already resolves 5.1.16 (> 5.1.6), so it stays unfloored.
  'nanoid@<3.3.18': '^3.3.18'
  # dompurify <= 3.4.12: GHSA-55q2-fjhq-7xh7 (Dependabot #148, medium) — mXSS via
  # nesting-depth handling. Transitive (mermaid pulls dompurify ^3.3.3). Floor to
  # the patched 3.4.13.
  dompurify: '^3.4.13'
  '@opentelemetry/otlp-transformer>protobufjs': '^8.3.0'
  # protobufjs <= 7.6.4: GHSA-j3f2-48v5-ccww DoS via infinite loop in .proto option
  # parsing (Dependabot #101, medium), on top of the earlier < 7.6.3 cluster
  # (GHSA-f38q-mgvj-vph7 prototype-property shadowing + GHSA-wcpc-wj8m-hjx6 unbounded
  # Any expansion DoS). Floor every runtime entry to the patched 7.6.5.
  'protobufjs@<7.6.5': '^7.6.5'
  'ws@>=8.0.0 <8.20.1': '^8.20.1'
  # fast-uri <= 3.1.3: GHSA-4c8g-83qw-93j6 host confusion via failed IDN
  # canonicalization (Dependabot #109) + GHSA-v2hh-gcrm-f6hx host confusion via a
  # literal backslash authority delimiter (Dependabot #111), both high. Floor to
  # the patched 3.1.4 on the 3.x line (fast-uri's runtime consumers pin ^3).
  fast-uri: '^3.1.4'
  # hono < 4.12.27: GHSA-hvrm-45r6-mjfj hono/jsx cross-request context disclosure,
  # GHSA-w62v-xxxg-mg59 server-side XSS via cx() JSX escaping bypass, and
  # GHSA-xgm2-5f3f-mvvc API Gateway v1 header de-dup drop (Dependabot #106/#107/#108,
  # medium), on top of the earlier < 4.12.25 CORS-with-credentials wildcard
  # reflection (GHSA-88fw-hqm2-52qc, high), then < 4.12.34 GHSA-8j4g-w8fx-2239 /
  # CVE-2026-69207 ReDoS in the CORS middleware via a crafted
  # Access-Control-Request-Headers value (Dependabot #139, medium).
  # Runtime dependency; floor to the patched 4.12.34.
  hono: '^4.12.34'
  # Keep the CLI's diagram stack on the last policy-vetted releases. Floating
  # transitive ranges let lockfile regeneration pull a same-day ZenUML/Floating
  # UI graph even after the CLI itself was rolled back (BI-72E0A27B).
  # mermaid < 11.16.1: GHSA-rhh3-jpg6-66xh (Dependabot #145, medium),
  # GHSA-6x64-9x62-f2gx (Dependabot #143, medium), GHSA-3rrr-jr9j-h3q3
  # (Dependabot #142, medium), GHSA-2v8p-3f2j-5mp7 (Dependabot #141, medium),
  # and GHSA-c4c3-pg64-4m4v (Dependabot #144, low). Raise the policy pin from
  # the vulnerable 11.15.0 to the patched 11.16.1 (deps diff is minor-range
  # only; no ZenUML/Floating-UI companion move needed).
  mermaid: '11.16.1'
  '@mermaid-js/mermaid-zenuml': '0.2.2'
  '@zenuml/core': '3.47.8'
  '@floating-ui/core': '1.7.5'
  '@floating-ui/dom': '1.7.6'
  '@floating-ui/react-dom': '2.1.8'
  '@floating-ui/react': '0.27.19'
  '@floating-ui/utils': '0.2.11'
  # extract-zip <= 2.0.1: GHSA-jmr9-qjv8-65gv unvalidated symlink path traversal
  # (Dependabot #153, high). extract-zip has NO patched release — 2.0.1 is the
  # latest published version and the package is unmaintained (last publish
  # 2023-03). The only remediation is to remove it from the tree: its sole
  # parent is @puppeteer/browsers, which dropped extract-zip in 3.0.0 (it now
  # unpacks via modern-tar). @puppeteer/browsers 3.x first ships in puppeteer
  # 25.x, so floor puppeteer to ^25. Dev-only transitive of
  # @mermaid-js/mermaid-cli (diagram rendering); the CLI's peer range widened to
  # '^23 || ^24 || ^25' in 11.16.0, which this commit adopts in lockstep.
  puppeteer: '^25'
  # js-yaml GHSA-5p4m-2wfm-xmqj (high): special-character handling flaw. Both
  # supported major lines resolve to a vulnerable transitive copy, so each is
  # floored to its patched release independently.
  # js-yaml < 3.15.1: GHSA-5p4m-2wfm-xmqj (Dependabot #147, high).
  'js-yaml@>=3.0.0 <3.15.1': '^3.15.1'
  # js-yaml >= 4.0.0 < 4.3.1: GHSA-5p4m-2wfm-xmqj (Dependabot #146, high).
  'js-yaml@>=4.0.0 <4.3.1': '^4.3.1'
  # ip-address < 10.3.1: GHSA-mwp4-54f8-5fhr / CVE-2026-69192, high severity —
  # Address4 decodes leading-zero octets as decimal while resolvers decode
  # them as octal, an SSRF-adjacent parser confusion (found on PR #3893's
  # OSV scan). Was floored at ^10.2.0 for an earlier issue; raised to ^10.3.1.
  ip-address: '^10.3.1'
  # sharp < 0.35.0: inherited libvips vulnerabilities CVE-2026-33327/33328/35590/35591
  # (Dependabot #110, high). apps/web already depends on ^0.35.3 directly; this floor
  # also lifts the stale sharp@0.34.5 that Next.js ships as a bundled optionalDependency.
  sharp: '^0.35.3'
  # body-parser < 2.3.0: GHSA-v422-hmwv-36x6 DoS when an invalid `limit` value silently
  # disables body size enforcement (Dependabot #104, low). Transitive; floor to 2.3.0.
  body-parser: '^2.3.0'
  # valibot <= 1.4.1: GHSA-5qjj-4xww-7phc / CVE-2026-59952 request-path
  # DoS when flatten() receives record issue paths matching inherited Object keys
  # (Dependabot #132, medium). Transitive through @prisma/dev; floor to 1.4.2.
  'valibot@<=1.4.1': '1.4.2'
  # --- jest 30 unification (apps/mobile) ---
  # Force the ENTIRE jest family to a single major (30) so apps/mobile runs a
  # unified jest 30 install. jest-expo@~56 (Expo SDK 55/56) still *declares* jest
  # 29 transitive deps; without these overrides a jest 30 bump produces a MIXED
  # 29/30 tree (jest-runtime@30 + jest-mock@29) that breaks every mobile suite at
  # load with "clearMocksOnScope is not a function" (see reverted PRs #1053, #1288).
  # jest-expo's code already tolerates jest 30, so a unified 30 tree works.
  # Keep in sync with scripts/check-mobile-jest-pin.mjs (REQUIRED_MAJOR).
  jest: '^30.0.0'
  jest-cli: '^30.0.0'
  jest-config: '^30.0.0'
  jest-runner: '^30.0.0'
  jest-runtime: '^30.0.0'
  jest-circus: '^30.0.0'
  jest-snapshot: '^30.0.0'
  jest-mock: '^30.0.0'
  jest-each: '^30.0.0'
  jest-util: '^30.0.0'
  jest-message-util: '^30.0.0'
  jest-resolve: '^30.0.0'
  jest-resolve-dependencies: '^30.0.0'
  jest-haste-map: '^30.0.0'
  jest-environment-node: '^30.0.0'
  jest-environment-jsdom: '^30.0.0'
  jest-validate: '^30.0.0'
  jest-watcher: '^30.0.0'
  jest-worker: '^30.0.0'
  jest-regex-util: '^30.0.0'
  jest-docblock: '^30.0.0'
  jest-changed-files: '^30.0.0'
  jest-leak-detector: '^30.0.0'
  babel-jest: '^30.0.0'
  expect: '^30.0.0'
  pretty-format: '^30.0.0'
  '@jest/globals': '^30.0.0'
  '@jest/types': '^30.0.0'
  '@jest/core': '^30.0.0'
  '@jest/reporters': '^30.0.0'
  '@jest/transform': '^30.0.0'
  '@jest/test-sequencer': '^30.0.0'
  '@jest/console': '^30.0.0'
  '@jest/environment': '^30.0.0'
  '@jest/fake-timers': '^30.0.0'
  '@jest/source-map': '^30.0.0'
  '@jest/test-result': '^30.0.0'
  '@jest/expect': '^30.0.0'
  '@jest/expect-utils': '^30.0.0'
  '@jest/schemas': '^30.0.0'
  '@jest/create-cache-key-function': '^30.0.0'
  jest-watch-typeahead: '^3.0.0'
# Supply-chain hardening: a release-age floor on DEPENDENCY RESOLUTION. pnpm
# refuses to resolve a version published less than this many minutes ago, so no
# install path can adopt a package the ecosystem has not had a chance to look at
# yet — the window in which a hijacked npm release is typically caught and
# unpublished.
#
# This is the universal backstop. The Dependabot `cooldown:` block in
# .github/dependabot.yml (3/5/7/14 days by bump type) is STRICTER but covers only
# Dependabot-authored bumps; this floor additionally covers `pnpm add`, lockfile
# regeneration, and agent-driven installs, on every host. Previously the floor
# existed only as unversioned host-local pnpm config, so it bound one machine and
# nothing else (BI-B175621A).
#
# Scope note (verified against pnpm 10.33): this gates RESOLUTION only. A
# `--frozen-lockfile` install reports "resolution step is skipped" and never
# consults it, so CI, Docker builds, and worktree bootstrap are unaffected — an
# already-reviewed lockfile is never re-litigated. The committed lockfile is
# gated separately by scripts/sbom/check-lockfile-release-age.mjs.
#
# Use minimumReleaseAgeExclude for a package that must be adopted inside the
# window (e.g. an embargoed security fix); keep it empty by default.
minimumReleaseAge: 1440
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  # Telemetry-only postinstall: report.js sends install/dependency/platform data
  # to scarf.sh. Stoplight Prism has no runtime import or generated artifact need.
  '@scarf/scarf': false
  esbuild: true
  msw: true
  prisma: true
  protobufjs: false
  puppeteer: false
  sharp: true
  unrs-resolver: false
# Restore peerDependencies that @testing-library/jest-dom dropped in 6.x but still
# imports from at runtime (src/vitest.js imports `vitest`). Without this, vitest
# 4.1.6+ loses the `toBeInTheDocument` type augmentation across every test site.
# Upstream: https://github.com/testing-library/jest-dom/issues/662
# Tracking: vitest-dev/vitest#10411 (closed as downstream)
packageExtensions:
  '@testing-library/jest-dom':
    peerDependencies:
      vitest: '*'

