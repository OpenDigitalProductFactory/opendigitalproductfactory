packages:
  - "apps/*"
  - "packages/*"
  - "services/adp"
  - "services/edge-node"
  - "services/integration-test-harness"
overrides:
  '@types/react': '^19'
  '@hono/node-server': '1.19.13'
  '@expo/cli@0.24.24>picomatch': '3.0.2'
  'minimatch@3.1.5>brace-expansion': '1.1.13'
  'minimatch@9.0.9>brace-expansion': '2.0.3'
  lodash: '4.18.0'
  lodash-es: '4.18.0'
  '@tootallnate/once': '3.0.1'
  '@xmldom/xmldom': '0.8.13'
  # dompurify <= 3.4.10: GHSA-cmwh-pvxp-8882 permanent ALLOWED_ATTR pollution via
  # setConfig() (Dependabot #90, medium), on top of the earlier < 3.4.9 cluster
  # (template-tag bypass, IN_PLACE clobber, cross-realm bypass, etc.). Dev-only
  # transitive via mermaid / @zenuml/core. Floor to the patched 3.4.11.
  dompurify: '^3.4.11'
  node-forge: '1.4.0'
  postcss: '^8.5.18'
  uuid: '^14.0.0'
  '@opentelemetry/otlp-transformer>protobufjs': '^8.3.0'
  # protobufjs < 7.6.3: GHSA-f38q-mgvj-vph7 prototype-property shadowing +
  # GHSA-wcpc-wj8m-hjx6 unbounded Any expansion DoS. Floor every runtime entry
  # to a patched release.
  'protobufjs@<7.6.3': '^7.6.3'
  'ws@>=8.0.0 <8.20.1': '^8.20.1'
  # esbuild < 0.28.1: GHSA binary-integrity RCE via NPM_CONFIG_REGISTRY (high) +
  # arbitrary file read by the Windows dev server (low). Dev-only transitive dep
  # of vite/vitest; pin the vulnerable range up to the patched release.
  'esbuild@>=0.17.0 <0.28.1': '^0.28.1'
  fast-uri: '^3.1.2'
  # @babel/core <= 7.29.0: GHSA-4x5r-pxfx-6jf8 (CVE-2026-49356) arbitrary file
  # read via a crafted sourceMappingURL comment (Dependabot #73, low). Dev/build-
  # only transitive of the Expo metro-config toolchain (apps/mobile). Floor to the
  # patched 7.29.6; the web app already resolves 7.29.7, so this only lifts the
  # stale instance.
  '@babel/core': '^7.29.6'
  # hono < 4.12.25: GHSA-88fw-hqm2-52qc CORS-with-credentials wildcard reflection
  # (high) + 4 medium Lambda/edge adapter issues. Runtime dependency.
  hono: '^4.12.25'
  # Keep the CLI's diagram stack on the last policy-vetted releases. Floating
  # transitive ranges let lockfile regeneration pull a same-day ZenUML/Floating
  # UI graph even after the CLI itself was rolled back (BI-72E0A27B).
  mermaid: '11.15.0'
  '@mermaid-js/mermaid-zenuml': '0.2.2'
  '@zenuml/core': '3.47.8'
  '@floating-ui/core': '1.7.5'
  '@floating-ui/dom': '1.7.6'
  '@floating-ui/react-dom': '2.1.8'
  '@floating-ui/react': '0.27.19'
  '@floating-ui/utils': '0.2.11'
  ip-address: '^10.2.0'
  qs: '^6.15.2'
  # --- jest 30 unification (apps/mobile) ---
  # Force the ENTIRE jest family to a single major (30) so apps/mobile runs a
  # unified jest 30 install. jest-expo@~56 (Expo SDK 55/56) still *declares* jest
  # 29 transitive deps; without these overrides a jest 30 bump produces a MIXED
  # 29/30 tree (jest-runtime@30 + jest-mock@29) that breaks every mobile suite at
  # load with "clearMocksOnScope is not a function" (see reverted PRs #1053, #1288).
  # jest-expo's code already tolerates jest 30, so a unified 30 tree works.
  # Keep in sync with scripts/check-mobile-jest-pin.mjs (REQUIRED_MAJOR).
  jest: '^30.0.0'
  jest-cli: '^30.0.0'
  jest-config: '^30.0.0'
  jest-runner: '^30.0.0'
  jest-runtime: '^30.0.0'
  jest-circus: '^30.0.0'
  jest-snapshot: '^30.0.0'
  jest-mock: '^30.0.0'
  jest-each: '^30.0.0'
  jest-util: '^30.0.0'
  jest-message-util: '^30.0.0'
  jest-resolve: '^30.0.0'
  jest-resolve-dependencies: '^30.0.0'
  jest-haste-map: '^30.0.0'
  jest-environment-node: '^30.0.0'
  jest-environment-jsdom: '^30.0.0'
  jest-validate: '^30.0.0'
  jest-watcher: '^30.0.0'
  jest-worker: '^30.0.0'
  jest-regex-util: '^30.0.0'
  jest-docblock: '^30.0.0'
  jest-changed-files: '^30.0.0'
  jest-leak-detector: '^30.0.0'
  babel-jest: '^30.0.0'
  expect: '^30.0.0'
  pretty-format: '^30.0.0'
  '@jest/globals': '^30.0.0'
  '@jest/types': '^30.0.0'
  '@jest/core': '^30.0.0'
  '@jest/reporters': '^30.0.0'
  '@jest/transform': '^30.0.0'
  '@jest/test-sequencer': '^30.0.0'
  '@jest/console': '^30.0.0'
  '@jest/environment': '^30.0.0'
  '@jest/fake-timers': '^30.0.0'
  '@jest/source-map': '^30.0.0'
  '@jest/test-result': '^30.0.0'
  '@jest/expect': '^30.0.0'
  '@jest/expect-utils': '^30.0.0'
  '@jest/schemas': '^30.0.0'
  '@jest/create-cache-key-function': '^30.0.0'
  jest-watch-typeahead: '^3.0.0'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: false
  puppeteer: false
  sharp: true
  unrs-resolver: false
# Restore peerDependencies that @testing-library/jest-dom dropped in 6.x but still
# imports from at runtime (src/vitest.js imports `vitest`). Without this, vitest
# 4.1.6+ loses the `toBeInTheDocument` type augmentation across every test site.
# Upstream: https://github.com/testing-library/jest-dom/issues/662
# Tracking: vitest-dev/vitest#10411 (closed as downstream)
packageExtensions:
  '@testing-library/jest-dom':
    peerDependencies:
      vitest: '*'
