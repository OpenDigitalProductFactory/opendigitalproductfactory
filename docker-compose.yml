name: ${COMPOSE_PROJECT_NAME:-dpf}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dpf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpf_dev}
      POSTGRES_DB: dpf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-inngest-db.sh:/docker-entrypoint-initdb.d/20-create-inngest-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dpf}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/dpf_dev_password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── AI Inference ────────────────────────────────────────────────────────────
  # Docker Model Runner (built into Docker Desktop 4.40+) provides local LLM
  # inference via OpenAI-compatible API at http://model-runner.docker.internal/v1.
  # No separate container needed — models are managed through Docker Desktop.
  # To pull a model:  docker model pull ai/gemma4
  # To list models:   docker model list

  portal-init:
    build:
      context: .
      target: runner
      args:
        # Stamps the build's source identity into /app/.dpf-image-version.
        # Set DPF_VERSION=$(git rev-parse HEAD) before `docker compose build`,
        # or use scripts/build-images.{ps1,sh} which does it for you. When
        # unset, the Dockerfile falls back to a content hash of the source.
        DPF_VERSION: ${DPF_VERSION:-}
        DPF_PLATFORM_VERSION: ${DPF_PLATFORM_VERSION:-}
    command: ["/docker-entrypoint.sh"]
    volumes:
      - dpf-source-code:/workspace
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dpf:dpf_dev@postgres:5432/dpf}
      DPF_HOST_PROFILE: ${DPF_HOST_PROFILE:-}
      DPF_HOST_INSTALL_PATH: ${DPF_HOST_INSTALL_PATH:-}
      DPF_SELF_UPGRADE_HOST_SOURCE_MOUNT: /host-dpf
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
    depends_on:
      postgres:
        condition: service_healthy

  # Production-served runtime for the real install. Keep localhost:3000 reserved
  # for this surface so customer-zero verification always targets the live path.
  portal:
    build:
      context: .
      target: runner
      args:
        # See portal-init.build.args.DPF_VERSION above for the convention.
        DPF_VERSION: ${DPF_VERSION:-}
        DPF_PLATFORM_VERSION: ${DPF_PLATFORM_VERSION:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "1455:3000"  # OpenAI Codex OAuth callback (shared client requires this port)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dpf-source-code:/workspace
      - sandbox_workspace:/sandbox-workspace
      # browser-use writes UX verification screenshots here; the portal serves
      # them through /api/build/<buildId>/evidence/<fileName> (auth-gated).
      # Read-only from the portal's side — only browser-use should write.
      - browser_evidence:/evidence:ro
      # Platform-managed backups (daily Postgres + Neo4j + Qdrant).
      # Host bind mount (NOT a Docker volume) so `docker compose down -v`,
      # `docker volume rm`, or worktree-induced compose re-labelling cannot
      # destroy backups. Same path the promoter writes pre-promote dumps to.
      # See docs/superpowers/specs/2026-05-17-postgres-daily-backup-design.md.
      #
      # Source lives OUTSIDE the install root by default (DPF_BACKUPS_HOST_PATH
      # is set by the installer to a sibling like $DPF_DIR-backups) so that
      # dpf-reinstall.ps1 / uninstall-dpf.ps1 rm-ing $DPF_DIR cannot destroy
      # the only persisted copies of operator backups. Pre-relocation default
      # is preserved for installs that haven't been re-run since the PR that
      # introduced DPF_BACKUPS_HOST_PATH.
      - ${DPF_BACKUPS_HOST_PATH:-${DPF_HOST_INSTALL_PATH:-.}/backups}:/backups
      # Writable host mount: lets the portal write .mcp.json to the install
      # directory at token generation time. Requires DPF_HOST_INSTALL_PATH
      # to be set in .env (done by the installer at setup time).
      - ${DPF_HOST_INSTALL_PATH:-.}:/host-dpf
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dpf:dpf_dev@postgres:5432/dpf}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set - run scripts/setup.ps1 or scripts/setup.sh first}
      # AUTH_TRUST_HOST tells Auth.js to trust the request's Host /
      # X-Forwarded-Host header so callbacks resolve to whatever URL the
      # browser used (localhost, LAN IP, dpf.local, public domain). No
      # hardcoded URL — the portal works in all three modes (localhost,
      # LAN with mDNS, public with reverse proxy) without env edits.
      # Optional override: PUBLIC_URL — required only for outbound async
      # flows (emails, webhooks) where there's no in-flight request.
      AUTH_TRUST_HOST: "true"
      PUBLIC_URL: ${PUBLIC_URL:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set - run scripts/setup.ps1 or scripts/setup.sh first}
      LINKEDIN_MOCK_MODE: ${LINKEDIN_MOCK_MODE:-}
      EMAIL_MOCK_MODE: ${EMAIL_MOCK_MODE:-}
      ADS_MOCK_MODE: ${ADS_MOCK_MODE:-}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dpf_dev_password}
      QDRANT_INTERNAL_URL: ${QDRANT_INTERNAL_URL:-http://qdrant:6333}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://model-runner.docker.internal/v1}
      # Management API for Ollama pull/delete/tags (distinct from OpenAI-compat
      # inference URL above). On Docker Desktop, host.docker.internal reaches
      # Ollama installed natively on the host. Linux sets this via the
      # docker-compose.linux.yml overlay instead (to http://ollama:11434).
      OLLAMA_INTERNAL_URL: ${OLLAMA_INTERNAL_URL:-http://host.docker.internal:11434}
      DEPLOYED_VERSION: ${DEPLOYED_VERSION:-}
      # Git SHA of the running image — set by the deploy pipeline (or
      # scripts/build-images.{ps1,sh}) to give /ops/self-upgrade a comparable
      # identity. When unset, the portal falls back to /app/.dpf-image-version
      # (baked at build time). See spec §4.1 of
      # docs/superpowers/specs/2026-05-23-governed-platform-upgrade-lifecycle-design.md.
      DEPLOYED_SHA: ${DEPLOYED_SHA:-${DPF_VERSION:-}}
      DPF_ENVIRONMENT: production
      DPF_HOST_INSTALL_PATH: ${DPF_HOST_INSTALL_PATH:-}
      # Forwarded so scripts/backup-neo4j.sh + scripts/restore-neo4j.sh can
      # translate the portal's /backups view to the host path that the
      # docker-in-docker dump container needs as its bind mount source.
      # Falls back to ${DPF_HOST_INSTALL_PATH}/backups inside the bash
      # scripts when unset (legacy in-tree layout).
      DPF_BACKUPS_HOST_PATH: ${DPF_BACKUPS_HOST_PATH:-}
      DPF_SELF_UPGRADE_HOST_SOURCE_MOUNT: /host-dpf
      INSTANCE_TYPE: dev
      PROJECT_ROOT: /workspace
      SANDBOX_PREVIEW_URL: http://sandbox:3000
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HIVE_CONTRIBUTION_TOKEN: ${HIVE_CONTRIBUTION_TOKEN:-}
      HIVE_OPS_TOKEN: ${HIVE_OPS_TOKEN:-}
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-deadbeefcafebabe}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-abcdef0123456789}
      INNGEST_DEV: ${INNGEST_DEV:-0}
      # Self-hosted Inngest (INNGEST_DEV=0) does NOT auto-discover apps, so the
      # portal must register its function catalog on boot — instrumentation.ts
      # PUTs /api/inngest when this is enabled. Default ON for compose installs:
      # without it, published events are accepted but silently dropped and NO
      # background job (self-upgrade, evals, brand extract, builds) ever runs.
      DPF_INNGEST_SELF_SYNC_ON_BOOT_ENABLED: ${DPF_INNGEST_SELF_SYNC_ON_BOOT_ENABLED:-1}
      # Tell Inngest's serve() the externally-reachable URL for this app so
      # sync registrations announce the Docker-DNS hostname (not the Host
      # header of the /api/inngest PUT, which would be "localhost:3000"
      # when the instrumentation hook self-syncs from inside the container).
      # Without this, Inngest records the app URL as localhost:3000, then
      # retries forever against itself when dispatching queued steps —
      # symptom: events publish + initialize but never execute, UI hangs.
      INNGEST_SERVE_ORIGIN: http://portal:3000
      # Allow plain-HTTP MCP traffic from in-bridge clients (sandbox→portal,
      # promoter→portal). The MCP route otherwise refuses non-localhost HTTP.
      # Operator-overridable via MCP_INSECURE_INTERNAL_HOSTS in .env. Bearer
      # tokens, origin checks, and grant scopes are still enforced — this
      # only relaxes the transport-layer TLS gate for known internal hosts.
      MCP_INSECURE_INTERNAL_HOSTS: ${MCP_INSECURE_INTERNAL_HOSTS:-portal,host.docker.internal,sandbox}
      # TTS provider — defaults to self-hosted Chatterbox (prefer-self-hosted-infrastructure).
      # Override: TTS_PROVIDER=cartesia or TTS_PROVIDER=fish-audio to use a managed API.
      TTS_PROVIDER: ${TTS_PROVIDER:-chatterbox}
      DPF_TTS_URL: ${DPF_TTS_URL:-http://dpf-tts:8000}
      # Apple Silicon / non-NVIDIA hosts: set TTS_PROVIDER=mlx and run
      # scripts/tts/setup-chatterbox-tts-macos.sh (idempotent) which provisions
      # the native-host Chatterbox sidecar and prints the .env values. Docker on
      # macOS has no Metal GPU passthrough, so cloning TTS runs host-native.
      # DPF_TTS_URL defaults to http://host.docker.internal:8771 (Chatterbox).
      # DPF_TTS_REFERENCE_HOST_ROOT is the HOST path of the voice storage dir.
      # Spec: docs/superpowers/specs/2026-05-28-tts-apple-silicon-local-design.md
      DPF_TTS_REFERENCE_HOST_ROOT: ${DPF_TTS_REFERENCE_HOST_ROOT:-}
      DPF_TTS_MLX_MODEL: ${DPF_TTS_MLX_MODEL:-}
      DPF_TTS_MLX_VOICE: ${DPF_TTS_MLX_VOICE:-}
      UPLOAD_STORAGE_PATH: ${UPLOAD_STORAGE_PATH:-/host-dpf/data/uploads}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # ensures host reachable on all platforms
    depends_on:
      portal-init:
        condition: service_completed_successfully
      inngest:
        condition: service_healthy
      browser-use:
        condition: service_healthy
      adp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Sandbox Database (isolated from production) ────────────────────────
  sandbox-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dpf
      POSTGRES_PASSWORD: dpf_sandbox
      POSTGRES_DB: dpf
    volumes:
      - sandbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpf"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Sandbox Init (migrations on sandbox DB) ──────────────────────────
  sandbox-init:
    build:
      context: .
      target: runner
      args:
        # See portal-init.build.args.DPF_VERSION above for the convention.
        DPF_VERSION: ${DPF_VERSION:-}
        DPF_PLATFORM_VERSION: ${DPF_PLATFORM_VERSION:-}
    command: ["/docker-entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql://dpf:dpf_sandbox@sandbox-postgres:5432/dpf
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
    volumes:
      - sandbox_workspace:/workspace
    depends_on:
      sandbox-postgres:
        condition: service_healthy

  # ─── Sandbox Pool (concurrent build environments for Build Studio) ──────
  # Pool of N sandbox containers, each with its own workspace volume.
  # Pool size configurable via DPF_SANDBOX_POOL_SIZE env (default: 3).
  # Legacy dpf-sandbox-1 on port 3035 remains as fallback.
  # This is the isolated build/runtime surface, not the production-served app.
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    restart: unless-stopped
    ports:
      - "3035:3000"
    volumes:
      - sandbox_workspace:/workspace
    environment:
      DATABASE_URL: postgresql://dpf:dpf_sandbox@sandbox-postgres:5432/dpf
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_TRUST_HOST: "true"
      APP_URL: http://localhost:3035
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j/dpf_dev}
      QDRANT_INTERNAL_URL: http://qdrant:6333
      NODE_ENV: development
      DPF_ENVIRONMENT: sandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"   # required on native Linux Docker; harmless on Docker Desktop
    # Without this healthcheck the sandbox process can wedge (e.g. on a
    # background DB compaction loop) while the container keeps reporting
    # "Up" — the Health tab flips to Critical via Prometheus, but `docker ps`
    # still looks fine. Mirrors the portal service probe so wedges surface
    # at the Docker layer too.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      sandbox-init:
        condition: service_completed_successfully


  # ─── Promoter (autonomous deployment pipeline) ─────────────────────────
  # One-shot container that builds new portal images from sandbox source.
  # Triggered by: execute_promotion MCP tool or operator "Deploy" button.
  # Not started by default (profiles: promote).
  promoter:
    build:
      context: .
      dockerfile: Dockerfile.promoter
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Use absolute host path via DPF_HOST_INSTALL_PATH (declared in
      # .env.docker.example) so bind mounts resolve regardless of the
      # operator's current working directory when invoking docker compose.
      # Backups bind mount honors DPF_BACKUPS_HOST_PATH (sibling-to-install
      # by default; see portal service comment above for rationale).
      - ${DPF_BACKUPS_HOST_PATH:-${DPF_HOST_INSTALL_PATH:-.}/backups}:/backups
      - ${DPF_HOST_INSTALL_PATH:-.}:/host-source:ro  # Host project source for building new portal images
    environment:
      DPF_PRODUCTION_DB_CONTAINER: dpf-postgres-1
      DPF_PORTAL_CONTAINER: dpf-portal-1
      DPF_COMPOSE_PROJECT: dpf
      POSTGRES_USER: ${POSTGRES_USER:-dpf}
      POSTGRES_DB: dpf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["promote"]
    restart: "no"

  # ─── Browser-Use (AI-powered browser automation, replaces Playwright) ──
  # Core service — review-phase UX verification depends on it. Kept always-on
  # in the default stack; the portal waits for its healthcheck before
  # accepting traffic so run_ux_test calls never hit a cold target.
  browser-use:
    build:
      context: ./services/browser-use
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8500:8500"
    volumes:
      - browser_evidence:/evidence
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://model-runner.docker.internal/v1}
      LLM_MODEL: ${BROWSER_USE_MODEL:-gpt-4o}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-needed-for-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: "8500"
      SESSION_TIMEOUT_SECONDS: "600"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  adp:
    build:
      context: .
      dockerfile: services/adp/Dockerfile
    restart: unless-stopped
    ports:
      - "8600:8600"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dpf:dpf_dev@postgres:5432/dpf}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      PORT: "8600"
      ADP_API_BASE_URL: ${ADP_API_BASE_URL:-}
      ADP_TOKEN_ENDPOINT_URL: ${ADP_TOKEN_ENDPOINT_URL:-}
      DPF_INTEGRATION_TEST_SESSION_ID: ${DPF_INTEGRATION_TEST_SESSION_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8600/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  integration-test-harness:
    build:
      context: .
      dockerfile: services/integration-test-harness/Dockerfile
    restart: unless-stopped
    profiles: ["integration-test"]
    ports:
      - "8700:8700"
    environment:
      PORT: "8700"
      HARNESS_TEST_MODE: ${HARNESS_TEST_MODE:-1}
      HARNESS_CONTROL_TOKEN: ${HARNESS_CONTROL_TOKEN:-integration-test-token}
      HARNESS_ADMIN_LOG_PATH: ${HARNESS_ADMIN_LOG_PATH:-/tmp/harness-admin-events.ndjson}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Dev Environment (isolated databases for development) ──────────────────
  dev-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      POSTGRES_USER: dpf
      POSTGRES_PASSWORD: dpf_dev
      POSTGRES_DB: dpf
    ports:
      - "5433:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpf"]
      interval: 5s
      timeout: 5s
      retries: 5

  dev-neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      NEO4J_AUTH: neo4j/dpf_dev_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - dev_neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  dev-qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    profiles: ["dev"]
    volumes:
      - dev_qdrant_data:/qdrant/storage
    ports:
      - "6334:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  dev-init:
    build:
      context: .
      target: dev
    profiles: ["dev"]
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm --filter @dpf/db exec prisma generate && pnpm --filter @dpf/db exec prisma migrate deploy && pnpm --filter @dpf/db exec tsx src/sanitized-clone.ts"]
    environment:
      CI: "true"
      DATABASE_URL: postgresql://dpf:dpf_dev@dev-postgres:5432/dpf
      PRODUCTION_DATABASE_URL: postgresql://dpf:${POSTGRES_PASSWORD:-dpf_dev}@postgres:5432/dpf
      NEO4J_URI: bolt://dev-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: dpf_dev_password
      PRODUCTION_NEO4J_URI: bolt://neo4j:7687
      DPF_ENVIRONMENT: dev
    volumes:
      - .:/workspace
      - dev_node_modules:/workspace/node_modules
    depends_on:
      dev-postgres:
        condition: service_healthy
      dev-neo4j:
        condition: service_healthy
      dev-qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Developer runtime surface. Use localhost:3001 for local non-production app
  # work so localhost:3000 remains the production-served portal.
  dev-portal:
    build:
      context: .
      target: dev
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "3001:3000"
    volumes:
      - .:/workspace
      - dev_node_modules:/workspace/node_modules
    environment:
      DATABASE_URL: postgresql://dpf:dpf_dev@dev-postgres:5432/dpf
      NEO4J_URI: bolt://dev-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: dpf_dev_password
      QDRANT_INTERNAL_URL: http://dev-qdrant:6333
      LLM_BASE_URL: ${LLM_BASE_URL:-http://model-runner.docker.internal/v1}
      DPF_ENVIRONMENT: dev
      AUTH_SECRET: dev_secret_change_me
      AUTH_TRUST_HOST: "true"
      CREDENTIAL_ENCRYPTION_KEY: dev_only_key_not_for_production_0000
      UPLOAD_STORAGE_PATH: /workspace/data/uploads
    depends_on:
      dev-init:
        condition: service_completed_successfully

  # ─── Monitoring Stack ─────────────────────────────────────────────────────
  # Headless infrastructure: feeds the platform's System Health dashboard,
  # alert pipeline, and AI Coworker health indicators. Starts by default.
  # Grafana (power-user tool) available at :3002.

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Windows: reaches the windows-host (windows_exporter) scrape target. Harmless on Docker Desktop / Linux where windows-host is not scraped.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-dpf_monitor}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dpf-overview.json
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # cadvisor + node-exporter bind-mount Linux-only host paths (/proc, /sys,
  # /var/lib/docker, /). They cannot run on macOS or Windows Docker Desktop
  # (the VM has no equivalent). Gated behind the linux-monitoring profile
  # per the deployment doctrine's Deployment Support Matrix. Linux installs
  # should use docker-compose.linux.yml, which also mounts the matching
  # Prometheus scrape config for these exporter targets.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    profiles: ["linux-monitoring"]
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    privileged: true

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    profiles: ["linux-monitoring"]
    ports:
      - "9100:9100"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-dpf}:${POSTGRES_PASSWORD:-dpf_dev}@postgres:5432/dpf?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Durable Execution (Inngest + Redis) ──────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s

  # redis-exporter — ~4 MB sidecar that scrapes the redis:6379 INFO output and
  # exposes it on :9121/metrics in Prometheus format. Lets the platform Health
  # tab promote the "Redis" tile from "Not scraped" to a real UP/DOWN tile.
  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    command: ["--redis.addr=redis://redis:6379"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9121/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  inngest:
    image: inngest/inngest:latest
    restart: unless-stopped
    command: "inngest start"
    ports:
      - "8288:8288"
      - "8289:8289"
    environment:
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY:-deadbeefcafebabe}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY:-abcdef0123456789}
      - INNGEST_POSTGRES_URI=postgres://${POSTGRES_USER:-dpf}:${POSTGRES_PASSWORD:-dpf_dev}@postgres:5432/inngest
      - INNGEST_REDIS_URI=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # inngest/inngest image ships without curl/wget/nc; use bash's built-in
      # /dev/tcp probe instead (no external binaries required). Just checks
      # the API port is listening — the API does its own internal health.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8288"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Voice Input — Speech-to-text sidecar (default-on, CPU) ────────────────
  # Owning spec: docs/superpowers/specs/2026-05-17-voice-input-slice-1-5-default-on-cpu.md
  # Owning plan: docs/superpowers/plans/2026-05-17-voice-input-slice-1-5-default-on-cpu.md
  #
  # 3-tier hardware ladder:
  #   Tier 1 (default — this block):  hwdsl2/whisper-server CPU image.
  #                                   ~190 MB image + ~145 MB base model.
  #                                   OpenAI-compatible /v1/audio/transcriptions
  #                                   matches transcription-adapter.ts contract.
  #                                   Multi-arch amd64 + arm64.
  #   Tier 2 (operator-enabled GPU):  Override DPF_STT_IMAGE to a CUDA-enabled
  #                                   variant. Activated via the SpeechToTextCard
  #                                   "Upgrade to GPU" button (Slice 1.6).
  #   Tier 3 (hosted):                Connect Groq / Deepgram / AssemblyAI via
  #                                   the standard provider-add flow. The
  #                                   classifyBiasPrompt gate already strips
  #                                   off-org-unsafe tokens before dispatch.
  #
  # No profile gate — voice ships working on `docker compose up`.
  dpf-stt:
    # Pinned to the multi-arch index digest for hwdsl2/whisper-server:latest
    # resolved on 2026-05-26. Bump deliberately; never reach for `:latest`
    # in shipped compose because it makes the install non-reproducible.
    image: ${DPF_STT_IMAGE:-hwdsl2/whisper-server@sha256:de379f0727e4c6b64bfb1be5c0c1c66bda215beb6a3e8e0c5d63061c73e9ec3b}
    restart: unless-stopped
    environment:
      # `base` (~145 MB) is the smallest model with usable accuracy on English.
      # Override DPF_STT_MODEL to e.g. `distil-small.en` for lower latency on
      # GPUs, or `large-v3` on a beefier machine.
      WHISPER_MODEL: ${DPF_STT_MODEL:-base}
    volumes:
      # Cache downloaded models across container restarts. First start downloads
      # the model (~10-30 s for base on a typical connection); subsequent
      # starts are warm.
      - dpf_stt_models:/app/models
    healthcheck:
      # hwdsl2/whisper-server listens on port 9000 internally. The legacy
      # speaches image was on 8000 — when swapping default-on tier we updated
      # all three: healthcheck, host port mapping below, and the provider
      # baseUrl in providers-registry.json.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start downloads the model, so start_period accommodates it.
      # Subsequent restarts hit the cached model and pass in ~3 s.
      start_period: 120s
    ports:
      # Localhost-only port binding. The portal reaches the sidecar via the
      # Docker network DNS name (dpf-stt:9000); the host-port mapping is for
      # developer-machine smoke testing only.
      - "127.0.0.1:8765:9000"

  # ─── Voice Output — Text-to-speech sidecar (opt-in via `tts` profile) ──────
  #
  # Provider: Chatterbox (Resemble AI, MIT license) — self-hosted, zero-shot
  # voice cloning. No API key required. No per-call cost. Data never leaves
  # the Docker network.
  # Principle: prefer-self-hosted-infrastructure
  # Spec: docs/superpowers/specs/2026-05-21-chatterbox-tts-self-hosted.md
  #
  # Hardware tiers:
  #   Tier 1 (CPU):   DPF_TTS_IMAGE=travisvn/chatterbox-tts-api:latest + unset NVIDIA deploy
  #                   ~10–30x slower but requires no GPU. Good for testing.
  #   Tier 2 (CUDA):  Default. Requires NVIDIA GPU ≥ 6 GB VRAM (Turbo model).
  #                   Can share GPU with dpf-stt when total VRAM ≥ 10 GB.
  #   Tier 3 (API):   Set TTS_PROVIDER=cartesia or TTS_PROVIDER=fish-audio in
  #                   the portal service env to route to a managed API instead.
  #
  # Opt-in: docker compose --profile tts up
  dpf-tts:
    image: ${DPF_TTS_IMAGE:-travisvn/chatterbox-tts-api:latest}
    profiles: ["tts"]
    restart: unless-stopped
    environment:
      # travisvn/chatterbox-tts-api defaults to port 5123; force 8000 so the
      # Docker-network DNS address (dpf-tts:8000) matches DPF_TTS_URL.
      PORT: "8000"
      # turbo = 350M params, ~5-6 GB VRAM, fastest inference.
      # Override to `original` (500M, ~7 GB) or `multilingual` (550M, 23 langs).
      TTS_MODEL: ${TTS_CHATTERBOX_MODEL:-turbo}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Persists registered reference audio clips across container restarts.
      - dpf_tts_voices:/app/voices
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First start downloads model weights (~600 MB for Turbo).
      start_period: 120s
    ports:
      # Localhost-only. Portal reaches sidecar via dpf-tts:8000 on the
      # Docker network (PORT=8000 above); host mapping is for developer smoke
      # testing only.
      - "127.0.0.1:8766:8000"

volumes:
  pgdata:
  neo4jdata:
  redis_data:
  qdrant_data:
  dpf-source-code:
  browser_evidence:
  dev_pgdata:
  dev_neo4jdata:
  dev_qdrant_data:
  dev_node_modules:
  sandbox_pgdata:
  sandbox_workspace:
  dpf_tts_voices:
  prometheus_data:
  grafana_data:
  dpf_stt_models:
