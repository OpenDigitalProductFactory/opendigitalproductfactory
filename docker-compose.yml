name: ${COMPOSE_PROJECT_NAME:-dpf}

# Bounded container logging (BI-C8164664). Docker's default json-file driver has
# NO size cap, so a single chatty/looping container can grow its log to many GB
# and "scroll like crazy" until it fills the host disk. We observed exactly this:
# self-hosted Inngest re-scanning a backlog of un-leasable poison queue items
# (nil envID) emitted ~135 ERROR lines/sec with full stack traces, growing one
# container log to 5.8 GB. Pin a rotation cap so the blast radius of ANY future
# log storm is bounded regardless of root cause. Apply via `<<: *default-logging`
# on every long-lived service. Override DPF_LOG_MAX_SIZE / DPF_LOG_MAX_FILE to
# tune (defaults keep at most 3 × 20 MB = 60 MB per container).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DPF_LOG_MAX_SIZE:-20m}
    max-file: ${DPF_LOG_MAX_FILE:-3}

# Dev-profile workspace mount (BI-9C557535). The dev services bind-mount the
# whole repo at /workspace, then overlay every node_modules directory with a
# named volume. Overlaying ONLY the root node_modules is not enough: pnpm also
# materialises package-local node_modules (symlink farms) under apps/* and
# packages/*, which would be written straight onto the host bind mount —
# polluting host worktrees with container-owned, Linux-style reparse points
# that Windows/BuildKit cannot open. Named (not anonymous) volumes are required
# so dev-init's install is visible to dev-portal at runtime.
x-dev-workspace-volumes: &dev-workspace-volumes
  - .:/workspace
  - dev_node_modules:/workspace/node_modules
  - dev_nm_apps_web:/workspace/apps/web/node_modules
  - dev_nm_apps_mobile:/workspace/apps/mobile/node_modules
  - dev_nm_api_client:/workspace/packages/api-client/node_modules
  - dev_nm_db:/workspace/packages/db/node_modules
  - dev_nm_dpf_bootstrap:/workspace/packages/dpf-bootstrap/node_modules
  - dev_nm_finance_templates:/workspace/packages/finance-templates/node_modules
  - dev_nm_integration_shared:/workspace/packages/integration-shared/node_modules
  - dev_nm_storefront_templates:/workspace/packages/storefront-templates/node_modules
  - dev_nm_types:/workspace/packages/types/node_modules
  - dev_nm_validators:/workspace/packages/validators/node_modules
  - dev_nm_svc_adp:/workspace/services/adp/node_modules
  - dev_nm_svc_edge_node:/workspace/services/edge-node/node_modules
  - dev_nm_svc_integration_test_harness:/workspace/services/integration-test-harness/node_modules

services:
  postgres:
    # Built from docker/postgres/Dockerfile (FROM pgvector + baked-in inngest
    # init script) rather than the stock pgvector image with a host bind mount.
    # The bind mount made postgres un-startable when the self-upgrade promoter
    # recreated it under `--project-directory /host-source` (BI-4796D52B); the
    # baked image has no host-path dependency, and pgvector can never drift out
    # of the image (BI-A35347E4). Compose auto-tags this `${project}-postgres`.
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # BI-4F3AB6B3: born-bounded always-on ceiling (config/install-resource-budgets.json).
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dpf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dpf_dev}
      POSTGRES_DB: dpf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dpf}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # BET-5 (BI-A1E864A5): Neo4j/Qdrant retired — platform runs on Postgres
  # (pgvector + graph mirror). Legacy env on portal/sandbox targets surviving
  # containers during the one-time upgrade backfill; containers are removed by
  # scripts/decommission-neo4j-qdrant.{sh,ps1}.

  # ─── AI Inference ────────────────────────────────────────────────────────────
  # Docker Model Runner (built into Docker Desktop 4.40+) provides local LLM
  # inference via OpenAI-compatible API at http://model-runner.docker.internal/v1.
  # No separate container needed — models are managed through Docker Desktop.
  # To pull a model:  docker model pull ai/gemma4
  # To list models:   docker model list

  portal-init:
    build:
      context: .
      target: runner
      args:
        # Stamps the build's source identity into /app/.dpf-image-version.
        # Set DPF_VERSION=$(git rev-parse HEAD) before `docker compose build`,
        # or use scripts/build-images.{ps1,sh} which does it for you. When
        # unset, the Dockerfile falls back to a content hash of the source.
        DPF_VERSION: ${DPF_VERSION:-}
        DPF_PLATFORM_VERSION: ${DPF_PLATFORM_VERSION:-}
    command: ["/docker-entrypoint.sh"]
    volumes:
      - dpf-source-code:/workspace
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dpf:dpf_dev@postgres:5432/dpf}
      DPF_HOST_PROFILE: ${DPF_HOST_PROFILE:-}
      DPF_HOST_INSTALL_PATH: ${DPF_HOST_INSTALL_PATH:-}
      DPF_SELF_UPGRADE_HOST_SOURCE_MOUNT: /host-dpf
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
    depends_on:
      postgres:
        condition: service_healthy

  # Production-served runtime for the real install. Keep localhost:3000 reserved
  # for this surface so customer-zero verification always targets the live path.
  portal:
    build:
      context: .
      target: runner
      args:
        # See portal-init.build.args.DPF_VERSION above for the convention.
        DPF_VERSION: ${DPF_VERSION:-}
        DPF_PLATFORM_VERSION: ${DPF_PLATFORM_VERSION:-}
    restart: unless-stopped
    logging: *default-logging
    # BI-4F3AB6B3: born-bounded always-on ceiling (config/install-resource-budgets.json).
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "2.0"
    ports:
      - "3000:3000"
      - "1455:3000"  # OpenAI Codex OAuth callback (shared client requires this port)
      # The directory listener (EP-24741BBF · BI-A91004A7). Loopback by default,
      # matching the step-ca overlay: an organization directory that other hosts
      # bind to is a deliberate choice, not a default. Nothing listens inside the
      # container until DPF_LDAP_ENABLED=1, so this mapping is inert until then.
      - "${DPF_LDAP_BIND_ADDRESS:-127.0.0.1}:${DPF_LDAP_PORT:-636}:${DPF_LDAP_PORT:-636}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dpf-source-code:/workspace
      - sandbox_workspace:/sandbox-workspace
      # browser-use writes UX verification screenshots here; the portal serves
      # them through /api/build/<buildId>/evidence/<fileName> (auth-gated).
      # Read-only from the portal's side — only browser-use should write.
      - browser_evidence:/evidence:ro
      # Platform-managed backups (daily Postgres + Neo4j + Qdrant).
      # Host bind mount (NOT a Docker volume) so `docker compose down -v`,
      # `docker volume rm`, or worktree-induced compose re-labelling cannot
      # destroy backups. Same path the promoter writes pre-promote dumps to.
      # See docs/superpowers/specs/2026-05-17-postgres-daily-backup-design.md.
      #
      # Source lives OUTSIDE the install root by default (DPF_BACKUPS_HOST_PATH
      # is set by the installer to a sibling like $DPF_DIR-backups) so that
      # dpf-reinstall.ps1 / uninstall-dpf.ps1 rm-ing $DPF_DIR cannot destroy
      # the only persisted copies of operator backups. Pre-relocation default
      # is preserved for installs that haven't been re-run since the PR that
      # introduced DPF_BACKUPS_HOST_PATH.
      - ${DPF_BACKUPS_HOST_PATH:-${DPF_HOST_INSTALL_PATH:-.}/backups}:/backups
      # Writable host mount: lets the portal write .mcp.json to the install
      # directory at token generation time. Requires DPF_HOST_INSTALL_PATH
      # to be set in .env (done by the installer at setup time).
      - ${DPF_HOST_INSTALL_PATH:-.}:/host-dpf
      # Signed transition receipts are host-owned; portal verifies read-only.
      # DPF_STATE_DIR MUST be an absolute, Docker-Desktop-shared host path (the
      # installer writes ~/.dpf). The ${HOME} fallback is a dev-only last resort:
      # the self-upgrade promoter runs as root, so ${HOME}=/root there and an unset
      # DPF_STATE_DIR would resolve to the unshareable /root/.dpf and fail the
      # migrate step with "mounts denied" (#3262). Guarded by check-compose-env-contract.
      - ${DPF_STATE_DIR:-${HOME}/.dpf}:/dpf-state:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dpf:dpf_dev@postgres:5432/dpf}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set - run scripts/setup.ps1 or scripts/setup.sh first}
      # AUTH_TRUST_HOST tells Auth.js to trust the request's Host /
      # X-Forwarded-Host header so callbacks resolve to whatever URL the
      # browser used (localhost, LAN IP, dpf.local, public domain). No
      # hardcoded URL — the portal works in all three modes (localhost,
      # LAN with mDNS, public with reverse proxy) without env edits.
      # Optional override: PUBLIC_URL — required only for outbound async
      # flows (emails, webhooks) where there's no in-flight request.
      AUTH_TRUST_HOST: "true"
      PUBLIC_URL: ${PUBLIC_URL:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set - run scripts/setup.ps1 or scripts/setup.sh first}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://model-runner.docker.internal/v1}
      # Management API for Ollama pull/delete/tags (distinct from OpenAI-compat
      # inference URL above). On Docker Desktop, host.docker.internal reaches
      # Ollama installed natively on the host. Linux sets this via the
      # docker-compose.linux.yml overlay instead (to http://ollama:11434).
      OLLAMA_INTERNAL_URL: ${OLLAMA_INTERNAL_URL:-http://host.docker.internal:11434}
      DEPLOYED_VERSION: ${DEPLOYED_VERSION:-}
      # Git SHA of the running image. This compose interpolation only resolves
      # to a value when DEPLOYED_SHA or DPF_VERSION is exported in the SHELL env
      # at `docker compose up` time (true for the promoter, which exports
      # DPF_VERSION; empty for a normal installer/restart `up`). To guarantee the
      # running portal ALWAYS carries the identity of its own bytes — the
      # BI-5B6C1C35 / spec §4.3 invariant — the runtime CMD (Dockerfile) seeds
      # DEPLOYED_SHA from the baked /app/.dpf-image-version when this resolves
      # empty, so `printenv DEPLOYED_SHA` is never blank on a built image. An
      # explicit value here (deploy pipeline) still takes precedence. See spec
      # §4.1 of docs/superpowers/specs/2026-05-23-governed-platform-upgrade-lifecycle-design.md.
      DEPLOYED_SHA: ${DEPLOYED_SHA:-${DPF_VERSION:-}}
      # The release overlay selects images with this tag. Pass the same value
      # into the portal so sourceless installs remain classifiable even when a
      # legacy installer did not write a host .install-mode marker.
      DPF_IMAGE_TAG: ${DPF_IMAGE_TAG:-}
      # Keep the registry namespace visible to the runtime as well as Compose.
      # Consumer self-upgrade needs this identity to resolve and launch the
      # immutable promoter image instead of falling back to the Git path.
      GHCR_OWNER: ${GHCR_OWNER:-opendigitalproductfactory}
      DPF_ENVIRONMENT: production
      DPF_HOST_INSTALL_PATH: ${DPF_HOST_INSTALL_PATH:-}
      DPF_HOST_PLATFORM: ${DPF_HOST_PLATFORM:-}
      DPF_HOST_ARCH: ${DPF_HOST_ARCH:-}
      # Installation identity process-override tier (BI-7626A660 / BI-10BF6206).
      # `environment-class-contract` and `estate-identity-contract` both document
      # a highest-precedence process override, and neither variable was listed
      # here — so on a consumer install, where this allow-list is the ONLY way an
      # env var reaches the portal, the documented top tier could never be set.
      # A precedence chain whose first rung is unreachable is not a precedence
      # chain. Empty default keeps the tier silent unless an operator sets it.
      DPF_ENVIRONMENT_CLASS: ${DPF_ENVIRONMENT_CLASS:-}
      DPF_ESTATE_NAME: ${DPF_ESTATE_NAME:-}
      # Authoritative installer opt-in state for the main installation's
      # supervised host Edge service. The portal combines this intent with
      # live enrollment/heartbeat evidence; it never treats the flag as health.
      DPF_EDGE_ENABLED: ${DPF_INCLUDE_EDGE:-0}
      DPF_STATE_DIR_HOST: ${DPF_STATE_DIR:-${HOME}/.dpf}
      DPF_RUNTIME_TRANSITION_SECRET_FILE_HOST: ${DPF_STATE_DIR:-${HOME}/.dpf}/runtime-transition.secret
      # The directory listener (EP-24741BBF · BI-A91004A7). Off unless the
      # operator sets DPF_LDAP_ENABLED=1 — an install does not start serving
      # an identity protocol because it was upgraded.
      DPF_LDAP_ENABLED: ${DPF_LDAP_ENABLED:-0}
      DPF_LDAP_PORT: ${DPF_LDAP_PORT:-636}
      DPF_LDAP_REQUIRE_CLIENT_CERTIFICATE: ${DPF_LDAP_REQUIRE_CLIENT_CERTIFICATE:-0}
      # LDAPS material comes from the organization CA that
      # scripts/bootstrap-organization-pki.sh already issues. Its default output
      # directory ($HOME/.dpf/pki) sits inside DPF_STATE_DIR, which is already
      # mounted read-only at /dpf-state — so the listener reuses the portal's
      # own issued identity rather than needing a second mount or a second cert.
      # An operator who moved DPF_PKI_DIR outside DPF_STATE_DIR must set these
      # three paths explicitly; the listener refuses to start rather than
      # falling back to a self-signed certificate.
      DPF_LDAP_TLS_CERT_PATH: ${DPF_LDAP_TLS_CERT_PATH:-/dpf-state/pki/authority.crt}
      DPF_LDAP_TLS_KEY_PATH: ${DPF_LDAP_TLS_KEY_PATH:-/dpf-state/pki/authority.key}
      DPF_LDAP_TLS_CA_PATH: ${DPF_LDAP_TLS_CA_PATH:-/dpf-state/pki/root_ca.crt}
      # Portal-side live-readiness checks run inside the container, where
      # process.cwd() is /app and not the host Git clone. Point git ancestry
      # helpers at the mounted host source so verify_live_install_readiness can
      # decide CAN-TEST vs MUST-ADVANCE without depending on github.com.
      DPF_REPO_ROOT: /host-dpf
      # Runtime policy generators must resolve from the deployed image before
      # the mutable host checkout so their rule bytes match DEPLOYED_SHA.
      DPF_RUNTIME_REPO_ROOT: /app
      # Host path used by the governed PostgreSQL recovery-point workflow.
      DPF_BACKUPS_HOST_PATH: ${DPF_BACKUPS_HOST_PATH:-}
      DPF_SELF_UPGRADE_HOST_SOURCE_MOUNT: /host-dpf
      INSTANCE_TYPE: dev
      # Agent codebase tools (search_project_files, list_project_directory,
      # read_project_file, writeProjectFile) resolve through this root.
      #
      # It used to be `/workspace` — the `dpf-source-code` named volume. NOTHING
      # POPULATES THAT VOLUME: no compose service, no script. Docker creates it
      # empty and whatever seeded it once drifts forever. On 2026-08-19 it held a
      # 2026-06-08 commit on a stray branch `my-changes` with 4,444 of the repo's
      # ~10,000 files, so agent code search returned success=true with EMPTY
      # results for files that plainly exist. The Build Studio ideate agent
      # searched correctly, found nothing, looped, and the operator was told "the
      # local AI wasn't strong enough — connect a stronger provider" (BI-6CFC5429).
      #
      # `/sandbox-workspace` is the `sandbox_workspace` volume the build sandboxes
      # mount as their own `/workspace` — the tree a build actually edits, and
      # already the intended target for writeProjectFile. Kernel decision
      # DI-9EC6B0895748 selected it over the read-write host bind `/host-dpf`,
      # which scored roughly half: `/host-dpf` reads current but would let agent
      # tooling write into the operator's real git clone (negative contributions
      # on "Least privilege, deny by default" and "Outbound and irreversible
      # actions require explicit go").
      #
      # NOT changed in the sibling compose files, whose /workspace is populated:
      # docker-compose.local-ci.yml binds a per-slot source volume from the slot
      # manifest; docker-compose.dev-against-live-db.yml bind-mounts the dev
      # worktree. Only this base file pointed at the orphaned volume.
      PROJECT_ROOT: /sandbox-workspace
      SANDBOX_PREVIEW_URL: http://sandbox:3000
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HIVE_CONTRIBUTION_TOKEN: ${HIVE_CONTRIBUTION_TOKEN:-}
      HIVE_OPS_TOKEN: ${HIVE_OPS_TOKEN:-}
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-deadbeefcafebabe}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-abcdef0123456789}
      INNGEST_DEV: ${INNGEST_DEV:-0}
      # Self-hosted Inngest (INNGEST_DEV=0) does NOT auto-discover apps, so the
      # portal must register its function catalog on boot — instrumentation.ts
      # PUTs /api/inngest when this is enabled. Default ON for compose installs:
      # without it, published events are accepted but silently dropped and NO
      # background job (self-upgrade, evals, brand extract, builds) ever runs.
      DPF_INNGEST_SELF_SYNC_ON_BOOT_ENABLED: ${DPF_INNGEST_SELF_SYNC_ON_BOOT_ENABLED:-1}
      # Installed compose runtimes need the scheduled function catalog too:
      # code graph reconcile, watchdogs, backups, wiki lint, and other cron
      # jobs are registered only when this flag is on. Library defaults stay
      # off for tests and ad-hoc imports; compose is the deployment contract.
      DPF_SCHEDULED_INNGEST_FUNCTIONS_ENABLED: ${DPF_SCHEDULED_INNGEST_FUNCTIONS_ENABLED:-1}
      # Federation dark-launch flags (default OFF; founder enables per the
      # federated-demand plan's two-instance verification gate). These MUST be
      # base-compose passthroughs so an operator opt-in lives in the install's
      # .env and survives the BASE-ONLY portal recreate that promote.sh falls
      # back to when install-state composeFiles is empty (which otherwise drops
      # docker-compose.override.yml and silently disables the exchange surface
      # on every self-upgrade). See BI-8C1F0A2E.
      DPF_FEDERATION_EXCHANGE_ENABLED: ${DPF_FEDERATION_EXCHANGE_ENABLED:-0}
      DPF_EDGE_INCIDENT_CORRELATION_ENABLED: ${DPF_EDGE_INCIDENT_CORRELATION_ENABLED:-0}
      # Allow outbound federation enroll/exchange to http:// and private/LAN-IP
      # peers (default OFF = https-only + SSRF block). Same-organization installs
      # on a plain-HTTP LAN need this to pair; must be a base passthrough for the
      # same base-only-recreate durability reason as the flags above. See
      # BI-CC8021CE.
      DPF_FEDERATION_ALLOW_INSECURE_PEERS: ${DPF_FEDERATION_ALLOW_INSECURE_PEERS:-0}
      # Multi-client governance soak (BI-42FA7DD8): observe-only fleet
      # backstops for leftover worktrees and Build Studio sandbox builds.
      # Primary reaping stays session-lifecycle (worktree-session-hygiene on
      # SessionEnd) and transactional (sandbox GC on promote/abandon/
      # complete) — these are dry-run-only backstops for whatever slips
      # through. Default ON for every compose install so operators get the
      # visibility without asking. Do NOT default AUTO_REAP or
      # DELETE_BRANCHES to 1 here: those are live/destructive and require an
      # explicit per-install operator opt-in after a clean observe soak.
      DPF_WORKTREE_JANITOR_ENABLED: ${DPF_WORKTREE_JANITOR_ENABLED:-1}
      DPF_SANDBOX_BUILD_GC_ENABLED: ${DPF_SANDBOX_BUILD_GC_ENABLED:-1}
      # WS9 governed WorkCapsule reaper (BI-CBAAEA94): transitions dead capsules
      # (lease-expired / linked-build-terminal / idle-past-floor) working->abandoned
      # so abandoned work stops reading as active on the board and jamming the WIP
      # cap. Delivered HERE (base compose), not override-only: an override-only flag
      # is dropped when the self-upgrade promoter recreates the portal, which is why
      # the WS9 sprawl re-accumulated after it first shipped. Same soak model as the
      # janitors above — ENABLED defaults ON = observe-only (logs would-reap, no DB
      # writes); AUTO_REAP is the live/reversible actuation and stays OFF until a
      # per-install operator opt-in via .env.
      DPF_WORKCAPSULE_REAPER_ENABLED: ${DPF_WORKCAPSULE_REAPER_ENABLED:-1}
      DPF_WORKCAPSULE_REAPER_AUTO_REAP: ${DPF_WORKCAPSULE_REAPER_AUTO_REAP:-0}
      # Runtime-artifact janitor (BI-DBF3F426 / BI-A55BE432): reaps orphaned
      # per-branch CI images + stray compose projects INCLUDING their named
      # volumes — the dominant local-disk leak (dead dpf-<topic> dev stacks
      # still holding pgdata/node_modules). Same soak model as the worktree
      # janitor: observe defaults ON so operators get the daily would-reap log;
      # AUTO_REAP is live/destructive and stays OFF until a per-install opt-in
      # after a clean observe soak. The portal mounts the docker socket, so the
      # daily 05:20 job can actually see Docker on a compose install.
      DPF_RUNTIME_ARTIFACT_JANITOR_ENABLED: ${DPF_RUNTIME_ARTIFACT_JANITOR_ENABLED:-1}
      DPF_RUNTIME_ARTIFACT_JANITOR_AUTO_REAP: ${DPF_RUNTIME_ARTIFACT_JANITOR_AUTO_REAP:-0}
      # Register ScheduledJob heartbeat rows and other low-risk boot hygiene
      # for installed runtimes. Without this, first-run installs have no
      # code-graph job row and status surfaces report missing background work.
      DPF_OPTIONAL_STARTUP_TASKS_ENABLED: ${DPF_OPTIONAL_STARTUP_TASKS_ENABLED:-1}
      # BI-89030C9B Phase 1 — durable build execution. When on, autoExecuteBuild
      # hands the run to the build/execute Inngest function (journaled per-step,
      # resumes across portal recycles) instead of the legacy in-process loop.
      # Default OFF during the burn-in window; flip per-install via host .env.
      DPF_BUILD_DURABLE_EXECUTION_ENABLED: ${DPF_BUILD_DURABLE_EXECUTION_ENABLED:-0}
      # Per-build worktree isolation is the default Build Studio sandbox posture:
      # each build runs file operations in /workspace/.builds/<buildId> instead
      # of sharing one mutable checkout. Set to 0 only for emergency rollback.
      DPF_BUILD_WORKTREE_ISOLATION: ${DPF_BUILD_WORKTREE_ISOLATION:-1}
      # Autonomous build completion (operator opt-in, default OFF). When on, a
      # verified build at `ship` auto-resolves its delivery forks (PR push +
      # product/promotion); the periodic reconciler then advances it ship→complete
      # once its merged code is live via the platform self-upgrade. The feature
      # code (PRs #2180 + #2188) reads this env var, but the deployment contract
      # never passed it through — so the switch could not survive a self-upgrade
      # (which recreates from this file, not docker-compose.override.yml). See
      # docs/operations/autonomous-build-completion.md. Flip per-install via host .env.
      DPF_AUTO_COMPLETE_VERIFIED_BUILDS: ${DPF_AUTO_COMPLETE_VERIFIED_BUILDS:-0}
      # Governed Living Playbook autonomy remains fail-closed unless an operator
      # enables shadow or enforce mode for this install.
      DPF_BUILD_AUTONOMOUS_PLAYBOOK_MODE: ${DPF_BUILD_AUTONOMOUS_PLAYBOOK_MODE:-off}
      # PR observation and compare-and-swap delivery actions have an independent
      # kill switch so rollout can stop without changing build evidence.
      DPF_BUILD_PR_DELIVERY_RECONCILER_MODE: ${DPF_BUILD_PR_DELIVERY_RECONCILER_MODE:-off}
      # Tell Inngest's serve() the externally-reachable URL for this app so
      # sync registrations announce the Docker-DNS hostname (not the Host
      # header of the /api/inngest PUT, which would be "localhost:3000"
      # when the instrumentation hook self-syncs from inside the container).
      # Without this, Inngest records the app URL as localhost:3000, then
      # retries forever against itself when dispatching queued steps —
      # symptom: events publish + initialize but never execute, UI hangs.
      INNGEST_SERVE_ORIGIN: http://portal:3000
      # Allow plain-HTTP MCP traffic from in-bridge clients (sandbox→portal,
      # promoter→portal). The MCP route otherwise refuses non-localhost HTTP.
      # Operator-overridable via MCP_INSECURE_INTERNAL_HOSTS in .env. Bearer
      # tokens, origin checks, and grant scopes are still enforced — this
      # only relaxes the transport-layer TLS gate for known internal hosts.
      MCP_INSECURE_INTERNAL_HOSTS: ${MCP_INSECURE_INTERNAL_HOSTS:-portal,host.docker.internal,sandbox}
      # TTS provider — defaults to self-hosted Chatterbox (prefer-self-hosted-infrastructure).
      # Override: TTS_PROVIDER=cartesia or TTS_PROVIDER=fish-audio to use a managed API.
      TTS_PROVIDER: ${TTS_PROVIDER:-chatterbox}
      DPF_TTS_URL: ${DPF_TTS_URL:-http://dpf-tts:8000}
      # Apple Silicon / non-NVIDIA hosts: set TTS_PROVIDER=mlx and run
      # scripts/tts/setup-chatterbox-tts-macos.sh (idempotent) which provisions
      # the native-host Chatterbox sidecar and prints the .env values. Docker on
      # macOS has no Metal GPU passthrough, so cloning TTS runs host-native.
      # DPF_TTS_URL defaults to http://host.docker.internal:8771 (Chatterbox).
      # DPF_TTS_REFERENCE_HOST_ROOT is the HOST path of the voice storage dir.
      # Spec: docs/superpowers/specs/2026-05-28-tts-apple-silicon-local-design.md
      DPF_TTS_REFERENCE_HOST_ROOT: ${DPF_TTS_REFERENCE_HOST_ROOT:-}
      DPF_TTS_MLX_MODEL: ${DPF_TTS_MLX_MODEL:-}
      DPF_TTS_MLX_VOICE: ${DPF_TTS_MLX_VOICE:-}
      # Platform-correct compose chain (space-separated) the install was created
      # with. install-dpf.sh writes this from the same set it records in
      # install-state.json. The self-upgrade orchestrator reads it and passes it to
      # the promoter as PROMOTE_COMPOSE_FILES so the portal is recreated with the
      # install's OWN overlays — never the macOS overlay force-applied on a
      # Windows/Linux host (the broken-TTS defect). Empty => promote.sh base-only.
      DPF_SELF_UPGRADE_COMPOSE_FILES: ${DPF_SELF_UPGRADE_COMPOSE_FILES:-}
      UPLOAD_STORAGE_PATH: ${UPLOAD_STORAGE_PATH:-/host-dpf/data/uploads}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # ensures host reachable on all platforms
    depends_on:
      portal-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Sandbox Database (isolated from production) ────────────────────────
  sandbox-postgres:
    profiles: ["runtime-build"]
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: dpf
      POSTGRES_PASSWORD: dpf_sandbox
      POSTGRES_DB: dpf
    volumes:
      - sandbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpf"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Sandbox Init (migrations on sandbox DB) ──────────────────────────
  sandbox-init:
    profiles: ["runtime-build"]
    build:
      context: .
      target: runner
      args:
        # See portal-init.build.args.DPF_VERSION above for the convention.
        DPF_VERSION: ${DPF_VERSION:-}
        DPF_PLATFORM_VERSION: ${DPF_PLATFORM_VERSION:-}
    command: ["/docker-entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql://dpf:dpf_sandbox@sandbox-postgres:5432/dpf
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
    volumes:
      - sandbox_workspace:/workspace
    depends_on:
      sandbox-postgres:
        condition: service_healthy

  # ─── Sandbox Pool (concurrent build environments for Build Studio) ──────
  # Pool of N sandbox containers, each with its own workspace volume.
  # Pool size configurable via DPF_SANDBOX_POOL_SIZE env (default: 3).
  # Legacy dpf-sandbox-1 on port 3035 remains as fallback.
  # This is the isolated build/runtime surface, not the production-served app.
  sandbox:
    profiles: ["runtime-build"]
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3035:3000"
    volumes:
      - sandbox_workspace:/workspace
    environment:
      DATABASE_URL: postgresql://dpf:dpf_sandbox@sandbox-postgres:5432/dpf
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_TRUST_HOST: "true"
      APP_URL: http://localhost:3035
      NODE_ENV: development
      DPF_ENVIRONMENT: sandbox
      DPF_BUILD_WORKTREE_ISOLATION: ${DPF_BUILD_WORKTREE_ISOLATION:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # required on native Linux Docker; harmless on Docker Desktop
    # Without this healthcheck the sandbox process can wedge (e.g. on a
    # background DB compaction loop) while the container keeps reporting
    # "Up" — the Health tab flips to Critical via Prometheus, but `docker ps`
    # still looks fine. Mirrors the portal service probe so wedges surface
    # at the Docker layer too.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      sandbox-init:
        condition: service_completed_successfully


  # ─── Promoter (autonomous deployment pipeline) ─────────────────────────
  # One-shot container that builds new portal images from sandbox source.
  # Triggered by: execute_promotion MCP tool or operator "Deploy" button.
  # Not started by default (profiles: promote).
  promoter:
    build:
      context: .
      dockerfile: Dockerfile.promoter
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Use absolute host path via DPF_HOST_INSTALL_PATH (declared in
      # .env.docker.example) so bind mounts resolve regardless of the
      # operator's current working directory when invoking docker compose.
      # Backups bind mount honors DPF_BACKUPS_HOST_PATH (sibling-to-install
      # by default; see portal service comment above for rationale).
      - ${DPF_BACKUPS_HOST_PATH:-${DPF_HOST_INSTALL_PATH:-.}/backups}:/backups
      - ${DPF_HOST_INSTALL_PATH:-.}:/host-source:ro  # Host project source for building new portal images
    environment:
      DPF_PRODUCTION_DB_CONTAINER: dpf-postgres-1
      DPF_PORTAL_CONTAINER: dpf-portal-1
      DPF_COMPOSE_PROJECT: dpf
      POSTGRES_USER: ${POSTGRES_USER:-dpf}
      POSTGRES_DB: dpf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["promote"]
    restart: "no"

  # ─── Browser-Use (AI-powered browser automation, replaces Playwright) ──
  # Core service — review-phase UX verification depends on it. Kept always-on
  # in the browser-automation capability profile. Portal clients report the
  # capability as inactive until the sidecar is enabled and healthy.
  browser-use:
    profiles: ["runtime-browser-automation"]
    build:
      context: ./services/browser-use
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8500:8500"
    volumes:
      - browser_evidence:/evidence
      # Service-account Chromium user-data-dirs at /profiles/<principalId>/<siteKey>/.
      # Secret impersonation material — sidecar is the only writer; the portal
      # never mounts this volume (EP-BROWSER-DRIVE, spec §8.9).
      - browser_profiles:/profiles
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://model-runner.docker.internal/v1}
      LLM_MODEL: ${BROWSER_USE_MODEL:-gpt-4o}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-needed-for-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: "8500"
      SESSION_TIMEOUT_SECONDS: "600"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  adp:
    build:
      context: .
      dockerfile: services/adp/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # Opt-in (BI architecture-review footprint cut). The ADP payroll/HRIS bridge
    # is only needed by installs that actually connect ADP — most never do, so it
    # no longer runs by default. The portal's depends_on no longer waits on it
    # (an absent profiled dependency would otherwise block `compose up`), and the
    # ADP integration degrades to "unavailable" until enabled. Turn on with:
    #   docker compose --profile integrations-adp up -d adp
    profiles: ["integrations-adp"]
    ports:
      - "8600:8600"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dpf:dpf_dev@postgres:5432/dpf}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      PORT: "8600"
      ADP_API_BASE_URL: ${ADP_API_BASE_URL:-}
      ADP_TOKEN_ENDPOINT_URL: ${ADP_TOKEN_ENDPOINT_URL:-}
      DPF_INTEGRATION_TEST_SESSION_ID: ${DPF_INTEGRATION_TEST_SESSION_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8600/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  integration-test-harness:
    build:
      context: .
      dockerfile: services/integration-test-harness/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    profiles: ["integration-test"]
    ports:
      - "8700:8700"
    environment:
      PORT: "8700"
      HARNESS_TEST_MODE: ${HARNESS_TEST_MODE:-1}
      HARNESS_CONTROL_TOKEN: ${HARNESS_CONTROL_TOKEN:-integration-test-token}
      HARNESS_ADMIN_LOG_PATH: ${HARNESS_ADMIN_LOG_PATH:-/tmp/harness-admin-events.ndjson}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Dev Environment (isolated databases for development) ──────────────────
  dev-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    profiles: ["dev"]
    environment:
      POSTGRES_USER: dpf
      POSTGRES_PASSWORD: dpf_dev
      POSTGRES_DB: dpf
    ports:
      - "5433:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      # dev-init gates migrations on this verdict. Reachability alone is not
      # enough: BET-5 migrations require the image to ship vector.control.
      test: ["CMD-SHELL", "pg_isready -U dpf -d dpf && psql -U dpf -d dpf -Atqc \"SELECT 1 FROM pg_available_extensions WHERE name = 'vector'\" | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # BET-5 (BI-A1E864A5): Neo4j/Qdrant retired — platform runs on Postgres
  dev-init:
    build:
      context: .
      target: dev
    profiles: ["dev"]
    # BI-4DB4B415: migrate through the disposable-preview converge wrapper so a
    # schema-ahead / failed "already exists" history can be repaired safely
    # (or classified blocked_sandbox_drift) without touching the live portal DB.
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm --filter @dpf/db exec prisma generate && pnpm --filter @dpf/db exec node ./scripts/dev-preview-migrate-deploy.mjs && pnpm --filter @dpf/db exec tsx src/sanitized-clone.ts"]
    environment:
      CI: "true"
      DATABASE_URL: postgresql://dpf:dpf_dev@dev-postgres:5432/dpf
      PRODUCTION_DATABASE_URL: postgresql://dpf:${POSTGRES_PASSWORD:-dpf_dev}@postgres:5432/dpf
      DPF_ENVIRONMENT: dev
      CONTRIBUTOR_PREVIEW_PASSWORD: ${CONTRIBUTOR_PREVIEW_PASSWORD:-}
    volumes: *dev-workspace-volumes
    depends_on:
      dev-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Developer runtime surface. Use localhost:3001 for local non-production app
  # work so localhost:3000 remains the production-served portal.
  dev-portal:
    build:
      context: .
      target: dev
    # BI-0DF1F354: never infinite-restart when the leased worktree vanishes.
    # Cap crash restarts; missing-workspace preflight exits 0 so it does not
    # thrash even under unless-stopped semantics.
    restart: "on-failure:5"
    logging: *default-logging
    profiles: ["dev"]
    ports:
      - "3001:3000"
    volumes: *dev-workspace-volumes
    environment:
      DATABASE_URL: postgresql://dpf:dpf_dev@dev-postgres:5432/dpf
      LLM_BASE_URL: ${LLM_BASE_URL:-http://model-runner.docker.internal/v1}
      DPF_ENVIRONMENT: dev
      # Preflight reads cwd (/workspace); override only for tests.
      DPF_DEV_PORTAL_WORKSPACE_ROOT: /workspace
      AUTH_SECRET: dev_secret_change_me
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3001
      PUBLIC_URL: http://localhost:3001
      CREDENTIAL_ENCRYPTION_KEY: dev_only_key_not_for_production_0000
      UPLOAD_STORAGE_PATH: /workspace/data/uploads
    depends_on:
      dev-init:
        condition: service_completed_successfully

  # ─── Monitoring Stack ─────────────────────────────────────────────────────
  # Headless infrastructure: feeds the platform's System Health dashboard,
  # alert pipeline, and AI Coworker health indicators. Activated by the
  # deep-observability runtime capability.
  # Grafana (power-user tool) available at :3002.

  prometheus:
    profiles: ["runtime-deep-observability", "observability-ui"]
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Windows: reaches the windows-host (windows_exporter) scrape target. Harmless on Docker Desktop / Linux where windows-host is not scraped.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    logging: *default-logging
    # Opt-in (BI architecture-review footprint cut). Grafana is the power-user
    # escape hatch: the platform renders its own context-aware dashboards
    # (Postgres + Neo4j + Prometheus) on the System Health tab and delivers
    # alerts via the Inngest poll-bridge, so Grafana is not on the operational or
    # alerting path. The whole monitoring stack follows the deep-observability
    # capability; the legacy alias selects the same portable service closure:
    #   docker compose --profile observability-ui up -d
    profiles: ["runtime-deep-observability", "observability-ui"]
    ports:
      - "3002:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-dpf_monitor}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dpf-overview.json
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Log Aggregation (EP-FULL-OBS Tier 2) ─────────────────────────────────
  # Owning spec: docs/superpowers/specs/2026-06-09-container-log-aggregation-and-proactive-issue-detection-design.md
  #
  # Loki (store) + Alloy (shipper). Default-on and CROSS-PLATFORM: Alloy reads
  # the Docker log API via the socket — no host-path bind mounts — so unlike
  # cadvisor/node-exporter below this pair runs on macOS/Windows Docker Desktop,
  # which is exactly where the log-flood incident this spec addresses happened.
  # Captures EVERY container's stdout/stderr with 14-day retention so errors
  # stop scrolling out of the ephemeral Docker buffer unseen.
  loki:
    profiles: ["runtime-deep-observability", "observability-ui"]
    image: grafana/loki:3.4.3
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3100:3100"   # localhost-only; portal + grafana reach it via dpf-network DNS
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      # Ruler rules: "fake" is the single-tenant id when auth_enabled: false.
      - ./monitoring/loki/rules/dpf-log-alerts.yml:/loki/rules-config/fake/dpf-log-alerts.yml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    # No container healthcheck: grafana/loki 3.x is distroless — no shell,
    # busybox, wget, or curl exists in the image, so every CMD/CMD-SHELL
    # probe fails with "executable file not found" and the container sits
    # permanently unhealthy, which blocked the whole install (alloy gates
    # on it). Loki readiness is observed externally instead: Prometheus
    # scrapes it and the portal's log-issues panel talks to its API.

  alloy:
    profiles: ["runtime-deep-observability", "observability-ui"]
    image: grafana/alloy:v1.7.5
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # discovers + tails all containers
      - alloy_data:/var/lib/alloy/data
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    depends_on:
      loki:
        # service_started, not service_healthy: the loki image is distroless
        # and cannot host a healthcheck (see loki service above). Alloy
        # buffers and retries its Loki pushes internally, so it only needs
        # the container up, not a readiness gate.
        condition: service_started

  # cadvisor + node-exporter bind-mount Linux-only host paths (/proc, /sys,
  # /var/lib/docker, /). They cannot run on macOS or Windows Docker Desktop
  # (the VM has no equivalent). Gated behind the linux-monitoring profile
  # per the deployment doctrine's Deployment Support Matrix. Linux installs
  # should use docker-compose.linux.yml, which also mounts the matching
  # Prometheus scrape config for these exporter targets.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    logging: *default-logging
    profiles: ["linux-monitoring"]
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    privileged: true

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    logging: *default-logging
    profiles: ["linux-monitoring"]
    ports:
      - "9100:9100"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

  postgres-exporter:
    profiles: ["runtime-deep-observability", "observability-ui"]
    image: prometheuscommunity/postgres-exporter:v0.19.1
    restart: unless-stopped
    logging: *default-logging
    command: ["--config.file=/postgres_exporter.yml"]
    ports:
      - "9187:9187"
    volumes:
      - ./monitoring/postgres-exporter/postgres_exporter.yml:/postgres_exporter.yml:ro
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-dpf}:${POSTGRES_PASSWORD:-dpf_dev}@postgres:5432/dpf?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Durable Execution (Inngest + Redis) ──────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # redis-exporter — ~4 MB sidecar that scrapes the redis:6379 INFO output and
  # exposes it on :9121/metrics in Prometheus format. Lets the platform Health
  # tab promote the "Redis" tile from "Not scraped" to a real UP/DOWN tile.
  redis-exporter:
    profiles: ["runtime-durable-automation"]
    image: oliver006/redis_exporter:v1.86.0
    restart: unless-stopped
    logging: *default-logging
    command: ["--redis.addr=redis://redis:6379"]
    depends_on:
      redis:
        condition: service_healthy
    # No container healthcheck: oliver006/redis_exporter is built FROM
    # scratch — the exporter binary is the only file in the image, so no
    # probe command can run. Nothing gates on this service; Prometheus
    # scraping /metrics is the effective health signal.

  inngest:
    # Pinned (was :latest). :latest drifted onto 1.26.0, which has a
    # self-hosted `inngest start` regression: every queued item fails its
    # capacity-lease with "missing envID" (itemLeaseConstraintCheck) and
    # retries up to maxAtts, spinning the scheduler at ~55% CPU and amplifying
    # every background job (incl. dimension evals → local-LLM GPU churn).
    # Fixed forward in 1.28/1.29 (#4400 ErrQueueItemExists retries, #4419 set
    # envid, #4391/#4438 constraint/lease scan). 1.26→1.30 goose migration
    # validated on a throwaway DB copy (v7→v10, clean). Pin to keep :latest
    # from silently regressing again. BI-C8164664.
    #
    # BI-915C40C6 (2026-07-11): bump pin 1.30 → 1.36 for orphan-reconciliation
    # / dup-span handling improvements in newer releases. Redis {estate} TTL is
    # still server-internal (~12–16h observed); DPF bounds corpses via the
    # retention/orphan janitor (ORPHAN_REAP_AGE_HOURS=24), not by setting Redis.
    #
    # IMPORTANT (2026-06-18): the version bump only stops NEW poison items from
    # being enqueued (1.28+ sets envID). It does NOT drain items already enqueued
    # by the 1.26-era bug — those live in the Redis queue store (INNGEST_REDIS_URI
    # below), not Postgres, so the goose history migration never touched them.
    # Pre-1.28 poison items still need a one-time drain of stuck
    # `{queue}:queue:sorted:<fnID>` partitions (scripts/drain-inngest-poison-queue.sh).
    # The `<<: *default-logging` cap below bounds the blast radius if it ever recurs.
    image: inngest/inngest:v1.36.0
    restart: unless-stopped
    logging: *default-logging
    command: "inngest start"
    ports:
      - "8288:8288"
      - "8289:8289"
    environment:
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY:-deadbeefcafebabe}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY:-abcdef0123456789}
      - INNGEST_POSTGRES_URI=postgres://${POSTGRES_USER:-dpf}:${POSTGRES_PASSWORD:-dpf_dev}@postgres:5432/inngest
      - INNGEST_REDIS_URI=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # inngest/inngest image ships without curl/wget/nc; use bash's built-in
      # /dev/tcp probe instead (no external binaries required). Just checks
      # the API port is listening — the API does its own internal health.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8288"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ─── Voice Input — Speech-to-text sidecar (capability-owned, CPU) ──────────
  # Owning spec: docs/superpowers/specs/2026-05-17-voice-input-slice-1-5-default-on-cpu.md
  # Owning plan: docs/superpowers/plans/2026-05-17-voice-input-slice-1-5-default-on-cpu.md
  #
  # 3-tier hardware ladder:
  #   Tier 1 (default — this block):  hwdsl2/whisper-server CPU image.
  #                                   ~190 MB image + ~145 MB base model.
  #                                   OpenAI-compatible /v1/audio/transcriptions
  #                                   matches transcription-adapter.ts contract.
  #                                   Multi-arch amd64 + arm64.
  #   Tier 2 (operator-enabled GPU):  Override DPF_STT_IMAGE to a CUDA-enabled
  #                                   variant. Activated via the SpeechToTextCard
  #                                   "Upgrade to GPU" button (Slice 1.6).
  #   Tier 3 (hosted):                Connect Groq / Deepgram / AssemblyAI via
  #                                   the standard provider-add flow. The
  #                                   classifyBiasPrompt gate already strips
  #                                   off-org-unsafe tokens before dispatch.
  #
  # The local-speech capability activates this sidecar.
  dpf-stt:
    profiles: ["runtime-local-speech", "tts"]
    # Pinned to the multi-arch index digest for hwdsl2/whisper-server:latest
    # resolved on 2026-08-27 (the prior 166a8c04… digest was deleted from the
    # registry — Release Image Manifest Guard caught it again). The registry
    # owner re-pushes :latest periodically and prunes the previous index, so
    # this digest must be re-resolved every time the guard fails. Bump
    # deliberately; never reach for `:latest` in shipped compose because it
    # makes the install non-reproducible.
    # OPERATOR RECOVERY (immediate, per-install): if this digest has rotted and
    # the sidecar won't start, set DPF_STT_IMAGE in .env to a reachable ref
    # (e.g. hwdsl2/whisper-server:latest) then `docker compose up -d dpf-stt`,
    # and open a PR re-resolving the digest here (this is that PR's pattern).
    image: ${DPF_STT_IMAGE:-hwdsl2/whisper-server@sha256:8f76c4f99069b533b54866388f6a6cb1cb47cfde14762dc7af0b22dd58721df2}
    restart: unless-stopped
    logging: *default-logging
    environment:
      # `base` (~145 MB) is the smallest model with usable accuracy on English.
      # Override DPF_STT_MODEL to e.g. `distil-small.en` for lower latency on
      # GPUs, or `large-v3` on a beefier machine.
      WHISPER_MODEL: ${DPF_STT_MODEL:-base}
    volumes:
      # Cache downloaded models across container restarts. First start downloads
      # the model (~10-30 s for base on a typical connection); subsequent
      # starts are warm.
      - dpf_stt_models:/app/models
    healthcheck:
      # hwdsl2/whisper-server listens on port 9000 internally. The legacy
      # speaches image was on 8000 — when swapping default-on tier we updated
      # all three: healthcheck, host port mapping below, and the provider
      # baseUrl in providers-registry.json.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start downloads the model, so start_period accommodates it.
      # Subsequent restarts hit the cached model and pass in ~3 s.
      start_period: 120s
    ports:
      # Localhost-only port binding. The portal reaches the sidecar via the
      # Docker network DNS name (dpf-stt:9000); the host-port mapping is for
      # developer-machine smoke testing only.
      - "127.0.0.1:8765:9000"

  # ─── Voice Output — Text-to-speech sidecar (opt-in via `tts` profile) ──────
  #
  # Provider: Chatterbox (Resemble AI, MIT license) — self-hosted, zero-shot
  # voice cloning. No API key required. No per-call cost. Data never leaves
  # the Docker network.
  # Principle: prefer-self-hosted-infrastructure
  # Spec: docs/superpowers/specs/2026-05-21-chatterbox-tts-self-hosted.md
  #
  # Hardware tiers:
  #   Tier 1 (CPU):   DPF_TTS_IMAGE=travisvn/chatterbox-tts-api:latest + unset NVIDIA deploy
  #                   ~10–30x slower but requires no GPU. Good for testing.
  #   Tier 2 (CUDA):  Default. Requires NVIDIA GPU ≥ 6 GB VRAM (Turbo model).
  #                   Can share GPU with dpf-stt when total VRAM ≥ 10 GB.
  #   Tier 3 (API):   Set TTS_PROVIDER=cartesia or TTS_PROVIDER=fish-audio in
  #                   the portal service env to route to a managed API instead.
  #
  # Compatibility alias selects the full local-speech closure:
  #   docker compose --profile tts up
  dpf-tts:
    # BI-A0A0568F: profile-gated only (never always-on). See
    # docs/architecture/2026-08-09-tts-idle-process-elimination.md.
    image: ${DPF_TTS_IMAGE:-travisvn/chatterbox-tts-api:v0.1.0}
    profiles: ["runtime-local-speech", "tts"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      # travisvn/chatterbox-tts-api defaults to port 5123; force 8000 so the
      # Docker-network DNS address (dpf-tts:8000) matches DPF_TTS_URL.
      PORT: "8000"
      # turbo = 350M params, ~5-6 GB VRAM, fastest inference.
      # Override to `original` (500M, ~7 GB) or `multilingual` (550M, 23 langs).
      TTS_MODEL: ${TTS_CHATTERBOX_MODEL:-turbo}
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Persists registered reference audio clips across container restarts.
      - dpf_tts_voices:/app/voices
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First start downloads model weights (~600 MB for Turbo).
      start_period: 120s
    ports:
      # Localhost-only. Portal reaches sidecar via dpf-tts:8000 on the
      # Docker network (PORT=8000 above); host mapping is for developer smoke
      # testing only.
      - "127.0.0.1:8766:8000"

volumes:
  pgdata:
  redis_data:
  # BET-5 (BI-A1E864A5): neo4jdata / qdrant_data / dev_neo4jdata / dev_qdrant_data
  # volume declarations removed — Neo4j/Qdrant retired (Postgres pgvector + graph
  # mirror). Runtime volumes are deleted by scripts/decommission-neo4j-qdrant.{sh,ps1}.
  dpf-source-code:
  browser_evidence:
  # Service-account browser profiles (EP-BROWSER-DRIVE, spec §8.9). Holds
  # Chromium user-data-dirs whose cookie jars are impersonation-capable —
  # SECRET material, not ordinary evidence. Sidecar-only: never mounted into
  # the portal (cf. browser_evidence, which the portal mounts read-only).
  browser_profiles:
  dev_pgdata:
  dev_node_modules:
  # Package-local node_modules overlays (BI-9C557535) — keep pnpm's per-package
  # symlink farms off the host bind mount. One per workspace package.
  dev_nm_apps_web:
  dev_nm_apps_mobile:
  dev_nm_api_client:
  dev_nm_db:
  dev_nm_dpf_bootstrap:
  dev_nm_finance_templates:
  dev_nm_integration_shared:
  dev_nm_storefront_templates:
  dev_nm_types:
  dev_nm_validators:
  dev_nm_svc_adp:
  dev_nm_svc_edge_node:
  dev_nm_svc_integration_test_harness:
  sandbox_pgdata:
  sandbox_workspace:
  dpf_tts_voices:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  dpf_stt_models:
