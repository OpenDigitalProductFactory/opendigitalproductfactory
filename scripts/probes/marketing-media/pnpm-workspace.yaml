strictDepBuilds: true

# This probe resolves independently of the root workspace, so the root
# pnpm-workspace.yaml overrides do not reach it — security floors must be
# repeated here.
overrides:
  # hono < 4.12.34: GHSA-8j4g-w8fx-2239 / CVE-2026-69207 ReDoS in the CORS
  # middleware via a crafted Access-Control-Request-Headers value
  # (Dependabot #140, medium). Transitive of hyperframes, which declares an
  # open `hono: ^4` range. Floor to the patched 4.12.34.
  hono: '^4.12.34'
  # nanoid < 3.3.17: GHSA-2v37-7h3g-55p8 (Dependabot #152, high) — predictable
  # output when given a non-integer size. Transitive in this probe's tree
  # (resolves to 3.3.16); the root floor does not reach this standalone
  # project. Floor the 3.x line to the patched 3.3.17.
  'nanoid@<3.3.17': '^3.3.17'
  # source-map-js >= 1.0.0 < 1.2.2: GHSA-68fv-2mgg-jv7q / CVE-2026-93749
  # (Dependabot #224, high). Indexed source-map section offsets can stall the
  # event loop. css-tree and postcss resolve 1.2.1. The root floor does not
  # reach this standalone probe. Patch floor.
  'source-map-js@<1.2.2': '1.2.2'
  # undici < 7.30.1: 29 advisories (Dependabot #270-#298; 10 high), among them
  # GHSA-4w7w-5xrc-9h26 (#298), GHSA-2m5v-pch6-74hx (#297),
  # GHSA-qrxm-fqhp-jwvm (#296), GHSA-xjj6-f33q-929c (#293),
  # GHSA-rfgv-xxqx-mfg5 (#288), GHSA-w293-vg96-wgc3 (#284),
  # GHSA-4cwx-7wf7-3272 (#277), GHSA-vxpw-j846-p89q (#274),
  # GHSA-hm92-r4w5-c3mj (#273), GHSA-vmh5-mc38-953g (#271). Transitive in this
  # standalone probe (resolves to 7.25.0); the root floor does not reach it.
  # Floor the 7.x line to the patched 7.30.1, which clears every open alert.
  'undici@<7.30.1': '^7.30.1'

allowBuilds:
  "@google/genai@1.52.0": false
  "esbuild@0.25.12": false
  "ffmpeg-static@5.3.0": true
  "onnxruntime-node@1.21.1": false
  "protobufjs@7.6.5": false
