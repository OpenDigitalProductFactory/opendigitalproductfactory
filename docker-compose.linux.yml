# Linux deployment overlay (native Docker Engine; no Docker Desktop).
#
# Usage:
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.release.yml \
#                  -f docker-compose.linux.yml up -d
#
# (or use scripts/installer/lib/compose.sh which assembles the chain
#  for you per the host platform.)
#
# Per the deployment doctrine:
#
#   - Docker Model Runner is built into Docker Desktop and is NOT
#     available on native Linux Docker Engine. Per Doctrine Contract 9
#     (LLM and agent-provider routing), the default LLM provider on
#     Linux native Docker is Ollama running in compose. This overlay
#     adds the `ollama` service and overrides LLM_BASE_URL on every
#     LLM consumer (portal, sandbox, browser-use) to point at it.
#
#   - The Linux-only host telemetry exporters (cadvisor + node-exporter)
#     are enabled here because their bind mounts (/proc, /sys,
#     /var/lib/docker, /) work natively on Linux. The base compose file
#     keeps them behind a profile so Windows/macOS installs do not scrape
#     targets that cannot exist there.

services:
  prometheus:
    volumes:
      - ./monitoring/prometheus/prometheus.linux.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  cadvisor:
    # Base compose gates this service behind linux-monitoring. The Linux
    # overlay removes that profile so the Prometheus scrape config mounted
    # above always has a matching exporter container.
    profiles: !reset []

  node-exporter:
    # Keep Linux host metrics aligned with monitoring/prometheus/prometheus.linux.yml.
    profiles: !reset []

  # Local LLM provider for non-Docker-Desktop substrates. Lightweight
  # CPU-only by default; customers with GPU passthrough can add
  # device reservations.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Override LLM_BASE_URL for every consumer so the in-cluster ollama
  # service is the default. Customers with their own external LLM
  # endpoint can override LLM_BASE_URL in .env to take precedence.
  portal:
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      # Management API for pull/delete/tags — distinct from the OpenAI-compatible
      # inference endpoint above. Used by the portal's Ollama provider routes.
      OLLAMA_INTERNAL_URL: ${OLLAMA_INTERNAL_URL:-http://ollama:11434}
    depends_on:
      ollama:
        condition: service_healthy

  sandbox:
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}

  browser-use:
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}

volumes:
  ollama_data:
