groups:
  - name: dpf_infrastructure
    rules:
      # ─── Container Health ──────────────────────────────────
      - alert: ContainerDown
        expr: up{job!~"cadvisor|node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.instance }} has been unreachable for over 1 minute."

      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name=~"dpf-.*"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} CPU above 80%"

      - alert: ContainerHighMemory
        expr: container_memory_usage_bytes{name=~"dpf-.*"} / container_spec_memory_limit_bytes{name=~"dpf-.*"} * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} memory above 85%"

      - alert: ContainerRestarting
        expr: increase(container_restart_count{name=~"dpf-.*"}[1h]) > 3
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarted {{ $value }} times in 1h"

      # ─── Host Resources ───────────────────────────────────
      - alert: HostHighCPU
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage above 85% for 10 minutes"

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage above 85%"

      - alert: HostDiskPressure
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host disk usage above 80%"

      - alert: HostDiskCritical
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host disk usage above 90% -- immediate attention required"

      # ─── Network Topology ──────────────────────────────────
      # node-exporter runs inside the Docker Desktop WSL2 VM; its eth0 is a
      # transient VM-internal NIC and is not a reliable signal. Real physical
      # host interfaces are scraped from windows_exporter (`windows-host` job).
      - alert: HostNetworkInterfaceDown
        expr: node_network_up{device!~"lo|eth.*|veth.*|br-.*|docker.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Network interface {{ $labels.device }} is down"
          description: "Physical or virtual network interface {{ $labels.device }} has been down for over 1 minute. Impact may propagate to services on this subnet."

  - name: dpf_databases
    rules:
      - alert: PostgresConnectionSaturation
        expr: pg_stat_activity_count / pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection pool above 80% ({{ $value }}%)"

      - alert: PostgresDown
        expr: pg_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable"

      - alert: QdrantDown
        expr: up{job="qdrant"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Qdrant vector DB is unreachable -- AI Coworker memory offline"

      # neo4j exposes no Prometheus metrics, so it cannot be a scrape target;
      # the portal probes its HTTP API and exports dpf_dependency_up{service}. [BI-963DBB05]
      - alert: Neo4jDown
        expr: dpf_dependency_up{service="neo4j"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Neo4j graph DB is unreachable -- code graph + architecture views offline"

  - name: dpf_application
    rules:
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, rate(dpf_http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile request latency above 5s"

      - alert: HighErrorRate
        expr: rate(dpf_http_requests_total{status_code=~"5.."}[5m]) / rate(dpf_http_requests_total[5m]) * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx error rate above 5%"

      # AIInferenceDown was removed: Docker Model Runner does not expose a
      # Prometheus metrics endpoint, so `up{job="model-runner"}` was always 0.
      # Inference failures now surface via AIInferenceHighLatency and via
      # `dpf_http_requests_total{status_code=~"5.."}` on the portal job.

      - alert: AIInferenceHighLatency
        expr: histogram_quantile(0.95, rate(dpf_ai_inference_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI inference p95 latency above 30s"

      - alert: SemanticMemoryStoreFailures
        expr: rate(dpf_semantic_memory_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Semantic memory store/recall failing -- AI Coworker context degraded"

      # Voice (TTS) service health (BI-B2E777EB).
      # dpf-tts is /health-only (no /metrics) -> not a scrape target, so
      # ContainerDown (up==0) cannot see it. The portal exposes
      # dpf_voice_tts_up/_enabled on /api/metrics. Alert only when narration is
      # actually enabled, to avoid noise on installs that do not use voice.
      - alert: VoiceServiceDown
        expr: dpf_voice_tts_enabled == 1 and dpf_voice_tts_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Voice narration enabled but the TTS service is down"
          description: "A voice profile has narration enabled but the text-to-speech sidecar (dpf-tts) is unreachable -- WWMD decision narration and voice previews will fail."

      # Global unhandled-error signal via the Next.js onRequestError hook (the
      # portal has no per-request HTTP instrumentation). NOTE: HighRequestLatency
      # / HighErrorRate above additionally need per-request timing+status wiring
      # (a route wrapper) to go live -- the remaining half of BI-994B504C.
      - alert: UnhandledServerErrors
        expr: sum(rate(dpf_http_unhandled_errors_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Portal is throwing unhandled server errors (sustained > 3/min)"

      # ─── Log Aggregation (EP-FULL-OBS Tier 2) ──────────────────
      # Loki drops lines when a container floods stdout past the per-stream
      # rate cap (disk-safety). A throttle is itself a strong "something is
      # very wrong" signal. Keys on Loki's own Prometheus metric (scraped via
      # the loki job), so it lives here -- NOT in the LogQL ruler, where a
      # PromQL expression is a parse error that fails the whole rule group.
      - alert: LogIngestionThrottled
        expr: sum(rate(loki_discarded_samples_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Loki is dropping logs -- a container is flooding stdout past the rate cap"

  # ─── Windows Host Resources (windows_exporter) ─────────────────
  # The dpf_infrastructure Host* rules key on node_exporter (node_*) metrics,
  # which are NOT collected on Windows (node-exporter is linux-monitoring-
  # profiled). windows_exporter IS scraped (job windows-host) but no rule used
  # it -- so host CPU/mem/disk on the Windows GA platform had ZERO alerting.
  # These mirror the node_* rules using windows_* series; Linux installs keep
  # the node_* rules. [BI-573438C1]
  - name: dpf_windows_host
    rules:
      - alert: WindowsHostHighCPU
        expr: 100 - (avg(rate(windows_cpu_time_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Windows host CPU above 85% for 10 minutes"

      - alert: WindowsHostHighMemory
        expr: (1 - windows_memory_available_bytes / windows_cs_physical_memory_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Windows host memory above 85%"

      - alert: WindowsHostDiskPressure
        expr: (1 - windows_logical_disk_free_bytes{volume=~"[A-Z]:"} / windows_logical_disk_size_bytes{volume=~"[A-Z]:"}) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Windows host disk {{ $labels.volume }} above 80%"

      - alert: WindowsHostDiskCritical
        expr: (1 - windows_logical_disk_free_bytes{volume=~"[A-Z]:"} / windows_logical_disk_size_bytes{volume=~"[A-Z]:"}) * 100 > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Windows host disk {{ $labels.volume }} above 90% -- immediate attention required"
