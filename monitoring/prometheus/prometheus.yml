global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  # ─── Infrastructure ──────────────────────────────────────────
  # Linux-only exporter targets live in prometheus.linux.yml, which the
  # docker-compose.linux.yml overlay mounts when those services are available.

  # ─── Databases ───────────────────────────────────────────────
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Neo4j Community Edition does not expose Prometheus metrics.
  # Neo4j Enterprise users: uncomment and add NEO4J_server_metrics_prometheus_enabled
  # to the neo4j service environment in docker-compose.yml.
  # - job_name: "neo4j"
  #   scrape_interval: 30s
  #   static_configs:
  #     - targets: ["neo4j:2004"]
  #   metrics_path: /metrics

  - job_name: "qdrant"
    scrape_interval: 30s
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: /metrics

  # ─── Application ────────────────────────────────────────────
  - job_name: "portal"
    static_configs:
      - targets: ["portal:3000"]
    metrics_path: /api/metrics

  - job_name: "sandbox"
    static_configs:
      - targets:
          - "sandbox:3000"
    metrics_path: /api/metrics

  # ─── Background jobs (Inngest) ──────────────────────────────
  # If inngest wedges, scheduled tasks (builds, promotions, hive ingests,
  # release-bundle automation) queue forever and never run while
  # Prometheus / the portal still look healthy. Scrape its /metrics so the
  # Health tab can surface the outage instead.
  - job_name: "inngest"
    static_configs:
      - targets: ["inngest:8288"]

  # ─── ADP (payroll/HRIS MCP) ─────────────────────────────────
  # GET /metrics added in services/adp/src/server.ts. Default-process
  # metrics + per-tool latency histogram + error counter.
  - job_name: "adp"
    static_configs:
      - targets: ["adp:8600"]

  # ─── Redis (via redis-exporter sidecar) ─────────────────────
  # The redis-exporter container scrapes redis:6379 INFO and exposes it on
  # :9121/metrics. Defined in docker-compose.yml alongside redis itself.
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # ─── Services without a /metrics endpoint ───────────────────
  # dpf-stt (whisper-server) ships without /metrics — STT visibility is
  # via portal-side counters (dpf_voice_stt_*) exposed on the portal's
  # /api/metrics. The Health tab surfaces it as a "Portal metrics" tile.

  # ─── AI Inference ───────────────────────────────────────────
  # Docker Model Runner does not expose a Prometheus `/metrics` endpoint
  # (all paths 404). Inference health is tracked via the portal's
  # `dpf_ai_inference_duration_seconds_*` application metrics instead.
  # If/when Model Runner ships a metrics endpoint, re-add the scrape here.

  # ─── Windows Host (real hardware via windows_exporter) ───────
  # windows_exporter runs natively on the Windows host (not in Docker).
  # Discovers real network interfaces, disk, memory — not WSL2 VM.
  - job_name: "windows-host"
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:9182"]
        labels:
          instance: "windows-host"

  # ─── Self-monitoring ────────────────────────────────────────
  - job_name: "prometheus"
    scrape_interval: 30s
    static_configs:
      - targets: ["localhost:9090"]
