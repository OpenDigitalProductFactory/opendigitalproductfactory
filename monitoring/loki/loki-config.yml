# Loki single-binary config for the DPF platform (EP-FULL-OBS Tier 2).
# Filesystem-backed, label-indexed, 14-day retention to match Prometheus' 15d.
# Brought up alongside the always-on prometheus/grafana stack. Cross-platform:
# Loki itself touches no host paths; the log SOURCE is Alloy (see
# monitoring/alloy/config.alloy), which reads the Docker log API.
#
# Verified-on-bring-up: this config is reviewed structurally; functional
# verification is `docker compose up -d loki` + GET :3100/ready + a LogQL query
# returning live lines (the Phase-1 acceptance in the owning spec).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 14-day retention (compactor enforces deletion below).
  retention_period: 336h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Disk-safety: cap a single pathological stream so a flooding container
  # (the Mac-incident shape) cannot fill the disk. Excess is dropped and the
  # drop is itself an alert condition (LogIngestionThrottled in the rules).
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 0
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m

# Ruler: evaluates the LogQL alert rules and forwards firing alerts to the
# same Alertmanager/webhook path Tier 1 already uses to reach
# /api/platform/alerts -> PortfolioQualityIssue. alertmanager_url is wired at
# bring-up; left unset here so Loki starts cleanly even before the webhook
# bridge exists (rules still evaluate and are visible via the ruler API).
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules-config
  rule_path: /loki/rules-scratch
  ring:
    kvstore:
      store: inmemory
  enable_api: true

analytics:
  reporting_enabled: false
