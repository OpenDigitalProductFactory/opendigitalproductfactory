<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Provider pause prototype</title>
<style>
:root {color-scheme:light dark;--dpf-bg:light-dark(#f7f9fb,#101820);--dpf-surface:light-dark(#fff,#17232e);--dpf-text:light-dark(#17232e,#e7eff5);--dpf-muted:light-dark(#526676,#a6bac8);--dpf-border:light-dark(#d3dfe8,#3e5263);--dpf-accent:light-dark(#005a70,#64d4e7)}
body{font:16px system-ui;background:var(--dpf-bg);color:var(--dpf-text);margin:0;padding:40px} main{max-width:700px;margin:auto}section{background:var(--dpf-surface);border:1px solid var(--dpf-border);border-radius:12px;padding:24px}button,select,input{font:inherit;padding:10px 14px;border-radius:6px;border:1px solid var(--dpf-border);background:var(--dpf-surface);color:var(--dpf-text)}button{cursor:pointer}button.primary{color:var(--dpf-accent);border-color:var(--dpf-accent)}.muted{color:var(--dpf-muted)}label{display:block;margin:16px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}[hidden]{display:none}
</style><main><p class="muted">Platform / AI providers · Interactive prototype</p><h1>Local AI</h1><section>
<h2 id="state">Available</h2><p id="explanation">New work can use this provider.</p><div class="actions"><button id="pause" class="primary">Pause now</button><button id="resume" hidden>Resume now</button><button id="change" hidden>Change pause</button></div>
<form id="settings" hidden><h3>Resume local AI</h3><label>When <select id="when"><option value="manual">Until I enable it</option><option value="timed">After a duration</option></select></label><div id="duration" hidden><label>Duration <input id="amount" type="number" min="1" max="365" step="1" value="6" style="width:70px"> <select id="unit" aria-label="Duration unit"><option value="hours">hours</option><option value="days">days</option></select></label></div><p class="muted">The provider stays paused while you choose. Requests already running may finish.</p><div class="actions"><button class="primary" type="submit">Save pause</button><button type="button" id="close">Keep current pause</button></div></form>
<p class="muted">Automatic resume restores eligibility. Health and account restrictions still apply.</p><p id="feedback" role="status"></p>
</section></main><script>
let paused=false,until=null;const el=id=>document.getElementById(id);
function render(){el('state').textContent=paused?'Paused':'Available';el('explanation').textContent=paused?(until?'Resumes '+until.toLocaleString():'Paused until you enable it. No new requests use local AI.'):'New work can use this provider.';el('pause').hidden=paused;el('resume').hidden=!paused;el('change').hidden=!paused}
el('pause').onclick=()=>{paused=true;until=null;render();el('settings').hidden=false;el('feedback').textContent='Local AI paused.'};el('change').onclick=()=>el('settings').hidden=false;el('resume').onclick=()=>{paused=false;until=null;el('settings').hidden=true;render();el('feedback').textContent='Pause removed. Provider eligibility restored.'};el('when').onchange=()=>el('duration').hidden=el('when').value==='manual';el('close').onclick=()=>el('settings').hidden=true;el('settings').onsubmit=e=>{e.preventDefault();until=el('when').value==='timed'?new Date(Date.now()+Number(el('amount').value)*(el('unit').value==='days'?86400000:3600000)):null;paused=true;render();el('settings').hidden=true;el('feedback').textContent='Pause saved.'};render();
</script></html>
