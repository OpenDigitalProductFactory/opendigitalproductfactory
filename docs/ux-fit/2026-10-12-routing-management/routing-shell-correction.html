<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Routing · compact shell study</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7f7,#0b101b);--surface:light-dark(white,#111826);--text:light-dark(#172c29,#e6efed);--border:light-dark(#cad9d4,#34483f);--accent:light-dark(#236c56,#70c9a1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui}button,select,summary,a{font:inherit;color:inherit}button,select,summary{min-height:44px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:10px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border)}.identity{min-width:0;display:flex;align-items:center;gap:8px}.home{flex:none;display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--border);border-radius:8px;text-decoration:none}.estate{min-width:0;overflow-wrap:anywhere;font-size:12px}.actions{display:flex;gap:8px;align-items:center;flex:none}details{position:relative}summary{cursor:pointer}details[open] .popover{position:absolute;z-index:2;right:0;width:220px;max-width:calc(100vw - 24px);display:grid;padding:12px;background:var(--surface);border:1px solid var(--border);box-shadow:0 8px 24px #0003}.popover a{padding:12px}main{max-width:1100px;margin:auto;padding:16px}.nav,.filters,.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.nav select,.filters select{min-width:0;width:100%}.freshness{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.stats>div{border:1px solid var(--border);border-radius:8px;padding:16px}.stats strong{display:block;font-size:24px}.filters{margin-bottom:16px}label{display:grid;gap:4px}h1{font-size:24px}.notice{font-size:12px;color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
<header><div class="identity"><a class="home" href="routing-explorer.html" aria-label="Workspace home">DPF</a><span class="estate">DEMO DEV</span></div><div class="actions"><span title="Platform healthy" aria-label="Platform healthy">●</span><details id="account"><summary>Account</summary><div class="popover"><a href="routing-explorer.html">Help for this page</a><button id="feedback">Feedback</button><button id="signout">Sign out</button></div></details></div></header>
<main><p class="notice">Clickable shell study · illustrative data · no account or policy changes</p><div class="nav"><select aria-label="Platform area"><option>AI Operations</option><option>Overview</option></select><select aria-label="Routing management"><option>Traffic</option><option>Evaluation</option><option>Providers</option></select></div><div class="freshness"><span id="fresh" title="Automatically refreshed every 45 seconds">Live · just now</span><button id="refresh">Refresh</button></div><h1>Routing management</h1><div class="filters"><label>Task<select><option>All tasks</option><option>Review</option></select></label><label>Provider<select><option>All providers</option><option>Local</option></select></label><label>Data<select><option>All data</option><option>Internal</option></select></label><label>Window<select><option>1 hour</option><option>24 hours</option></select></label></div><div class="stats"><div>Routed decisions<strong>248</strong></div><div>Execution success<strong>98%</strong></div><div>Errors / blocks<strong>5 / 3</strong></div><div>Recorded cost<strong>$1.24</strong></div></div><p><a href="routing-explorer.html">Open the complete routing prototype</a></p><p id="result" role="status"></p></main>
<script>
const menu=document.querySelector('#account');document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu.open){menu.open=false;menu.querySelector('summary').focus()}});document.querySelector('#refresh').onclick=()=>document.querySelector('#fresh').textContent='Live · refreshed now';for(const id of ['feedback','signout'])document.getElementById(id).onclick=()=>{document.querySelector('#result').textContent='Prototype only — '+id+' action previewed. No account change.';menu.open=false};
</script></html>
