<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local model settings — engine control prototype</title>
<style>:root{color-scheme:light dark;--dpf-text:CanvasText;--dpf-surface:Canvas;--dpf-border:GrayText}body{font:16px system-ui;background:var(--dpf-surface);color:var(--dpf-text);max-width:760px;margin:3rem auto;padding:1rem}section{border:1px solid var(--dpf-border);border-radius:8px;padding:1rem}button,select{font:inherit;padding:.5rem .75rem}dialog{max-width:480px;border:1px solid var(--dpf-border);border-radius:8px}p{line-height:1.5}</style>
<main><h1>Local model settings</h1><p>Interactive prototype. Its controls have no connection to a host or model.</p>
<label>Preview state <select id="preview"><option value="ready">Qualified change ready</option><option value="waiting">Processing window unavailable</option><option value="native">Managed engine selected</option><option value="unknown">Outcome uncertain</option></select></label>
<section aria-labelledby="heading"><h2 id="heading">Local inference engine</h2><p id="message"></p><button id="change"></button> <button id="observe" hidden>Check original request</button><p id="result" role="status"></p></section>
<dialog id="confirm"><h2 id="title"></h2><p id="impact"></p><button id="cancel">Keep current engine</button> <button id="approve">Confirm change</button></dialog></main>
<script>
const preview=document.querySelector('#preview'),change=document.querySelector('#change'),confirm=document.querySelector('#confirm');
const activate='Pause new local work, switch this Mac to the tested engine, and verify it before accepting requests. Keep the current models and settings. Restore Docker if the switch fails. Also allow this host agent to perform this managed engine procedure.';
const rollback='Pause new local work, stop the managed engine, and restore Docker with the recorded model settings. Verify restoration before accepting requests.';
function render(){const s=preview.value;document.querySelector('#result').textContent='';change.hidden=!['ready','native'].includes(s);document.querySelector('#observe').hidden=s!=='unknown';change.textContent=s==='native'?'Restore Docker':'Use tested engine';document.querySelector('#message').textContent={ready:'A tested engine is ready for this Mac. The current models and settings are preserved.',waiting:'The change is waiting for its reserved processing window. The current engine stays selected.',native:'The managed engine is selected. Live performance verification is reported separately.',unknown:'The previous change has an uncertain outcome. Resolve it before another switch.'}[s];}
preview.onchange=render;change.onclick=()=>{document.querySelector('#title').textContent=preview.value==='native'?'Restore Docker?':'Use the tested engine?';document.querySelector('#impact').textContent=preview.value==='native'?rollback:activate;confirm.showModal();};document.querySelector('#cancel').onclick=()=>confirm.close();document.querySelector('#approve').onclick=()=>{confirm.close();document.querySelector('#result').textContent='Prototype: change request queued. This is not a completed engine switch.';change.hidden=true;document.querySelector('#observe').hidden=false;};document.querySelector('#observe').onclick=()=>{document.querySelector('#result').textContent='Prototype: the original request remains unconfirmed. Keep its identity after reload and check again before another switch.';};render();
</script></html>
