<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account identity prototype</title>
<style>
:root{--dpf-bg:#f6f7f9;--dpf-surface-1:#fff;--dpf-text:#202832;--dpf-muted:#566273;--dpf-border:#d4dae2;--dpf-accent:#235f88}*{box-sizing:border-box}body{margin:0;background:var(--dpf-bg);color:var(--dpf-text);font:16px system-ui}header{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--dpf-border);background:var(--dpf-surface-1);gap:12px}details{position:relative;min-width:0}summary{min-height:44px;max-width:180px;cursor:pointer;padding:10px;border:1px solid var(--dpf-border);border-radius:24px;overflow-wrap:anywhere}.panel{position:absolute;right:0;top:calc(100% + 8px);width:min(300px,calc(100vw - 32px));padding:20px;border:1px solid var(--dpf-border);border-radius:12px;background:var(--dpf-surface-1);box-shadow:0 8px 24px #0002;overflow-wrap:anywhere}dt{color:var(--dpf-muted);font-size:13px;margin-top:16px}dd{margin:4px 0}button{min-height:44px;padding:8px 16px;color:var(--dpf-text);background:var(--dpf-surface-1);border:1px solid var(--dpf-border);border-radius:20px}main{padding:24px;max-width:800px}small{color:var(--dpf-muted)}
</style>
<header><strong>Example organization</strong><details><summary aria-label="Signed in as Alex Morgan — account details">Alex Morgan</summary><section class="panel" aria-label="Your account"><small>Signed in as</small><p><strong>Alex Morgan</strong><br>alex@example.com</p><dl><dt>Role</dt><dd>Administrator</dd><dt>Organization</dt><dd>Example organization</dd></dl><button onclick="this.textContent='Signing out…'">Sign out</button></section></details></header>
<main><h1>Your workspace</h1><p>Open the name in the header to identify the current account.</p><small>Prototype with illustrative data. No live account actions.</small></main>
</html>
