# DPF Edge Node — operator overlay.
#
# Brings up an Edge Node container alongside the Authority Core
# (portal) in the same compose project. This is the simplest
# Phase 0 deployment: one Edge Node, one Authority, one host.
#
# Multi-host (Edge Node on a separate machine from Authority) and
# native binary modes (macOS / Windows) are out of scope for this
# overlay — they ship in T2 and T3 of the parent installer roadmap.
#
# Spec:    docs/superpowers/specs/2026-05-09-dpf-edge-node-design.md
# Roadmap: docs/superpowers/plans/2026-05-12-edge-node-phase0-roadmap.md A6
#
# ─── Usage ──────────────────────────────────────────────────────────
#
# 1. In the portal: Admin > Platform Development > Edge Nodes,
#    click "Issue bootstrap token", copy the token (15 min TTL,
#    single-use).
#
# 2. Put the token in your local .env (NEVER commit the .env):
#
#      DPF_BOOTSTRAP_TOKEN=dpfedge_xxxxxxxxxxxxxxxx
#
# 3. Bring up the Edge Node alongside the portal. Pick the profile
#    that matches your host substrate. The deployment-matrix spec at
#    docs/superpowers/specs/2026-05-20-edge-node-deployment-matrix.md
#    explains why each scenario takes its own path:
#
#      # Linux bare-metal / VM — container shares host network and
#      # sees real LAN. This is the only host class where the
#      # container path delivers full discovery fidelity.
#      docker compose -f docker-compose.yml \
#                     -f docker-compose.linux.yml \
#                     -f docker-compose.edge.yml \
#                     --profile linux-host-network up -d edge-node-host
#
#      # Linux operators who want LAN-isolation between the edge node
#      # and the host: see docker-compose.edge.macvlan.yml overlay
#      # (Linux only; not for Docker Desktop).
#
#      # Docker Desktop (Windows OR macOS) — container can only see
#      # Docker's internal services network (192.168.65.x), NOT your
#      # real LAN, EVEN WITH `network_mode: host` AND WSL2 mirrored
#      # networking enabled. Docker Engine isolates containers from
#      # the host network on Docker Desktop regardless of compose
#      # config; verified on Win 11 + WSL 2.6 + Docker Desktop 4.34+.
#      # The Mode 4 native binary (per the 2026-05-16 ADR) is the
#      # canonical answer for these hosts. Until that ships, the
#      # bridge-mode container enrolls + submits host-info but
#      # discovery is limited to the Docker bridge.
#      docker compose -f docker-compose.yml \
#                     -f docker-compose.edge.yml up -d edge-node
#
# 4. Watch the logs; within ~30s the Edge Node should enroll, and
#    within ~1 sweep interval (default 5 min) it submits its first
#    discovery run. Verify in the portal:
#      Admin > Platform Development > Edge Nodes
#        - row exists, trustState=trusted, lastSeenAt within 60s
#        - one DiscoveryRun visible with edgeNodeId populated
#
# ─── Image source ───────────────────────────────────────────────────
#
# Default: pull `ghcr.io/${GHCR_OWNER:-opendigitalproductfactory}/dpf-edge-node:${DPF_IMAGE_TAG:-latest}`
# matching the rest of the DPF release artifacts (Contract 1 of the
# deployment doctrine). For dev workflow against unreleased changes,
# uncomment the `build:` block instead of `image:`.

services:
  edge-node:
    # Compose uses `image` as the local tag; if it can't pull (GHCR auth
    # denied, offline, dev branch not released yet), `build` runs and tags
    # the resulting image with the `image` name. Operators don't have to
    # swap blocks manually for dev vs release.
    image: ghcr.io/${GHCR_OWNER:-opendigitalproductfactory}/dpf-edge-node:${DPF_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/edge-node/Dockerfile
    pull_policy: missing
    restart: unless-stopped
    environment:
      # Authority Core URL — point at the portal service in the same
      # compose project. The compose internal DNS resolves `portal`
      # to the portal container. Override DPF_AUTHORITY_URL in .env
      # if running the Edge Node against a remote Authority.
      DPF_AUTHORITY_URL: ${DPF_AUTHORITY_URL:-http://portal:3000}

      # Bootstrap token. REQUIRED on first run; consumed and
      # discarded. After successful enrollment the node uses its
      # state-stored node token, so this can be safely unset on
      # subsequent runs.
      #
      # Issue a token in the portal: Admin > Platform Development >
      # Edge Nodes > Issue bootstrap token.
      DPF_BOOTSTRAP_TOKEN: ${DPF_BOOTSTRAP_TOKEN:-}

      # Operator-friendly node name (shows up in the admin UI).
      # Defaults to the container hostname, which inside compose is
      # the service name — usually not what an operator wants. Set
      # this to a descriptive name like the host's actual hostname.
      DPF_EDGE_NODE_NAME: ${DPF_EDGE_NODE_NAME:-edge-node-1}

      # Install mode classification for the audit + admin UI:
      #   container-host = running inside a container on a Linux/macOS host
      #   container-vm   = running inside a container in a VM (Docker Desktop)
      #   native         = running as a host binary (Phase 1+)
      DPF_INSTALL_MODE: ${DPF_INSTALL_MODE:-container-host}

      # State directory inside the container; matches the Dockerfile
      # default + the volume mount below.
      DPF_EDGE_STATE_DIR: /var/lib/dpf-edge-node

      # Federation-candidate scan (BI-105966A1). On by default; set
      # DPF_FEDERATION_SCAN=0 to stay unfindable.
      #
      # DPF_FEDERATION_SCAN_HOSTS matters on Docker Desktop: the container sees
      # only Docker's own network, so its ARP cache never shows the LAN and the
      # scan has nothing to probe. Name the hosts explicitly there (the Mode 4
      # native binary is the real answer; see the deployment matrix). On the
      # linux-host-network profile the ARP cache is the LAN and this can stay
      # empty.
      DPF_FEDERATION_SCAN: ${DPF_FEDERATION_SCAN:-}
      DPF_FEDERATION_SCAN_HOSTS: ${DPF_FEDERATION_SCAN_HOSTS:-}
      DPF_FEDERATION_SCAN_ENDPOINTS: ${DPF_FEDERATION_SCAN_ENDPOINTS:-}

    volumes:
      # State (node token, intervals, capabilities). Survives
      # restarts; rebuilds preserve enrollment.
      - edge_node_state:/var/lib/dpf-edge-node

    depends_on:
      portal:
        condition: service_healthy

    # Phase 0 doesn't need any extra capabilities. The host-info
    # collector uses Node's `os` module which doesn't require
    # CAP_NET_ADMIN / CAP_SYS_PTRACE. Future collectors that scan
    # the LAN (subnet sweep, ARP) will need either `network_mode:
    # host` (the linux-host-network profile below) or
    # CAP_NET_RAW on a bridge network.

    healthcheck:
      # The container is healthy if the state directory exists and
      # the Node process is up. We avoid a more invasive probe
      # (e.g. hitting the Authority) so a brief Authority outage
      # doesn't restart-loop the Edge Node — its own retry buffer
      # handles transient Authority unavailability.
      test:
        - CMD
        - node
        - -e
        - "process.exit(0)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Linux host-network profile ────────────────────────────────────
  #
  # Linux ONLY. Activates `network_mode: host` so the container shares
  # the Linux host's network namespace and discovers the real LAN.
  #
  # `network_mode: host` disables compose-internal DNS — set
  # DPF_AUTHORITY_URL to a host-reachable address (typically
  # http://localhost:3000 when the portal runs on the same host, or
  # the LAN IP when Authority lives elsewhere).
  #
  #   docker compose ... --profile linux-host-network up -d edge-node-host
  #
  # Where this profile does NOT work — verified on 2026-05-20:
  #   - Docker Desktop on Windows (any version, including Win 11 +
  #     Docker Desktop 4.34+ + WSL2 mirrored networking). Docker Engine
  #     isolates containers from the host network with its own services
  #     bridge (192.168.65.0/24) that mirrored mode does not cross.
  #   - Docker Desktop on macOS. Same reason; LinuxKit VM has no
  #     mirrored-mode equivalent either way.
  # Both host classes should use the Mode 4 native binary per the
  # 2026-05-16 ADR. See:
  #   docs/superpowers/specs/2026-05-20-edge-node-deployment-matrix.md
  edge-node-host:
    profiles:
      - linux-host-network
    image: ghcr.io/${GHCR_OWNER:-opendigitalproductfactory}/dpf-edge-node:${DPF_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/edge-node/Dockerfile
    pull_policy: missing
    restart: unless-stopped
    network_mode: host
    environment:
      DPF_AUTHORITY_URL: ${DPF_AUTHORITY_URL:-http://localhost:3000}
      DPF_BOOTSTRAP_TOKEN: ${DPF_BOOTSTRAP_TOKEN:-}
      DPF_EDGE_NODE_NAME: ${DPF_EDGE_NODE_NAME:-edge-node-host-1}
      DPF_INSTALL_MODE: ${DPF_INSTALL_MODE:-container-host}
      DPF_EDGE_STATE_DIR: /var/lib/dpf-edge-node

      # Federation-candidate scan (BI-105966A1). On by default; set
      # DPF_FEDERATION_SCAN=0 to stay unfindable.
      #
      # DPF_FEDERATION_SCAN_HOSTS matters on Docker Desktop: the container sees
      # only Docker's own network, so its ARP cache never shows the LAN and the
      # scan has nothing to probe. Name the hosts explicitly there (the Mode 4
      # native binary is the real answer; see the deployment matrix). On the
      # linux-host-network profile the ARP cache is the LAN and this can stay
      # empty.
      DPF_FEDERATION_SCAN: ${DPF_FEDERATION_SCAN:-}
      DPF_FEDERATION_SCAN_HOSTS: ${DPF_FEDERATION_SCAN_HOSTS:-}
      DPF_FEDERATION_SCAN_ENDPOINTS: ${DPF_FEDERATION_SCAN_ENDPOINTS:-}
    volumes:
      - edge_node_state_host:/var/lib/dpf-edge-node

volumes:
  edge_node_state:
  edge_node_state_host:
