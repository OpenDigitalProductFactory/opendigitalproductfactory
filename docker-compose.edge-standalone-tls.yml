# DPF Edge Node — TLS overlay for the standalone compose.
#
# Adds the CA-bundle mount + NODE_EXTRA_CA_CERTS env so the Edge Node
# trusts a self-signed or private-PKI cert presented by the Authority
# Core. Pair with docker-compose.edge-standalone.yml:
#
#   docker compose -f docker-compose.edge-standalone.yml \
#                  -f docker-compose.edge-standalone-tls.yml \
#                  up -d
#
# Spec:    docs/superpowers/specs/2026-05-09-dpf-edge-node-design.md
# Plan:    docs/superpowers/plans/2026-05-12-edge-node-t2-multi-host-lan.md (T2.2)
# Helper:  scripts/issue-authority-tls-cert.sh
#          (runs on the Authority host; produces the ca-bundle.crt
#           this overlay mounts)
#
# ─── Required environment ──────────────────────────────────────────
#
# In your .env on this Edge Node host, set:
#
#   # HTTPS URL of the Authority Core. Must match the CN / SAN of the
#   # cert produced by scripts/issue-authority-tls-cert.sh.
#   DPF_AUTHORITY_URL=https://dpf-authority.lan:443
#
#   # Host path to the CA bundle you copied from the Authority host
#   # (the ca-bundle.crt file produced by issue-authority-tls-cert.sh,
#   # transferred via scp / Ansible / your preferred secure channel).
#   DPF_AUTHORITY_CA_CERT=/etc/dpf-edge/ca-bundle.crt
#
# Required directory on this host:
#
#   /etc/dpf-edge/ca-bundle.crt   readable by docker (mode 0644 is fine)
#
# If DPF_AUTHORITY_CA_CERT is unset OR points at a path that doesn't
# exist, compose refuses to bring the service up — surfacing the
# misconfiguration loudly rather than silently falling back to a
# CA-unknown HTTPS connection that fails at runtime.

services:
  edge-node:
    environment:
      # Node's TLS layer reads NODE_EXTRA_CA_CERTS at process startup
      # and adds the listed cert(s) to the trust store (additive — the
      # system store still works for public-CA HTTPS). undici (the
      # HTTP client the Edge Node uses) inherits this trust store
      # automatically.
      NODE_EXTRA_CA_CERTS: /etc/ssl/dpf/ca-bundle.crt

    volumes:
      # Host -> container bind mount, read-only. The host path comes
      # from DPF_AUTHORITY_CA_CERT in .env; the container path is
      # fixed at /etc/ssl/dpf/ca-bundle.crt so the env above is
      # constant across deployments. The ${VAR:?...} expansion makes
      # compose refuse to start if DPF_AUTHORITY_CA_CERT is unset.
      - ${DPF_AUTHORITY_CA_CERT:?DPF_AUTHORITY_CA_CERT is required for the TLS overlay — set it in .env to the host path of your ca-bundle.crt}:/etc/ssl/dpf/ca-bundle.crt:ro
